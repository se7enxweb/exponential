# Exponential 6: demo mode for a public demo, passed by nginx to PHP-FPM
#
# Free documentation: GFDL 1.3 or later, see doc/en/us/README-LICENSE.md.
#
# nginx has no environment of its own for PHP: pass the variable as a FastCGI
# parameter in every location that hands a request to PHP-FPM, in the demo's
# server block only (see doc/en/us/examples/web-servers/nginx.conf). PHP-FPM's
# getenv() reads FastCGI parameters. Setting env[EXP_DEMO_MODE] = 1 in the
# demo's pool (php-fpm-pool-demo.conf) does the same in one place.
# Guide: doc/en/us/bc/6.0/demo-mode.md.

location ~ ^/(index|index_rest|index_treemenu)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # demo mode: only the exact value 1 counts
    fastcgi_param EXP_DEMO_MODE 1;
    fastcgi_pass unix:/run/php-fpm/demo.example.com.sock;
}
