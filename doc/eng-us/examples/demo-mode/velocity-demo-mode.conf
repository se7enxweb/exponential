# Exponential 6: demo mode for a public demo served by Exponential Velocity
#
# Free documentation: GFDL 1.3 or later, see doc/eng-us/README-LICENSE.md.
#
# A systemd drop-in for the unit that starts the demo's own Velocity (for
# example the one in doc/eng-us/examples/web-servers/exponential-velocity.service).
# Velocity's workers inherit the environment of the server process. Use it only
# for a unit that starts the demo installation and nothing else.
#
# The recommended place is the demo's site envvars instead: exp:velocity start
# reads it for this installation's server only, at every start, so a restart
# or deploy from any shell keeps it:
#
#   # /etc/vc/sites-available/<site>.envvars   (<site>: ./console exp:velocity layout)
#   export EXP_DEMO_MODE=1
#
# Never the shared /etc/vc/envvars: the server of every installation on the
# host reads it, so a Velocity worker refuses demo mode from there (and logs
# "demo/refused" in var/log/security.log). A value in the site envvars wins
# over this drop-in.
#
# Install:
#   mkdir -p /etc/systemd/system/exponential-velocity-example.service.d
#   cp velocity-demo-mode.conf /etc/systemd/system/exponential-velocity-example.service.d/demo-mode.conf
#   systemctl daemon-reload
#   systemctl restart exponential-velocity-example
#
# Without the site envvars, a restart from a shell (./console exp:velocity
# restart or deploy) starts the new server with that shell's environment: run
# it through the unit. Guide: doc/eng-us/bc/6.0/demo-mode.md.

[Service]
Environment=EXP_DEMO_MODE=1
