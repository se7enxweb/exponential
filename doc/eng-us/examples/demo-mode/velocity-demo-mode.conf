# Exponential 6: demo mode for a public demo served by Exponential Velocity
#
# Free documentation: GFDL 1.3 or later, see doc/en/us/README-LICENSE.md.
#
# A systemd drop-in for the unit that starts Velocity (for example the one in
# doc/en/us/examples/web-servers/exponential-velocity.service). Velocity's workers
# inherit the environment of the server process.
#
# The recommended place is /etc/vc/envvars instead: the server reads that file
# at every start and exports what it sets to every worker, so a restart or
# deploy from any shell keeps it:
#
#   # /etc/vc/envvars
#   export EXP_DEMO_MODE=1
#
# Use this drop-in when the unit should decide; a value in the environment that
# starts the server wins over envvars.
#
# Install:
#   mkdir -p /etc/systemd/system/exponential-velocity-example.service.d
#   cp velocity-demo-mode.conf /etc/systemd/system/exponential-velocity-example.service.d/demo-mode.conf
#   systemctl daemon-reload
#   systemctl restart exponential-velocity-example
#
# Without envvars, a restart from a shell (./console exp:velocity restart or
# deploy) starts the new server with that shell's environment: run it through
# the unit, or export EXP_DEMO_MODE=1 in that shell first.
# Guide: doc/en/us/bc/6.0/demo-mode.md.

[Service]
Environment=EXP_DEMO_MODE=1
