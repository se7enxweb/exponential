# Exponential 6: demo mode for a public demo, set in an Apache virtual host
#
# Free documentation: GFDL 1.3 or later, see doc/eng-us/README-LICENSE.md.
#
# The same as htaccess-setenv.conf, in the demo's own virtual host (server
# context), for example in a Plesk "Additional Apache directives" box or a
# file under /etc/apache2/sites-available/. Only the demo's virtual host gets
# it; never a server-wide SetEnv. With PHP-FPM through mod_proxy_fcgi the
# variable reaches PHP as a FastCGI parameter, which getenv() reads.
# Guide: doc/eng-us/bc/6.0/demo-mode.md.

<VirtualHost *:443>
    ServerName demo.example.com
    DocumentRoot /var/www/demo.example.com

    # demo mode: administrator passwords cannot be changed or reset, the
    # administration shows a banner; only the exact value 1 counts
    SetEnv EXP_DEMO_MODE 1

    # ... the rest as in doc/eng-us/examples/ezpublish.conf ...
</VirtualHost>
