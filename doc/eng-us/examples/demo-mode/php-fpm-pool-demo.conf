; Exponential 6: demo mode for a public demo, set in the demo's PHP-FPM pool
;
; Free documentation: GFDL 1.3 or later, see doc/en/us/README-LICENSE.md.
;
; Add the env[] line to the pool of the demo only (one pool per site, see
; doc/en/us/examples/web-servers/php-fpm-pool.conf), then reload that pool's master
; (systemctl reload php-fpm, or plesk-php85-fpm and the like on Plesk). Every
; request of the pool then has EXP_DEMO_MODE=1, also with clear_env = yes.
; Never in a shared pool. Guide: doc/en/us/bc/6.0/demo-mode.md.

[demo.example.com]
user = demo
group = demo
listen = /run/php-fpm/demo.example.com.sock

; demo mode: administrator passwords cannot be changed or reset, the installers
; accept the published demo password; only the exact value 1 counts
env[EXP_DEMO_MODE] = 1
