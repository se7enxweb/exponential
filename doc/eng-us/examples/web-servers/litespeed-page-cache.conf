# LiteSpeed page cache for Exponential 6, in a virtual host (LiteSpeed Enterprise)
# ---------------------------------------------------------------------------
# What this is: the page cache block of .htaccess_root written for the
# HTTPS virtual host of LiteSpeed Web Server (Enterprise), which reads Apache
# configuration. LiteSpeed keeps whole pages for max-age seconds and answers
# anonymous visitors and crawlers from them without running PHP. No plugin and
# no code. Apache and nginx never enter <IfModule LiteSpeed>.
#
# Guide, with every line explained, purging, checks and troubleshooting:
#   doc/eng-us/guides/litespeed-page-cache.md
#
# Where it goes:
#   - a plain LiteSpeed server: inside <VirtualHost *:443> of the site, before
#     the rule that sends everything to index.php; restart LiteSpeed
#     (changes to the Apache configuration need a restart, .htaccess not)
#   - Plesk: Websites & Domains > the domain > Apache & nginx Settings >
#     "Additional directives for HTTPS" (never edit vhost_ssl.conf by hand:
#     Plesk writes it again from the panel field on every regeneration)
#   - cPanel: a file in /etc/apache2/conf.d/userdata/ssl/2_4/<user>/<domain>/,
#     then /scripts/rebuildhttpdconf and a restart
#   - DirectAdmin: Server Manager > Custom HTTPD Configurations > the domain
# Use it either here or in .htaccess, not in both. OpenLiteSpeed reads none of
# CacheEngine, CacheLookup or CacheRoot: see openlitespeed-vhost.conf.
#
# Needs a cache directory at server level (once per machine), for example:
#   <IfModule LiteSpeed>
#   CacheRoot /home/lscache/
#   </IfModule>
#
# In server context a RewriteRule pattern sees the path with its leading
# slash; "^/?" accepts it with and without.
#
# Check, twice, without cookies: the second answer says "hit".
#   curl -sI https://www.example.com/ | grep -i x-litespeed-cache
# And never a hit when signed in:
#   curl -sI -H 'Cookie: is_logged_in=true' https://www.example.com/ | grep -i x-litespeed-cache
#
# Free documentation: GFDL 1.3 or later, see doc/eng-us/README-LICENSE.md; the
# rules are those of .htaccess_root (GPL v2 or later).

<IfModule LiteSpeed>
    # Only needed when the server-level configuration says "CacheEngine off".
    #CacheEngine on

    # Look requests up in the page cache.
    CacheLookup on

    RewriteEngine On
    # Only reads: every form (POST) and every other write reaches PHP.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    # No query string: searches, filters and tracking parameters reach PHP.
    RewriteCond %{QUERY_STRING} ^$
    # Nobody with a session or signed in. The session cookie is PHPSESSID with
    # site.ini [Session] SessionNameHandler=default (php.ini session.name) and
    # eZSESSID<md5 of the siteaccess> with SessionNameHandler=custom; the
    # kernel sets is_logged_in=true for every signed-in user. Add cookies of
    # your own that change a page, separated by "|".
    RewriteCond %{HTTP_COOKIE} !(eZSESSID|PHPSESSID|is_logged_in) [NC]
    # Not the views that differ per visitor or change something, with or
    # without a siteaccess in front: the administration (put the URI of yours
    # if it is not "admin"), user/, shop/, notification/, layout/, ezjscore/,
    # setup/ and every content/ view except content/view/.
    RewriteCond %{REQUEST_URI} !^/([^/]+/)?((admin|user|shop|notification|layout|ezjscore|setup)(/|$)|content/(?!view/)) [NC]
    # The administration on a host name of its own: remove the "#", adjust.
    #RewriteCond %{HTTP_HOST} !^admin\. [NC]
    # Keep the page 120 seconds. Nothing removes it when an editor publishes:
    # anonymous visitors see a change at most max-age seconds later.
    RewriteRule ^/?(.*)$ - [E=cache-control:max-age=120]
</IfModule>
