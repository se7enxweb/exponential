# Exponential 6: demo mode for a public demo, set in the site's .htaccess
#
# Free documentation: GFDL 1.3 or later, see doc/README-LICENSE.md.
#
# Append these lines to the demo's .htaccess (a copy of .htaccess_root). They
# set the environment variable EXP_DEMO_MODE=1 for every request PHP serves
# there: Apache with mod_php or PHP-FPM through mod_proxy_fcgi, and LiteSpeed
# with lsphp, which reads .htaccess like Apache. Only the exact value 1 turns
# demo mode on. Guide: doc/bc/6.0/demo-mode.md; explained in README.md here.
#
# Only for a public demo whose administrator sign-in is published. Never put
# these lines into a .htaccess that other sites are built from. A rebuild that
# writes a fresh .htaccess must append them again.

<IfModule mod_env.c>
    SetEnv EXP_DEMO_MODE 1
</IfModule>
