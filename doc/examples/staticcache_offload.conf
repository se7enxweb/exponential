# Static cache offload for Exponential 6.0.15
# ---------------------------------------------------------------------------
# Serves a page generated by Setup > Cache > Static content cache directly from
# the file, so the request never starts the CMS. Pages are written to
# var/<VarDir>/static by kernel/classes/ezstaticcache.php.
#
# Copy the block into the <Directory> section of the vhost that serves the
# PUBLIC site. Do NOT add it to the administration vhost: nothing there is
# cached, and the rules must never be given a chance to answer an editor's
# request from a file generated for an anonymous visitor.
#
# Installations that use .htaccess instead of a vhost do not need this file:
# copy .htaccess_root_static to .htaccess instead. It is .htaccess_root with the
# same rules already in place.
#
# Apache needs mod_rewrite. After editing, run "httpd -t" and reload.

# The var directory this installation uses, from site.ini [FileSettings] VarDir
# without the leading "var/". One place to change.
RewriteRule ^ - [E=EZ_VAR_SITE:site]

# Let a generated static page be served as the file it is, both for a direct
# request and for the internal rewrite below.
RewriteRule ^var/([^/]+/)?static/.* - [L]

# Only a plain GET or HEAD, with no query string, from a visitor with no
# session. Anything else is a form, a search, or somebody logged in, and none of
# those may be served a page that was generated for somebody else.
#
# Two layouts, because a siteaccess is selected either by host or by the first
# url segment and the generator writes whichever applies. Host matched sites are
# stored under the host name; url matched sites under the siteaccess name, which
# is already the first segment of REQUEST_URI. The host form is tried first,
# being the more specific.
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP_COOKIE} !eZSESSID
RewriteCond %{HTTP_COOKIE} !is_logged_in=true
RewriteCond %{DOCUMENT_ROOT}/var/%{ENV:EZ_VAR_SITE}/static/%{HTTP_HOST}%{REQUEST_URI}/index.html -f
RewriteRule ^ /var/%{ENV:EZ_VAR_SITE}/static/%{HTTP_HOST}%{REQUEST_URI}/index.html [L]

RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP_COOKIE} !eZSESSID
RewriteCond %{HTTP_COOKIE} !is_logged_in=true
RewriteCond %{DOCUMENT_ROOT}/var/%{ENV:EZ_VAR_SITE}/static%{REQUEST_URI}/index.html -f
RewriteRule ^ /var/%{ENV:EZ_VAR_SITE}/static%{REQUEST_URI}/index.html [L]

# These rules must sit BEFORE the front controller rule, which in a vhost
# usually reads:
#
#     RewriteCond %{REQUEST_FILENAME} !-f
#     RewriteRule . /index.php [L]
