# The databases of the MongoDB wire protocol (expMongoWireProfile, doc/eng-us/features/6.0/mongodb-wire-databases.md):
# the DB-less tests, the live probe of the operators the adapter uses (testsuite mongowire-live) and a whole site
# installed (exp:install) with its front page and admin login rendered, against FerretDB 2 (PostgreSQL with the
# DocumentDB extension), the Azure Cosmos DB emulator (MongoDB API) and MongoDB 5.0 (before the aggregation bitwise
# operators, so the arithmetic the driver writes instead is what runs). Amazon DocumentDB has no emulator.
name: MongoDB wire databases

on:
  workflow_dispatch:
  push:
    branches: [ 'mongowire/**' ]

permissions:
  contents: read

env:
  CI_COMPOSER_FILE: composer.ci-mongowire.json

jobs:
  mongowire:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # without authentication: PHP's mongodb extension (libmongoc) refuses the 16-byte SCRAM salt of the
          # PostgreSQL users FerretDB 2 logs in ("invalid salt length of 16"); the first run showed it
          - { label: 'FerretDB 2', db: ferretdb, profile: ferretdb, port: '27017', user: '', password: '' }
          - { label: 'MongoDB 5.0', db: mongodb, profile: mongodb, port: '27017', user: '', password: '' }
          - { label: 'Azure Cosmos DB emulator', db: cosmosdb, profile: cosmosdb, port: '10255', user: 'localhost',
              password: 'C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start FerretDB 2
        if: matrix.db == 'ferretdb'
        run: |
          docker network create mw
          docker run -d --name pg --network mw -e POSTGRES_USER=exp -e POSTGRES_PASSWORD=exp-ferret-2026 \
            -e POSTGRES_DB=postgres ghcr.io/ferretdb/postgres-documentdb:17
          docker run -d --name ferretdb --network mw -p 27017:27017 -e FERRETDB_AUTH=false \
            -e FERRETDB_POSTGRESQL_URL=postgres://exp:exp-ferret-2026@pg:5432/postgres ghcr.io/ferretdb/ferretdb:2
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && break; sleep 2; done
          sleep 5; docker logs ferretdb 2>&1 | tail -5

      - name: Start MongoDB 5.0
        if: matrix.db == 'mongodb'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:5.0
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && break; sleep 2; done

      # The Linux emulator with the MongoDB API (4.0); its certificate is self-signed and is added to the system's CAs
      - name: Start the Azure Cosmos DB emulator
        if: matrix.db == 'cosmosdb'
        run: |
          docker run -d --name cosmos -p 8081:8081 -p 10250-10255:10250-10255 \
            -e AZURE_COSMOS_EMULATOR_PARTITION_COUNT=4 -e AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false \
            -e AZURE_COSMOS_EMULATOR_ENABLE_MONGODB_ENDPOINT=4.0 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:mongodb
          up=0
          for i in $(seq 1 90); do
            if curl -sk -o /dev/null https://127.0.0.1:8081/_explorer/emulator.pem; then up=1; break; fi
            [ $((i % 12)) = 0 ] && { docker ps -a --filter name=cosmos --format '{{.Status}}'; docker logs cosmos 2>&1 | tail -3; }
            sleep 10
          done
          docker ps -a --filter name=cosmos --format '{{.Status}}'
          docker logs cosmos 2>&1 | tail -40
          if [ $up = 0 ]; then echo "::error::the Cosmos DB emulator did not start in 15 minutes"; exit 1; fi
          curl -sk https://127.0.0.1:8081/_explorer/emulator.pem -o emulator.crt
          sudo cp emulator.crt /usr/local/share/ca-certificates/cosmos-emulator.crt && sudo update-ca-certificates
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/10255) 2>/dev/null && break; sleep 5; done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, mongodb, pdo, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install dependencies (with mongodb/mongodb)
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          COMPOSER="${CI_COMPOSER_FILE}" composer require --no-update --no-interaction "mongodb/mongodb:^1.21 || ^2.0"
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: The URI of the leg
        run: |
          creds=""
          if [ -n "${{ matrix.user }}" ]; then
            creds="$(php -r 'echo rawurlencode($argv[1]), ":", rawurlencode($argv[2]), "@";' '${{ matrix.user }}' '${{ matrix.password }}')"
          fi
          opts=""
          [ "${{ matrix.db }}" = cosmosdb ] && opts="?tls=true&retryWrites=false"
          [ "${{ matrix.db }}" = ferretdb ] && opts="?retryWrites=false"
          echo "EXP_MONGOWIRE_URI=mongodb://${creds}127.0.0.1:${{ matrix.port }}/exp_mongowire${opts}" >> "$GITHUB_ENV"
          echo "EXP_MONGOWIRE_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          echo "EXP_MONGOWIRE_REPORT=$RUNNER_TEMP/probe-${{ matrix.db }}.json" >> "$GITHUB_ENV"

      - name: Run the MongoDB wire tests
        run: |
          php vendor/bin/phpunit --colors=always --testsuite mongowire
          php vendor/bin/phpunit --colors=always --display-skipped --testsuite mongowire-live || echo "LIVE_FAILED=1" >> "$GITHUB_ENV"
          cat "$EXP_MONGOWIRE_REPORT" || true

      - name: Install a site
        id: install
        continue-on-error: true
        run: |
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          export EXP_INSTALL_DB_PASSWORD='${{ matrix.password }}'
          php bin/php/install.php --db=${{ matrix.db }} --db-host=127.0.0.1 --db-port=${{ matrix.port }} \
            --db-name=exponential --db-user='${{ matrix.user }}' --apply --password=Ci-MongoWire-2026 --no-crontab
          php -S 127.0.0.1:8080 -t . index.php >var/log/php-server.log 2>&1 &
          sleep 2
          code=$(curl -s -o front.html -w '%{http_code}' http://127.0.0.1:8080/)
          echo "front page: $code"; head -c 600 front.html; echo
          echo "FRONT=$code" >> "$GITHUB_ENV"
          code2=$(curl -s -o admin.html -w '%{http_code}' http://127.0.0.1:8080/admin/user/login)
          echo "admin login: $code2"
          echo "ADMIN=$code2" >> "$GITHUB_ENV"
          test "$code" = 200 && test "$code2" = 200

      - name: Logs
        if: always()
        run: |
          # the errors by kind: numbers and ids folded, the most frequent first
          for f in var/log/error.log var/log/warning.log; do
            [ -f "$f" ] || continue
            echo "== $f: $(grep -c '^\[ ' "$f") entries"
            sed -E 's/^(\[[^]]*\] ?)+//; s/[0-9]+/N/g' "$f" | cut -c1-220 | sort | uniq -c | sort -rn | head -40
          done
          echo "front page links: $(grep -o '<a href' front.html 2>/dev/null | wc -l), bare content/view/full links: $(grep -o 'href=\"[^\"]*content/view/full/[0-9]*\"' front.html 2>/dev/null | wc -l)"
          tail -n 60 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "live tests failed: ${LIVE_FAILED:-0}; install: ${{ steps.install.outcome }}; front page: ${FRONT:-none}; admin login: ${ADMIN:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$EXP_MONGOWIRE_REPORT" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the probe report and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.db }}
          path: |
            ${{ runner.temp }}/probe-${{ matrix.db }}.json
            var/log/*.log
            front.html
          if-no-files-found: ignore

      - name: Fail when the tests or the install failed
        run: |
          test "${LIVE_FAILED:-0}" = 0
          test "${{ steps.install.outcome }}" = success

      - name: Clean up
        if: always()
        run: |
          rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"
          docker rm -f ferretdb pg mongo cosmos || true
