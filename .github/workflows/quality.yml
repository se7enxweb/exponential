name: Quality

# The checks of the git hooks (.githooks/), run for every push and pull request.
# Blocking: PHP syntax (also every file with PHP 8.0, the oldest supported version,
# and a boot smoke test on 8.0), JavaScript syntax of changed scripts (node --check),
# the file manifest, commit messages, PHPStan and the tests of the own sniffs.
# Warning only for now: the code style of changed files (phpcs.xml.dist).
# See doc/eng-us/features/6.0/quality-checks.md.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# The version Composer gives the root package. On a push to main it reads "dev-main" from the
# checked-out branch, and the branch alias "dev-main": "6.0.x-dev" in composer.json lets packages
# that require se7enxweb/exponential (expai, expqueue: ^6.0.14) resolve against it. A pull request
# is checked out as a detached merge commit, so Composer would see "dev-<sha>" or "1.0.0", which
# satisfies no such constraint, and every install stopped with "could not be resolved". A pull
# request targets main, so it is resolved as main.
env:
  COMPOSER_ROOT_VERSION: dev-main

# One group per pull request: a new push to the branch cancels the run it supersedes. A push to
# main gets a group of its own commit, so a later push never cancels it halfway and every commit
# on main keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Syntax, manifest, commit messages, code style
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Changed range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "base=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: PHP syntax of changed files
        run: |
          status=0
          for file in $(git diff --name-only --diff-filter=ACMR ${{ steps.range.outputs.base }} ${{ steps.range.outputs.head }} -- '*.php'); do
            php -l "$file" >/dev/null || status=1
          done
          exit $status

      # Node 22 or later: it reads the syntax of an ES module in a .js file without a package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax of changed files
        run: |
          status=0
          for file in $(git diff --name-only --diff-filter=ACMR ${{ steps.range.outputs.base }} ${{ steps.range.outputs.head }} -- '*.js' ':!*.min.js'); do
            node --check "$file" || status=1
          done
          exit $status

      # Blocking on a push to main: a stale line on main shows up in every site's upgrade check as
      # a modified file. A WARNING on a pull request: the check runs on the merge of the branch into
      # the current main, so when main changed the same files the contributor cannot produce the
      # merged checksums, and the person merging refreshes the manifest anyway. On a mismatch the job
      # prints the lines to change and the command that changes them.
      - name: File manifest (share/filelist.md5)
        env:
          MANIFEST_BLOCKING: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: |
          if php bin/php/checkmanifest.php --all; then
            exit 0
          fi
          if [ "$MANIFEST_BLOCKING" = 0 ]; then
            level=warning
          else
            level=error
          fi
          php bin/php/checkmanifest.php --fix > /dev/null || true
          patch_file="$RUNNER_TEMP/filelist.md5.diff"
          git diff -- share/filelist.md5 > "$patch_file"
          git checkout -- share/filelist.md5
          echo "::${level} file=share/filelist.md5::share/filelist.md5 does not match the files of this change. Run 'make manifest-fix' (php bin/php/checkmanifest.php --fix) in the branch and commit share/filelist.md5 (or 'make hooks' once, so the pre-commit hook checks it). The lines to change follow; see doc/eng-us/features/6.0/quality-checks.md"
          echo "--- The change to share/filelist.md5 that makes it match (or save it and git apply it) ---"
          cat "$patch_file"
          {
            echo "### share/filelist.md5 does not match the files of this change"
            echo
            echo "Run \`make manifest-fix\` (\`php bin/php/checkmanifest.php --fix\`) in your branch and commit \`share/filelist.md5\`"
            echo "with a message such as \`Updated: The file manifest carries the checksums of ...\`."
            echo "Or apply this change. Run \`make hooks\` once, so the pre-commit hook checks it for every commit."
            echo
            echo '```diff'
            cat "$patch_file"
            echo '```'
            if [ "$MANIFEST_BLOCKING" = 0 ]; then
              echo
              echo "This is a warning on a pull request: the person merging it refreshes share/filelist.md5 on main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MANIFEST_BLOCKING" = 0 ]; then
            echo "::warning::share/filelist.md5 does not match; a warning on a pull request, the person merging refreshes the manifest on main"
            exit 0
          fi
          exit 1

      # A commit by a project author (.githooks/commit-msg-authors) must start with Added:, Updated:,
      # Fixed:, Removed: or Renamed:. A contributor's commit is merged and kept as written, so its
      # subject is only a warning: a merged pull request never turns main red (quality-checks.md).
      # The local gates run the same script.
      - name: Commit messages
        run: TMPDIR="$RUNNER_TEMP" sh .githooks/check-commit-range --github ${{ steps.range.outputs.base }} ${{ steps.range.outputs.head }}

      - name: Cache development tools
        uses: actions/cache@v4
        with:
          path: .devtools/vendor
          key: ${{ runner.os }}-devtools-${{ hashFiles('composer.dev.lock') }}

      - name: Install development tools
        run: |
          for attempt in 1 2 3; do
            COMPOSER=composer.dev.json composer install --no-interaction --no-progress && exit 0
            echo "::warning::composer install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Code style of changed files (warning only)
        continue-on-error: true
        run: php bin/php/checkcodestyle.php --base=${{ steps.range.outputs.base }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, mysqli, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Cache development tools
        uses: actions/cache@v4
        with:
          path: .devtools/vendor
          key: ${{ runner.os }}-devtools-${{ hashFiles('composer.dev.lock') }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # Retried: a Packagist or GitHub hiccup is not a finding
      - name: Install dependencies and development tools
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::$1 $2 failed (attempt $attempt of 3)"
              sleep $((attempt * 15))
            done
            return 1
          }
          retry composer update --no-scripts --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb
          # Velocity is only suggested (it needs PHP 8.1), but the kernel's Velocity
          # integration (kernel/classes/expvelocity.php) is analysed too, so install it
          # here as a site on PHP 8.1 or later would
          retry composer require --no-scripts --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb se7enxweb/exponential-velocity:~0.0.4.42
          COMPOSER=composer.dev.json retry composer install --no-interaction --no-progress

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e || true

      - name: PHPStan (only findings missing from phpstan-baseline.neon fail)
        run: .devtools/vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=4G --no-progress

  sniffs:
    name: Code style sniff tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The project's PHPUnit needs PHP 8.4.1 or later
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, tokenizer
          coverage: none
          tools: composer:v2

      - name: Cache development tools
        uses: actions/cache@v4
        with:
          path: .devtools/vendor
          key: ${{ runner.os }}-devtools-${{ hashFiles('composer.dev.lock') }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-sniffs-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies and development tools
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::$1 $2 failed (attempt $attempt of 3)"
              sleep $((attempt * 15))
            done
            return 1
          }
          retry composer update --no-scripts --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb
          COMPOSER=composer.dev.json retry composer install --no-interaction --no-progress

      - name: Tests of the code style sniffs (bin/phpcs/)
        run: vendor/bin/phpunit --testsuite quality --no-coverage

  php80:
    name: PHP 8.0 (oldest supported) syntax and boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.0, the oldest supported version (the stock PHP of RHEL 9)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, mysqli, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: PHP 8.0 syntax of every PHP file (enums, readonly, never, new in initializers, ... are refused)
        run: make lint80-all PHP80=php

      # A plain production install, as on Red Hat Enterprise Linux 9: composer.json and
      # every package it requires allow PHP 8.0 (Velocity, which needs 8.1, is only
      # suggested), so a package that raises its PHP minimum again fails here. Without a
      # lock file Composer resolves require-dev too, so its PHPUnit range has to include a
      # version for PHP 8.0 (9.6): the command is exactly the one a site runs.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php80-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-php80-

      # Retried on a network error only: a requirement that PHP 8.0 cannot meet is the result
      # this step exists for, and fails at once.
      - name: Install the production dependencies with PHP 8.0
        run: |
          for attempt in 1 2 3; do
            if composer install --no-dev --prefer-dist --no-progress --no-interaction > "$RUNNER_TEMP/composer.log" 2>&1; then
              cat "$RUNNER_TEMP/composer.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/composer.log"
            grep -q 'could not be resolved to an installable set' "$RUNNER_TEMP/composer.log" && exit 1
            echo "::warning::composer install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Boot smoke test without a database (every kernel and extension class, compat functions, a template)
        run: php bin/php/ezexec.php tests/bin/bootsmoke.php
