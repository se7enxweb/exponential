name: PHPUnit

# No paths filter: the tests read templates, stylesheets, scripts, translations, settings and
# documentation too (the design rules, the translation quality, the documented cronjobs). With the
# old filter (only *.php and composer files) a change to those ran no test at all, and the failure
# it caused appeared on the next unrelated push.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request: a new push to the branch cancels the run it supersedes. A push to
# main gets a group of its own commit, so a later push never cancels it halfway and every commit
# on main keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The version Composer gives the root package. On a push to main it reads "dev-main" from the
# checked-out branch, and the branch alias "dev-main": "6.0.x-dev" in composer.json lets packages
# that require se7enxweb/exponential (expai, expqueue: ^6.0.14) resolve against it. A pull request
# is checked out as a detached merge commit, so Composer would see "dev-<sha>" or "1.0.0", which
# satisfies no such constraint, and every install stopped with "could not be resolved". A pull
# request targets main, so it is resolved as main.
env:
  COMPOSER_ROOT_VERSION: dev-main
  CI_COMPOSER_FILE: composer.ci-phpunit.json

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # A green run takes about 6 minutes; a hung test or install stops here, not at the 6 hour default
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']   # PHPUnit 10+ needs 8.1; PHP 8.0 is checked by quality.yml (php80)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The design tests run admin4 JavaScript in node and FAIL without it where CI is set
      # (tests/tests/design/AdminNodeBinary.php), so node is installed here instead of relying on the image.
      # Node 22 or later, as the JavaScript syntax check of quality.yml.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, mongodb, mysqli, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: xdebug
          tools: composer:v2

      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y imagemagick libbson-dev libmongoc-dev

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('composer.json', '.github/workflows/phpunit.yml') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          if [[ "${{ matrix.php }}" == "8.1" || "${{ matrix.php }}" == "8.2" || "${{ matrix.php }}" == "8.3" ]]; then
            if [[ "${{ matrix.php }}" == "8.1" ]]; then
              export PHPUNIT_VERSION="^10.5"
            else
              export PHPUNIT_VERSION="^11.5"
            fi
          fi
          php -r '$file = getenv("CI_COMPOSER_FILE"); $data = json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); if (($phpunit = getenv("PHPUNIT_VERSION")) !== false && $phpunit !== "") { $data["require-dev"]["phpunit/phpunit"] = $phpunit; } $data["require-dev"]["mongodb/mongodb"] = "^1.21 || ^2.0"; file_put_contents($file, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);'
          # The overlay's require-dev differs per PHP version, so no committed
          # lock can fit every leg: resolve it fresh from composer.json each run.
          # A committed overlay lock froze every package at the versions of the
          # day it was made, and each later repin of composer.json failed here.
          # Retried: a Packagist or GitHub hiccup is not a test failure
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done

      - name: Ensure vendor is present
        run: |
          if [[ ! -x vendor/bin/phpunit ]]; then
            echo "vendor/bin/phpunit is missing, reinstalling dependencies"
            COMPOSER="${CI_COMPOSER_FILE}" composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb
          fi
          test -x vendor/bin/phpunit

      # Optional but recommended – regenerates autoloads the same way the project does
      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      # The run below takes every suite of phpunit.xml. The live-installation suites (expservices, ezoe,
      # cjw_newsletter, explayouts_admin, ...) find no installed site here and skip each class with the reason
      # (ezpLiveInstallation::requireOrSkip()); a suite missing from phpunit.xml would not run at all.
      - name: Check the suites are configured
        run: |
          suites=$(vendor/bin/phpunit --list-suites)
          echo "$suites"
          for s in security kernel-classes lib expservices ezoe; do
            grep -qE "^ - ${s}( |$)" <<< "$suites" || { echo "::error::testsuite '${s}' is missing from phpunit.xml"; exit 1; }
          done

      # The summary counts warnings and PHPUnit notices; these flags name each one in the log. PHPUnit 10 (PHP 8.1)
      # has no --display-phpunit-notices, so each flag is passed where the installed PHPUnit knows it.
      - name: Run PHPUnit
        run: |
          help=$(vendor/bin/phpunit --help)
          flags=()
          for flag in --display-warnings --display-phpunit-notices; do
            grep -q -- "$flag" <<< "$help" && flags+=("$flag")
          done
          vendor/bin/phpunit --colors=always "${flags[@]}"

      # The Twig performance guard compares two engines in one process and skips itself while
      # Xdebug is active: "coverage: xdebug" above sets xdebug.mode=coverage, which costs every PHP function call
      # something, and a Twig render makes several times the calls of a compiled .tpl. Under it the twig/tpl ratio
      # stood at 2.0-2.5 on PHP 8.2-8.5 from the day the guard arrived (budget 2.0), against 1.2-1.4 on PHP 8.5
      # with xdebug.mode=off. Here Xdebug stays loaded but does nothing (mode off), as on a production system.
      - name: Run the performance guard without Xdebug
        run: php -d xdebug.mode=off vendor/bin/phpunit --colors=always tests/tests/lib/twig/expTwigPerformanceGuardTest.php

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  phpunit-db:
    name: Database tests (${{ matrix.db }}${{ matrix.db == 'postgresql' && format(' {0}', matrix.pg) || '' }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # A green run takes about 6 minutes; a hung test or install stops here, not at the 6 hour default
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # pg: the PostgreSQL server of the leg (the service below; the MySQL and MongoDB legs do not use it). The
        # kernel supports 13 to 19: the oldest, the one the suites ran on alone before, and the two newest.
        include:
          - php: '8.3'
            db: mysql
            pg: '18'
            dsn: 'mysql://root@127.0.0.1/testdb'
          - php: '8.3'
            db: postgresql
            pg: '13'
            dsn: 'postgresql://postgres@127.0.0.1/testdb'
          - php: '8.3'
            db: postgresql
            pg: '15'
            dsn: 'postgresql://postgres@127.0.0.1/testdb'
          - php: '8.3'
            db: postgresql
            pg: '18'
            dsn: 'postgresql://postgres@127.0.0.1/testdb'
          - php: '8.3'
            db: postgresql
            pg: '19'
            dsn: 'postgresql://postgres@127.0.0.1/testdb'
          # The migration engine's checks of every step family on MongoDB (the expMigration* classes of the
          # testsuite mongodb-live)
          - php: '8.3'
            db: mongodb
            pg: '18'
            dsn: 'mongodb://127.0.0.1:27017'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgresql:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_NAME: testdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The design tests run admin4 JavaScript in node and FAIL without it where CI is set
      # (tests/tests/design/AdminNodeBinary.php), so node is installed here instead of relying on the image.
      # Node 22 or later, as the JavaScript syntax check of quality.yml.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, mongodb, mysqli, pgsql, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y imagemagick libbson-dev libmongoc-dev

      # The PostgreSQL client of the leg's server (PGDG): pg_dump refuses a server newer than itself, and the caption
      # and backup checks dump the test database (the image's own client is older than 18 and 19)
      - name: Install the PostgreSQL client
        if: matrix.db == 'postgresql'
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          # --force-overwrite: PGDG's libpq-dev 19.0-2 (pulled in with libpq5 19) ships /usr/bin/pg_config, which
          # postgresql-common owns as well, and dpkg refuses the upgrade of the runner's libpq-dev without it
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Options::=--force-overwrite install -y "postgresql-client-${{ matrix.pg }}"
          "/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_dump" --version
          pg_dump --version

      - name: Get Composer cache directory
        id: composer-cache-db
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-db.outputs.dir }}
          key: ${{ runner.os }}-composer-db-php${{ matrix.php }}-${{ hashFiles('composer.json', '.github/workflows/phpunit.yml') }}
          restore-keys: |
            ${{ runner.os }}-composer-db-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          export PHPUNIT_VERSION="^11.5"
          php -r '$file = getenv("CI_COMPOSER_FILE"); $data = json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); if (($phpunit = getenv("PHPUNIT_VERSION")) !== false && $phpunit !== "") { $data["require-dev"]["phpunit/phpunit"] = $phpunit; } $data["require-dev"]["mongodb/mongodb"] = "^1.21 || ^2.0"; file_put_contents($file, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);'
          # Resolved fresh each run; see the phpunit job.
          # Retried: a Packagist or GitHub hiccup is not a test failure
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done

      - name: Ensure vendor is present
        run: |
          if [[ ! -x vendor/bin/phpunit ]]; then
            echo "vendor/bin/phpunit is missing, reinstalling dependencies"
            COMPOSER="${CI_COMPOSER_FILE}" composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb
          fi
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Prepare database
        run: |
          case "${{ matrix.db }}" in
            mysql)
              mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS ${TEST_DB_NAME};"
              ;;
            postgresql)
              psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE ${TEST_DB_NAME};"
              psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "${TEST_DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
              ;;
            mongodb)
              # nothing: each test class makes and drops a MongoDB database of its own
              ;;
          esac

      - name: Run database tests
        run: |
          # Keep DB suite timezone deterministic for CI stability.
          TEST_TIMEZONE=America/Los_Angeles
          echo "$TEST_TIMEZONE"
          # Every suite of phpunit.xml, with its excludes (a directory named here would run the files
          # phpunit.xml leaves out). runtests.php exits with PHPUnit's code, so a failure fails the job.
          if [ "${{ matrix.db }}" = mongodb ]; then
            EXP_TEST_MONGO_URI="${{ matrix.dsn }}" php -d date.timezone="$TEST_TIMEZONE" vendor/bin/phpunit --colors=always \
              --testsuite mongodb-live --group mongodb-live --filter '^expMigration'
          else
            php -d date.timezone="$TEST_TIMEZONE" tests/runtests.php --dsn "${{ matrix.dsn }}" --db-per-test
          fi

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The DFS cluster metadata backends against real servers: the PostgreSQL backend on every PostgreSQL major the
  # kernel supports (13 to 19), and the MySQLi, SQLite and MongoDB backends through the same parity checks
  # (tests/tests/kernel/classes/clusterfilehandlers/dfsbackends). Each test class makes and drops a database of its own.
  cluster-backends:
    name: DFS cluster backends (PostgreSQL ${{ matrix.postgres }}, MySQL 8.0, MongoDB 8.0, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3' ]
        postgres: [ '13', '14', '15', '16', '17', '18', '19' ]
        include:
          - php: '8.5'
            postgres: '18'

    services:
      postgresql:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, mysqli, pdo_pgsql, pdo_sqlite, mongodb, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # --ignore-platform-req=php would otherwise pick PHPUnit 13, which needs PHP 8.4 ("This version of PHPUnit
          # requires PHP >= 8.4.1"): before 8.4 the PHPUnit the phpunit job runs on that PHP
          if php -r 'exit(PHP_VERSION_ID < 80400 ? 0 : 1);'; then
            COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5"
          fi
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the backend tests
        env:
          EXP_TEST_PGCLUSTER_DSN: pgsql://postgres@127.0.0.1:5432/postgres
          EXP_TEST_MYCLUSTER_DSN: mysql://root@127.0.0.1:3306
          EXP_TEST_DFS_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          php vendor/bin/phpunit --colors=always --fail-on-skipped \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSPostgresqlBackendIntegrationTest.php
          # two checks are skipped on MySQL by design (32 bit mtime, the server's own lock wait timeout)
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSMySQLiBackendParityTest.php
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSFileHandlerPostgresqlBackendTest.php
          # SQLite needs no server: one file, the processes of one machine (pcntl and posix for the parallel checks)
          php vendor/bin/phpunit --colors=always --fail-on-skipped \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSSQLiteBackendIntegrationTest.php
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSFileHandlerSQLiteBackendTest.php
          # MongoDB: the PHP extension only, no library; the check of a lock held by another connection is skipped by
          # design (no lock is held between two operations outside a transaction)
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSMongoDBBackendIntegrationTest.php
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSFileHandlerMongoDBBackendTest.php

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The kernel's Oracle DFS cluster backend against Oracle Database Free (23ai): the parity checks every backend passes,
  # in the schema of an account of its own, and the DB-less unit test.
  cluster-oracle:
    name: DFS cluster backend (Oracle Free 23, PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-oracle-system
          APP_USER: dfstest
          APP_USER_PASSWORD: ci-dfstest
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, oci8, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # PHP 8.3: PHPUnit 11.5 (--ignore-platform-req=php would otherwise pick PHPUnit 13, which needs 8.4)
          COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5"
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the backend tests
        env:
          EXP_TEST_DFS_ORACLE_USER: dfstest
          EXP_TEST_DFS_ORACLE_PASSWORD: ci-dfstest
          EXP_TEST_DFS_ORACLE_CONNECT: 127.0.0.1:1521/FREEPDB1
        run: |
          php vendor/bin/phpunit --colors=always --fail-on-skipped \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSOracleBackendIntegrationTest.php
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSFileHandlerOracleBackendTest.php

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The Microsoft SQL Server driver (expSQLServerDB) against Microsoft's SQL Server Linux containers, on each PHP
  # layer it supports. The DB-less SQL Server tests run in the PHPUnit job above (testsuite sqlserver); these are the live
  # ones (testsuite sqlserver-live), which fail here instead of skipping (--fail-on-skipped is not used: a test that
  # needs a newer server skips on 2017).
  sqlserver:
    name: SQL Server ${{ matrix.server }} (${{ matrix.layer }}, PHP ${{ matrix.php }})
    # Microsoft's apt repository serves Ubuntu 24.04; ubuntu-latest moved to 26.04 before it did
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: '2022-latest', layer: sqlsrv, php: '8.5' }
          - { server: '2022-latest', layer: pdo_sqlsrv, php: '8.4' }
          - { server: '2022-latest', layer: pdo_odbc, php: '8.3' }
          - { server: '2025-latest', layer: sqlsrv, php: '8.5' }
          - { server: '2019-latest', layer: pdo_sqlsrv, php: '8.2' }
          - { server: '2017-latest', layer: sqlsrv, php: '8.1' }
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.server }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-SqlServer-2026!
          MSSQL_MEMORY_LIMIT_MB: '2048'
        ports:
          - 1433:1433
        # healthy once it takes a login: the image's own sqlcmd (tools18 from 2019 CU on, the old tools in 2017)
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -No -S localhost -U sa -P Ci-SqlServer-2026! -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Ci-SqlServer-2026! -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=10s
          --health-start-period=20s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Microsoft ODBC Driver 18
        run: |
          if ! ls /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.*.so.* >/dev/null 2>&1; then
            # the runner image may already list Microsoft's repository (a second entry with another key breaks apt)
            if ! grep -rqs packages.microsoft.com /etc/apt/sources.list /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get -o Acquire::Retries=3 update
            sudo ACCEPT_EULA=Y apt-get -o Acquire::Retries=3 install -y msodbcsql18 unixodbc-dev
          fi
          ls /opt/microsoft/msodbcsql18/lib64/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, pdo, pdo_odbc, sqlsrv, pdo_sqlsrv, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # the PHPUnit this PHP runs (Composer would pick PHPUnit 13, which needs 8.4, past --ignore-platform-req=php)
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 100); do
            php -r 'try { new PDO("odbc:Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;Encrypt=yes;TrustServerCertificate=yes;LoginTimeout=5", "sa", "Ci-SqlServer-2026!"); exit(0); } catch (Exception $e) { fwrite(STDERR, $e->getMessage() . PHP_EOL); exit(1); }' 2>last-error.txt && exit 0
            sleep 3
          done
          cat last-error.txt; docker ps -a; docker logs --tail 40 "${{ job.services.sqlserver.id }}" || true
          echo "::error::SQL Server did not answer"; exit 1

      - name: Run the SQL Server tests
        env:
          EXP_TEST_SQLSERVER_HOST: 127.0.0.1
          EXP_TEST_SQLSERVER_PORT: 1433
          EXP_TEST_SQLSERVER_USER: sa
          EXP_TEST_SQLSERVER_PASSWORD: Ci-SqlServer-2026!
          EXP_TEST_SQLSERVER_LAYER: ${{ matrix.layer }}
        run: |
          php vendor/bin/phpunit --colors=always --testsuite sqlserver
          php vendor/bin/phpunit --colors=always --testsuite sqlserver-live

      # The kernel's DFS cluster backend on SQL Server (expDFSFileHandlerSQLServerBackend) and its gateway: the parity
      # checks every backend passes, in a database of their own (exp_dfs_test), and the DB-less unit test. The two
      # checks with processes in parallel run on PDO_ODBC; sqlsrv and pdo_sqlsrv cannot fork after a closed
      # connection and skip them (expDFSSQLServerBackendIntegrationTest::beforeFork() says why).
      - name: Run the SQL Server DFS cluster backend tests
        env:
          EXP_TEST_SQLSERVER_HOST: 127.0.0.1
          EXP_TEST_SQLSERVER_PORT: 1433
          EXP_TEST_SQLSERVER_USER: sa
          EXP_TEST_SQLSERVER_PASSWORD: Ci-SqlServer-2026!
          EXP_TEST_SQLSERVER_LAYER: ${{ matrix.layer }}
        run: |
          php vendor/bin/phpunit --colors=always --display-skipped \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSSQLServerBackendIntegrationTest.php
          php vendor/bin/phpunit --colors=always \
            tests/tests/kernel/classes/clusterfilehandlers/dfsbackends/expDFSFileHandlerSQLServerBackendTest.php

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The drivers of databases that speak the MySQL protocol (expMySQLWireDB) against their servers in containers:
  # TiDB, Vitess (vttestserver, one unsharded keyspace, foreign keys disallowed as on PlanetScale) and SingleStore
  # (the dev image, free without a license key). The DB-less tests run in the PHPUnit job above (testsuite
  # mysqlwire); these are the live ones (testsuite mysqlwire-live). Xpand publishes no image and Aurora runs only at
  # AWS: their live tests skip.
  mysqlwire:
    name: ${{ matrix.label }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: tidb, label: 'TiDB 8.5', php: '8.5' }
          - { db: vitess, label: 'Vitess (vttestserver)', php: '8.4' }
          - { db: singlestore, label: 'SingleStore (dev image)', php: '8.3' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start the database
        run: |
          case "${{ matrix.db }}" in
            tidb)
              docker run -d --name ci-mysqlwire -p 4000:4000 pingcap/tidb:v8.5.1
              echo "EXP_TEST_TIDB_HOST=127.0.0.1" >> "$GITHUB_ENV"
              echo "EXP_TEST_TIDB_PORT=4000" >> "$GITHUB_ENV"
              echo "CI_DB_PORT=4000" >> "$GITHUB_ENV" ;;
            vitess)
              docker run -d --name ci-mysqlwire -p 33577:33577 vitess/vttestserver:mysql80 /vt/bin/vttestserver \
                --alsologtostderr --port=33574 --mysql_bind_host=0.0.0.0 --keyspaces=exptest_mysqlwire --num_shards=1 \
                --foreign_key_mode=disallow --queryserver-config-transaction-timeout=600s
              echo "EXP_TEST_VITESS_HOST=127.0.0.1" >> "$GITHUB_ENV"
              echo "EXP_TEST_VITESS_PORT=33577" >> "$GITHUB_ENV"
              echo "CI_DB_PORT=33577" >> "$GITHUB_ENV" ;;
            singlestore)
              docker run -d --name ci-mysqlwire -p 3306:3306 -e ROOT_PASSWORD=Ci-SingleStore-2026 ghcr.io/singlestore-labs/singlestoredb-dev:latest
              echo "EXP_TEST_SINGLESTORE_HOST=127.0.0.1" >> "$GITHUB_ENV"
              echo "EXP_TEST_SINGLESTORE_PORT=3306" >> "$GITHUB_ENV"
              echo "EXP_TEST_SINGLESTORE_PASSWORD=Ci-SingleStore-2026" >> "$GITHUB_ENV"
              echo "CI_DB_PASSWORD=Ci-SingleStore-2026" >> "$GITHUB_ENV"
              echo "CI_DB_PORT=3306" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, mysqli, pdo, pdo_mysql, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for the database
        run: |
          for i in $(seq 1 100); do
            php -r 'mysqli_report(MYSQLI_REPORT_OFF); $c = @mysqli_connect("127.0.0.1", "root", (string)getenv("CI_DB_PASSWORD"), "", (int)getenv("CI_DB_PORT")); if ($c && mysqli_query($c, "SELECT 1")) exit(0); fwrite(STDERR, mysqli_connect_error() . PHP_EOL); exit(1);' 2>last-error.txt && exit 0
            sleep 3
          done
          cat last-error.txt; docker ps -a; docker logs --tail 60 ci-mysqlwire || true
          echo "::error::the database did not answer"; exit 1

      - name: Run the MySQL-wire tests
        env:
          EXP_TEST_VITESS_DATABASE: exptest_mysqlwire
        run: |
          php vendor/bin/phpunit --colors=always --testsuite mysqlwire
          php vendor/bin/phpunit --colors=always --display-skipped --testsuite mysqlwire-live

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # A smoke run on Windows: Microsoft's sqlsrv extension against SQL Server Express LocalDB, when the runner image
  # has LocalDB (it is not a promise of the image, so the job may not fail the run).
  sqlserver-windows-localdb:
    name: SQL Server LocalDB smoke (Windows, sqlsrv, PHP 8.4)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, sockets, sqlsrv, pdo_sqlsrv, zip
          coverage: none
          tools: composer:v2

      - name: Start LocalDB
        id: localdb
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) { Write-Output "::warning::No LocalDB on this runner"; exit 0 }
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
          # the next step runs in Git Bash, which does not find SqlLocalDB.exe by the lower-case name: it asks this
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        shell: bash
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # Velocity's Linux-only extensions (pcntl, posix) do not exist on Windows; this job never starts it
          COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req='ext-*'
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the SQL Server tests on LocalDB
        shell: bash
        env:
          EXP_TEST_SQLSERVER_HOST: '(localdb)\MSSQLLocalDB'
          EXP_TEST_SQLSERVER_USER: '-'
          EXP_TEST_SQLSERVER_LAYER: sqlsrv
        run: |
          php vendor/bin/phpunit --colors=always --testsuite sqlserver
          # every skipped test prints its reason: a live test skips only when LocalDB does not answer
          if [ "${{ steps.localdb.outputs.available }}" = true ]; then
            php vendor/bin/phpunit --colors=always --display-skipped --testsuite sqlserver-live
          else
            echo "::warning::No LocalDB on this runner: the live tests did not run"
          fi

  # The Firebird driver (expFirebirdDB) against the official Firebird 5 and 4 images: the DB-less tests (testsuite
  # firebird, also in the PHPUnit job above) and the live ones (testsuite firebird-live: the driver, and the kernel
  # schema with its data, read back and upgraded), which fail here instead of skipping. pdo_firebird of PHP 8.4 and
  # later only: the earlier pdo_firebird cannot open a transaction in autocommit mode. The database is made by the
  # image (FIREBIRD_DATABASE) with pages of 16 KB and UTF8, as the driver's documentation asks.
  firebird:
    name: Firebird ${{ matrix.server }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: '5', php: '8.5' }
          - { server: '5', php: '8.4' }
          - { server: '4', php: '8.4' }
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.server }}
        env:
          FIREBIRD_ROOT_PASSWORD: Ci-Firebird-2026
          FIREBIRD_DATABASE: exp_test.fdb
          FIREBIRD_DATABASE_PAGE_SIZE: '16384'
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
        ports:
          - 3050:3050

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, pdo, pdo_firebird, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -x vendor/bin/phpunit

      - name: Generate autoloads
        run: php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for Firebird
        run: |
          php -m | grep -qi pdo_firebird || { echo "::error::PHP has no pdo_firebird"; exit 1; }
          for i in $(seq 1 60); do
            php -r 'try { new PDO("firebird:dbname=127.0.0.1:/var/lib/firebird/data/exp_test.fdb;charset=UTF8", "SYSDBA", "Ci-Firebird-2026"); exit(0); } catch (Exception $e) { fwrite(STDERR, $e->getMessage() . PHP_EOL); exit(1); }' 2>last-error.txt && exit 0
            sleep 3
          done
          cat last-error.txt; docker ps -a; docker logs --tail 40 "${{ job.services.firebird.id }}" || true
          echo "::error::Firebird did not answer"; exit 1

      - name: Run the Firebird tests
        env:
          EXP_TEST_FIREBIRD_HOST: 127.0.0.1
          EXP_TEST_FIREBIRD_PORT: 3050
          EXP_TEST_FIREBIRD_USER: SYSDBA
          EXP_TEST_FIREBIRD_PASSWORD: Ci-Firebird-2026
          EXP_TEST_FIREBIRD_DATABASE: /var/lib/firebird/data/exp_test.fdb
        run: |
          php vendor/bin/phpunit --colors=always --testsuite firebird
          php vendor/bin/phpunit --colors=always tests/tests/lib/ezdbschema/expFirebirdSchemaTest.php
          php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite firebird-live

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # IBM Db2 and Informix (expDb2DB, expInformixDB) over pdo_ibm and ibm_db2, which setup-php builds against IBM's Data
  # Server Driver for ODBC and CLI (Informix through its DRDA listener, on ibm_db2: pdo_ibm cannot read its CLOBs). Db2 Community Edition and Informix Developer Edition run as containers started here (both need
  # --privileged and a database made after the start: Db2's of 32 KB pages, Informix's in a dbspace of 16 KB pages).
  # The first row also installs a whole site on Db2 and renders its front page and admin login.
  db2:
    name: Db2 ${{ matrix.db2 }} and Informix ${{ matrix.informix }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db2: '12.1.6.0', informix: '15.0.1.0.3', php: '8.5', install: true }
          - { db2: '11.5.9.0', informix: '14.10.FC9W1DE', php: '8.3', install: false }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Db2 and Informix
        run: |
          docker run -d --name db2 --privileged -p 50000:50000 -e LICENSE=accept -e DB2INSTANCE=db2inst1 \
            -e DB2INST1_PASSWORD=Ci-Db2-2026 -e SAMPLEDB=false -e ARCHIVE_LOGS=false -e AUTOCONFIG=false \
            -e PERSISTENT_HOME=false icr.io/db2_community/db2:${{ matrix.db2 }}
          docker run -d --name ifx --privileged -p 9089:9089 -e LICENSE=accept \
            icr.io/informix/informix-developer-database:${{ matrix.informix }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, pdo, pdo_ibm, ibm_db2, pdo_sqlite, sqlite3, pcntl, posix, zip, :odbc, :pdo_odbc, :sqlsrv, :pdo_sqlsrv
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      # setup-php's ":pdo_sqlsrv" left the runner's sqlsrv extensions loaded on PHP 8.5, where pdo_sqlsrv then ended
      # PHP at start: every ini line that loads an ODBC or SQL Server extension is commented out
      - name: Unload the ODBC extensions
        run: |
          ini="$(php-config --ini-path 2>/dev/null)/php.ini"
          dir=$(php -n -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
          for f in $ini "$dir"/*.ini /etc/php/${{ matrix.php }}/*/conf.d/*.ini /etc/php/${{ matrix.php }}/*/php.ini; do
            [ -f "$f" ] || continue
            if grep -qiE '^[[:space:]]*(zend_)?extension[[:space:]]*=[[:space:]]*"?[^";]*(pdo_)?(sqlsrv|odbc)' "$f"; then
              echo "unloading in $f"
              sudo sed -i -E 's/^([[:space:]]*(zend_)?extension[[:space:]]*=[[:space:]]*"?[^";]*(pdo_)?(sqlsrv|odbc))/;\1/I' "$f"
            fi
          done
          php -m

      - name: Install dependencies
        run: |
          php -m | grep -qi pdo_ibm || { echo "::error::PHP has no pdo_ibm"; exit 1; }
          php -m | grep -qi ibm_db2 || { echo "::error::PHP has no ibm_db2"; exit 1; }
          # pdo_ibm and an ODBC extension of PHP answer each other's calls: the runner's PHP has odbc, pdo_odbc, sqlsrv and
          # pdo_sqlsrv (Microsoft's driver over unixODBC; it crashed PHP next to pdo_ibm), setup-php turns them off
          php -m | grep -i odbc || true
          ! php -m | grep -qiE "odbc|sqlsrv" || { echo "::error::PHP has an ODBC extension loaded next to pdo_ibm"; exit 1; }
          cp composer.json "${CI_COMPOSER_FILE}"
          # the PHPUnit this PHP runs (Composer would pick PHPUnit 13, which needs 8.4, past --ignore-platform-req=php)
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the DB-less Db2 and Informix tests
        run: |
          php vendor/bin/phpunit --colors=always --testsuite db2
          php vendor/bin/phpunit --colors=always tests/tests/lib/ezdbschema/expDb2SchemaTest.php

      # Db2 takes 3 to 8 minutes to set up its instance; the databases are made here, Db2's with pages of 32 KB and
      # a user temporary tablespace (for the kernel's temporary tables), Informix's in a dbspace of 16 KB pages
      - name: Make the databases
        run: |
          for i in $(seq 1 120); do docker logs db2 2>&1 | grep -q "Setup has completed" && break; sleep 10; done
          docker logs db2 2>&1 | grep -q "Setup has completed" || { docker logs --tail 60 db2; echo "::error::Db2 did not start"; exit 1; }
          for db in EXPSITE EXPLIVE; do
            docker exec db2 su - db2inst1 -c "db2 create database $db using codeset UTF-8 territory US pagesize 32768 && db2 connect to $db && db2 'create user temporary tablespace USERTEMP pagesize 32768' && db2 terminate"
          done
          # Informix's entrypoint initialises the server on every start and stops it again ("Informix is offline -
          # Exit") when the sysadmin database takes more than 60 s, which happens on a busy runner: wait for the end of
          # its start-up ("Type exit to quit"), and restart the container when it gave up
          ifx_ready() {
            for i in $(seq 1 90); do
              [ "$(docker inspect -f '{{.State.Running}}' ifx)" = true ] || return 1
              docker logs --since "$1" ifx 2>&1 | grep -q "Informix is offline" && return 1
              docker logs --since "$1" ifx 2>&1 | grep -q "Type exit to quit" \
                && docker exec ifx bash -lc 'onstat -' 2>/dev/null | grep -q "On-Line" && return 0
              sleep 5
            done
            return 1
          }
          ifx_up() {
            since=$1
            for attempt in 1 2 3; do
              ifx_ready "$since" && return 0
              echo "::warning::Informix did not come up (attempt $attempt), starting it again"
              since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              docker restart ifx >/dev/null
            done
            docker logs --tail 60 ifx; return 1
          }
          ifx_up 1970-01-01T00:00:00Z
          docker exec ifx bash -lc 'for f in /opt/ibm/config/onconfig $INFORMIXDIR/etc/$ONCONFIG; do [ -f "$f" ] || continue; sed -i "s/^PHYSBUFF .*/PHYSBUFF 512/; s/^LOGBUFF .*/LOGBUFF 256/" "$f"; grep -q "size=16k" "$f" || echo "BUFFERPOOL size=16k,buffers=6000,lrus=8,lru_min_dirty=50,lru_max_dirty=60" >> "$f"; done'
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker restart ifx >/dev/null
          ifx_up "$since"
          # a dbspace of 16 KB pages for the kernel's indexes of text, an sbspace (the default one) for its CLOBs
          docker exec ifx bash -lc 'D=$INFORMIX_DATA_DIR/spaces; touch $D/dbs16k.000 $D/sbs1.000 && chmod 660 $D/dbs16k.000 $D/sbs1.000 && onspaces -c -d dbs16k -k 16 -p $D/dbs16k.000 -o 0 -s 2000000 && onspaces -c -S sbs1 -p $D/sbs1.000 -o 0 -s 500000 -Df LOGGING=ON && onmode -wf SBSPACENAME=sbs1 && ontape -s -L 0 -t /dev/null </dev/null >/dev/null 2>&1; export DB_LOCALE=en_us.utf8 CLIENT_LOCALE=en_us.utf8; printf "CREATE DATABASE explive IN dbs16k WITH LOG;\n" > /tmp/db.sql && dbaccess sysmaster /tmp/db.sql'
          php -r 'new PDO("ibm:DATABASE=EXPLIVE;HOSTNAME=127.0.0.1;PORT=50000;PROTOCOL=TCPIP;", "db2inst1", "Ci-Db2-2026"); db2_connect("DATABASE=explive;HOSTNAME=127.0.0.1;PORT=9089;PROTOCOL=TCPIP;UID=informix;PWD=in4mix;", "", "") or exit(1); echo "both answer\n";'

      - name: Run the live tests
        env:
          EXP_TEST_DB2_HOST: 127.0.0.1
          EXP_TEST_DB2_PORT: 50000
          EXP_TEST_DB2_USER: db2inst1
          EXP_TEST_DB2_PASSWORD: Ci-Db2-2026
          EXP_TEST_DB2_DATABASE: EXPLIVE
          EXP_TEST_INFORMIX_HOST: 127.0.0.1
          EXP_TEST_INFORMIX_PORT: 9089
          EXP_TEST_INFORMIX_USER: informix
          EXP_TEST_INFORMIX_PASSWORD: in4mix
          EXP_TEST_INFORMIX_DATABASE: explive
        run: |
          php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite db2-live
          # Db2 on the other layer too (Informix runs on ibm_db2 in both)
          EXP_TEST_DB2_LAYER=ibm_db2 php vendor/bin/phpunit --colors=always --fail-on-skipped --filter '@Db2' --testsuite db2-live

      # The whole site on Db2: the kernel schema and data, the package, the siteaccesses, then the front page, the
      # admin login and a search through PHP's built-in server
      - name: Install a site on Db2
        if: matrix.install
        run: |
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          EXP_INSTALL_DB_PASSWORD=Ci-Db2-2026 php bin/php/install.php --db=db2 --db-host=127.0.0.1 --db-port=50000 \
            --db-name=EXPSITE --db-user=db2inst1 --apply --password=Ci-Db2-Admin-2026 --no-crontab
          php -S 127.0.0.1:8080 -t . index.php >var/log/php-server.log 2>&1 &
          sleep 2
          for page in / /admin/user/login '/content/search?SearchText=exponential'; do
            code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:8080$page")
            echo "$page: $code"
            test "$code" = 200
          done

      - name: Logs
        if: failure()
        run: |
          tail -n 200 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true
          docker logs --tail 60 db2 || true
          docker logs --tail 60 ifx || true

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The generic ODBC driver (expODBCDB) through unixODBC against SQL Server, PostgreSQL, MariaDB and SQLite, on each of
  # PHP's two ODBC layers, and the MS Access import with MDBTools (read only) from MDBTools' own test files. The live
  # tests fail here instead of skipping: every target is configured.
  odbc:
    name: ODBC (${{ matrix.layer }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { layer: pdo_odbc, php: '8.5', install: 'sqlserver mysql' }
          - { layer: odbc, php: '8.4', install: 'postgresql' }
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-SqlServer-2026!
          MSSQL_MEMORY_LIMIT_MB: '2048'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -No -S localhost -U sa -P Ci-SqlServer-2026! -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=10s
          --health-start-period=20s
          --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-odbc
          POSTGRES_DB: odbctest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-odbc
          MARIADB_DATABASE: odbctest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the ODBC drivers and MDBTools
        run: |
          if ! ls /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.*.so.* >/dev/null 2>&1; then
            if ! grep -rqs packages.microsoft.com /etc/apt/sources.list /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo ACCEPT_EULA=Y apt-get -o Acquire::Retries=3 install -y msodbcsql18 unixodbc unixodbc-dev odbcinst \
            odbc-postgresql odbc-mariadb libsqliteodbc mdbtools odbc-mdbtools
          odbcinst -q -d

      - name: MDBTools' test files (Access 97, 2000 and 2007 formats)
        run: |
          mkdir -p "$RUNNER_TEMP/mdbtestdata"
          cd "$RUNNER_TEMP/mdbtestdata"
          git init -q
          git fetch -q --depth 1 https://github.com/mdbtools/mdbtestdata.git 5ebf2d685ec628df72f4774b78abee96a866b837
          git checkout -q FETCH_HEAD
          ls -l data

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, pdo, pdo_odbc, odbc, pdo_sqlite, sqlite3, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 100); do
            php -r 'try { new PDO("odbc:Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;Encrypt=yes;TrustServerCertificate=yes;LoginTimeout=5", "sa", "Ci-SqlServer-2026!"); exit(0); } catch (Exception $e) { exit(1); }' && exit 0
            sleep 3
          done
          echo "::error::SQL Server did not answer"; exit 1

      - name: Run the ODBC and MS Access tests
        env:
          EXP_TEST_ODBC_LAYER: ${{ matrix.layer }}
          EXP_TEST_ODBC_SQLSERVER: Server=127.0.0.1,1433;Encrypt=yes;TrustServerCertificate=yes
          EXP_TEST_ODBC_SQLSERVER_USER: sa
          EXP_TEST_ODBC_SQLSERVER_PASSWORD: Ci-SqlServer-2026!
          EXP_TEST_ODBC_POSTGRESQL: Server=127.0.0.1;Port=5432;Database=odbctest
          EXP_TEST_ODBC_POSTGRESQL_USER: postgres
          EXP_TEST_ODBC_POSTGRESQL_PASSWORD: ci-odbc
          EXP_TEST_ODBC_MYSQL: Server=127.0.0.1;Port=3306;Database=odbctest
          EXP_TEST_ODBC_MYSQL_USER: root
          EXP_TEST_ODBC_MYSQL_PASSWORD: ci-odbc
          EXP_TEST_ODBC_SQLITE: '1'
          EXP_TEST_ACCESS_FIXTURES: ${{ runner.temp }}/mdbtestdata/data
        run: |
          php vendor/bin/phpunit --colors=always --testsuite odbc
          php vendor/bin/phpunit --colors=always --display-skipped --testsuite odbc-live

      # A whole site over ODBC (DatabaseImplementation=odbc): the kernel schema and data, the package, the
      # siteaccesses, then the front page, the admin login and a search through PHP's built-in server. SQL Server runs
      # on its own driver with ODBC as the layer, PostgreSQL and MariaDB on expODBCDB with their schema handlers.
      - name: Install a site over ODBC
        env:
          EXP_ODBC_INSTALL: ${{ matrix.install }}
        run: |
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          php -r 'new PDO("odbc:Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;Encrypt=yes;TrustServerCertificate=yes", "sa", "Ci-SqlServer-2026!")->exec("IF DB_ID(N'"'"'exp_odbc'"'"') IS NULL CREATE DATABASE exp_odbc COLLATE Latin1_General_100_CI_AS_SC_UTF8");'
          for dialect in $EXP_ODBC_INSTALL; do
            case $dialect in
              sqlserver)  set -- --db-port=1433 --db-name=exp_odbc --db-user=sa --db-trust-server-certificate; pw='Ci-SqlServer-2026!' ;;
              postgresql) set -- --db-port=5432 --db-name=odbctest --db-user=postgres; pw=ci-odbc ;;
              mysql)      set -- --db-port=3306 --db-name=odbctest --db-user=root; pw=ci-odbc ;;
            esac
            echo "::group::install over ODBC: $dialect"
            start=$(date +%s)
            EXP_INSTALL_DB_PASSWORD="$pw" php bin/php/install.php --db=odbc --db-dialect=$dialect --db-host=127.0.0.1 "$@" \
              --apply --force --password=Ci-Odbc-Admin-2026 --no-crontab
            echo "installed in $(( $(date +%s) - start )) s"
            grep -A4 '^\[ODBCSettings\]' settings/override/site.ini.append.php
            grep -q '^DatabaseImplementation=odbc' settings/override/site.ini.append.php
            php -S 127.0.0.1:8080 -t . index.php >var/log/php-server.log 2>&1 &
            server=$!
            sleep 2
            for page in / /admin/user/login '/content/search?SearchText=exponential'; do
              code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:8080$page")
              echo "$dialect $page: $code"
              test "$code" = 200
            done
            kill $server
            echo "::endgroup::"
          done

      - name: Logs
        if: failure()
        run: tail -n 200 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The databases of the PostgreSQL wire protocol (expPostgreSQLWireDB): CockroachDB, YugabyteDB, and Google Cloud
  # Spanner's emulator behind PGAdapter, each in a container started here (a service container cannot be given the
  # command these images need). The DB-less tests run in the PHPUnit job above (testsuite pgwire); these are the live
  # ones (testsuite pgwire-live). Neon, Supabase and Aurora are services without a container: they have no live job.
  pgwire:
    name: PostgreSQL wire protocol (CockroachDB, YugabyteDB, Spanner emulator; PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start CockroachDB, YugabyteDB and PGAdapter with the Spanner emulator
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:v25.2.4 start-single-node --insecure
          docker run -d --name yugabyte -p 5433:5433 yugabytedb/yugabyte:2.25.2.0-b359 bin/yugabyted start --background=false
          docker run -d --name spanner -p 15432:5432 gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator:latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, pdo, pgsql, pdo_pgsql, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for the servers and make the test databases
        run: |
          ready() { psql "$1" -Atc 'SELECT 1' >/dev/null 2>&1; }
          for i in $(seq 1 60); do ready "host=127.0.0.1 port=26257 user=root dbname=defaultdb sslmode=disable" && break; sleep 3; done
          psql "host=127.0.0.1 port=26257 user=root dbname=defaultdb sslmode=disable" -c 'CREATE DATABASE IF NOT EXISTS exp_pgwire_test'
          for i in $(seq 1 100); do ready "host=127.0.0.1 port=5433 user=yugabyte dbname=yugabyte sslmode=disable" && break; sleep 3; done
          psql "host=127.0.0.1 port=5433 user=yugabyte dbname=yugabyte sslmode=disable" -c 'CREATE DATABASE exp_pgwire_test'
          for i in $(seq 1 60); do ready "host=127.0.0.1 port=15432 dbname=exp_pgwire_test sslmode=disable" && break; sleep 3; done
          ready "host=127.0.0.1 port=15432 dbname=exp_pgwire_test sslmode=disable" || { docker logs --tail 40 spanner; echo "::error::PGAdapter did not answer"; exit 1; }

      - name: Run the PostgreSQL wire protocol tests
        env:
          EXP_TEST_PGWIRE_COCKROACHDB_HOST: 127.0.0.1
          EXP_TEST_PGWIRE_COCKROACHDB_PORT: 26257
          EXP_TEST_PGWIRE_YUGABYTEDB_HOST: 127.0.0.1
          EXP_TEST_PGWIRE_YUGABYTEDB_PORT: 5433
          EXP_TEST_PGWIRE_SPANNER_HOST: 127.0.0.1
          EXP_TEST_PGWIRE_SPANNER_PORT: 15432
        run: |
          php vendor/bin/phpunit --colors=always --testsuite pgwire
          php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite pgwire-live

      - name: Clean CI Composer overlay
        if: always()
        run: |
          rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"
          docker rm -f crdb yugabyte spanner || true

  # DuckDB (expDuckDBDB): the DB-less tests, the live tests against libduckdb through PHP's FFI extension, and a
  # whole site installed on DuckDB (exp:install --db=duckdb) with its front page and admin login rendered. DuckDB is
  # embedded: the library is downloaded from DuckDB's releases, no service runs.
  duckdb:
    name: DuckDB ${{ matrix.duckdb }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { duckdb: '2.0.1', php: '8.5', install: true }
          - { duckdb: '1.5.6', php: '8.3', install: false }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download libduckdb ${{ matrix.duckdb }}
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb" && cd "$RUNNER_TEMP/duckdb"
          base="https://github.com/duckdb/duckdb/releases/download/v${{ matrix.duckdb }}"
          # 2.0 publishes duckdb-shared-libs-linux-amd64.tar.gz, 1.x libduckdb-linux-amd64.zip
          if curl -fsSL --retry 3 -o lib.tgz "$base/duckdb-shared-libs-linux-amd64.tar.gz"; then
            tar xzf lib.tgz
          else
            curl -fsSL --retry 3 -o lib.zip "$base/libduckdb-linux-amd64.zip" && unzip -oq lib.zip
          fi
          ls -l libduckdb.so
          echo "EXP_TEST_DUCKDB_LIBRARY=$RUNNER_TEMP/duckdb/libduckdb.so" >> "$GITHUB_ENV"
          echo "DUCKDB_LIBRARY=$RUNNER_TEMP/duckdb/libduckdb.so" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, ffi, pdo, pdo_sqlite, sqlite3, pcntl, posix, zip
          ini-values: ffi.enable=true, memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # the PHPUnit this PHP runs (Composer would pick PHPUnit 13, which needs 8.4, past --ignore-platform-req=php)
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the DuckDB tests
        run: |
          php vendor/bin/phpunit --colors=always --testsuite duckdb
          php vendor/bin/phpunit --colors=always --display-skipped --testsuite duckdb-live

      # The whole site: the kernel schema and data, the package, the siteaccesses, then the front page and the admin
      # login through PHP's built-in server
      - name: Install a site on DuckDB
        if: matrix.install
        run: |
          # the help manuals are built by a background worker for 20 to 30 minutes, which holds the DuckDB file to
          # write: the page checks below would wait for it, so the CI site builds none
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          php bin/php/install.php --db=duckdb --apply --password=Ci-DuckDB-2026 --no-crontab
          ls -l var/storage/duckdb/
          php -S 127.0.0.1:8080 -t . index.php >var/log/php-server.log 2>&1 &
          sleep 2
          code=$(curl -s -o front.html -w '%{http_code}' http://127.0.0.1:8080/)
          echo "front page: $code"; head -c 600 front.html
          test "$code" = 200
          code=$(curl -s -o admin.html -w '%{http_code}' http://127.0.0.1:8080/admin/user/login)
          echo "admin login: $code"
          test "$code" = 200

      - name: Logs
        if: failure() && matrix.install
        run: tail -n 200 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # Apache Cassandra and ScyllaDB (expCassandraDB, expScyllaDB) through the library mroosz/php-cassandra: the DB-less
  # tests (testsuite cassandra, also in the PHPUnit job above, where the live ones skip) and the live ones (testsuite
  # cassandra-live: the driver, data table connections with persistent classes, the import from a keyspace) against
  # Cassandra 5.0 without authentication and ScyllaDB 2025.1 with PasswordAuthenticator. The live tests fail here
  # instead of skipping: both servers are configured.
  cassandra:
    name: Cassandra and ScyllaDB (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Cassandra 5.0 and ScyllaDB 2025.1
        run: |
          docker run -d --name cassandra -p 9042:9042 -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=200M \
            -e "JVM_EXTRA_OPTS=-XX:MaxDirectMemorySize=512M" cassandra:5.0
          docker run -d --name scylladb -p 9043:9042 scylladb/scylla:2025.1 --smp 1 --memory 1G --reserve-memory 0M \
            --overprovisioned 1 --developer-mode 1 --authenticator PasswordAuthenticator --authorizer CassandraAuthorizer

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, pdo, pdo_sqlite, sqlite3, sockets, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies (with mroosz/php-cassandra)
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          COMPOSER="${CI_COMPOSER_FILE}" composer require --no-update --no-interaction "mroosz/php-cassandra:^1.2"
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::composer update failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          test -d vendor/mroosz/php-cassandra/src
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for the servers
        run: |
          for i in $(seq 1 90); do docker exec cassandra cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1 && break; sleep 3; done
          docker exec cassandra cqlsh -e 'SELECT release_version FROM system.local' || { docker logs --tail 40 cassandra; echo "::error::Cassandra did not answer"; exit 1; }
          for i in $(seq 1 90); do docker exec scylladb cqlsh -u cassandra -p cassandra -e 'SELECT version FROM system.versions' >/dev/null 2>&1 && break; sleep 3; done
          docker exec scylladb cqlsh -u cassandra -p cassandra -e 'SELECT version FROM system.versions' || { docker logs --tail 40 scylladb; echo "::error::ScyllaDB did not answer"; exit 1; }

      - name: Run the Cassandra and ScyllaDB tests
        env:
          EXP_TEST_CASSANDRA_HOST: 127.0.0.1
          EXP_TEST_CASSANDRA_PORT: 9042
          EXP_TEST_SCYLLADB_HOST: 127.0.0.1
          EXP_TEST_SCYLLADB_PORT: 9043
          EXP_TEST_SCYLLADB_USER: cassandra
          EXP_TEST_SCYLLADB_PASSWORD: cassandra
        run: |
          php vendor/bin/phpunit --colors=always --testsuite cassandra
          php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite cassandra-live

      - name: Logs
        if: failure()
        run: |
          docker logs --tail 80 cassandra || true
          docker logs --tail 80 scylladb || true

      - name: Clean CI Composer overlay
        if: always()
        run: |
          rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"
          docker rm -f cassandra scylladb || true

  # libSQL (sqld, the libsql-server container): the driver's tests without a server and against one, then a whole site
  # installed on the server over its HTTP API, its front page and the admin login. sqld 0.24.33, pinned by digest.
  libsql:
    name: libSQL sqld 0.24 (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.5', install: true }
          - { php: '8.3', install: false }

    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, pdo, pdo_sqlite, sqlite3, pcntl, posix, zip
          ini-values: memory_limit=1G, allow_url_fopen=On
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # the PHPUnit this PHP runs (Composer would pick PHPUnit 13, which needs 8.4, past --ignore-platform-req=php)
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for sqld
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/version; echo

      - name: Run the libSQL tests
        env:
          EXP_TEST_LIBSQL_URL: http://127.0.0.1:8080
        run: |
          php vendor/bin/phpunit --colors=always --testsuite libsql
          php vendor/bin/phpunit --colors=always --display-skipped --testsuite libsql-live

      # The whole site: the kernel schema and data, the package, the siteaccesses, then the front page and the admin
      # login through PHP's built-in server, the database on sqld
      - name: Install a site on libSQL
        if: matrix.install
        run: |
          # the help manuals are built by a background worker for a long time: the CI site builds none
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          php bin/php/install.php --db=libsql --db-host=127.0.0.1 --db-port=8080 --apply --password=Ci-LibSQL-2026 --no-crontab
          php -S 127.0.0.1:8090 -t . index.php >var/log/php-server.log 2>&1 &
          sleep 2
          code=$(curl -s -o front.html -w '%{http_code}' http://127.0.0.1:8090/)
          echo "front page: $code"; head -c 600 front.html
          test "$code" = 200
          code=$(curl -s -o admin.html -w '%{http_code}' http://127.0.0.1:8090/admin/user/login)
          echo "admin login: $code"
          test "$code" = 200

      - name: Logs
        if: failure() && matrix.install
        run: tail -n 200 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"
  # Couchbase and Apache CouchDB: the drivers (expCouchbaseDB over the Query service's SQL++, expCouchDBDB over CouchDB's
  # HTTP API), the data table connections and the imports, against Couchbase Server Community and CouchDB in containers.
  # Neither is a site database (see their driver pages), so no site is installed here.
  couch:
    name: Couchbase ${{ matrix.couchbase }} and CouchDB ${{ matrix.couchdb }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { couchbase: 'community-7.6.2', couchdb: '3.4.3', php: '8.5' }
          - { couchbase: 'community-7.2.4', couchdb: '3.3.3', php: '8.1' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Couchbase and CouchDB
        run: |
          docker run -d --name couchbase -p 8091:8091 -p 8093:8093 couchbase/server:${{ matrix.couchbase }}
          docker run -d --name couchdb -p 5984:5984 -e COUCHDB_USER=exp -e COUCHDB_PASSWORD=Ci-Couch-2026 couchdb:${{ matrix.couchdb }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, pdo, pdo_sqlite, sqlite3, pcntl, posix, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          # the PHPUnit this PHP runs (Composer would pick PHPUnit 13, which needs 8.4, past --ignore-platform-req=php)
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the DB-less Couchbase and CouchDB tests
        run: php vendor/bin/phpunit --colors=always --testsuite couch

      # Couchbase: one node with the data, index and query services, a bucket without replicas (a transaction's writes
      # are then durable on the one node); CouchDB: its system databases, as a single node needs them
      - name: Set up the servers
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8091/ui/index.html && break; sleep 3; done
          docker exec couchbase couchbase-cli cluster-init -c 127.0.0.1 --cluster-username exp --cluster-password Ci-Couchbase-2026 \
            --services data,index,query --cluster-ramsize 512 --cluster-index-ramsize 256 --index-storage-setting default
          docker exec couchbase couchbase-cli bucket-create -c 127.0.0.1 -u exp -p Ci-Couchbase-2026 --bucket exponential \
            --bucket-type couchbase --bucket-ramsize 256 --bucket-replica 0 --wait
          for i in $(seq 1 60); do curl -sf -u exp:Ci-Couchbase-2026 http://127.0.0.1:8093/query/service -d 'statement=SELECT RAW 1' | grep -q success && break; sleep 3; done
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5984/ && break; sleep 2; done
          for db in _users _replicator; do curl -sf -u exp:Ci-Couch-2026 -X PUT "http://127.0.0.1:5984/$db" || true; done
          curl -s -u exp:Ci-Couchbase-2026 http://127.0.0.1:8093/query/service -d 'statement=SELECT RAW ds_version()'
          curl -s -u exp:Ci-Couch-2026 http://127.0.0.1:5984/

      - name: Run the live tests
        env:
          EXP_TEST_COUCHBASE_HOST: 127.0.0.1
          EXP_TEST_COUCHBASE_PORT: 8093
          EXP_TEST_COUCHBASE_USER: exp
          EXP_TEST_COUCHBASE_PASSWORD: Ci-Couchbase-2026
          EXP_TEST_COUCHBASE_BUCKET: exponential
          EXP_TEST_COUCHDB_HOST: 127.0.0.1
          EXP_TEST_COUCHDB_PORT: 5984
          EXP_TEST_COUCHDB_USER: exp
          EXP_TEST_COUCHDB_PASSWORD: Ci-Couch-2026
        run: php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite couch-live

      - name: Logs
        if: failure()
        run: |
          docker logs --tail 60 couchbase || true
          docker logs --tail 60 couchdb || true

      - name: Clean CI Composer overlay
        if: always()
        run: rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"

  # The columnar databases: MonetDB (expMonetDBDB, a whole site) and ClickHouse (expClickHouseDB, data tables and
  # imports). The DB-less tests, the live tests against both servers in containers, and on the newest pair a whole site
  # installed on MonetDB (exp:install --db=monetdb) with its front page and admin login rendered. Neither needs a PHP
  # extension: MonetDB is reached over its protocol MAPI in plain PHP, ClickHouse over HTTP.
  columnar:
    name: Columnar (MonetDB ${{ matrix.monetdb }}, ClickHouse ${{ matrix.clickhouse }}; PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { monetdb: 'Dec2025-SP5', clickhouse: '25.8.33.6', php: '8.5', install: true }
          - { monetdb: 'Dec2023-SP4', clickhouse: '24.8', php: '8.1', install: false }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start MonetDB and ClickHouse
        run: |
          docker run -d --name monetdb -p 50000:50000 -e MDB_DB_ADMIN_PASS=monetdb -e MDB_CREATE_DBS=exp monetdb/monetdb:${{ matrix.monetdb }}
          docker run -d --name clickhouse -p 8123:8123 -e CLICKHOUSE_USER=exp -e CLICKHOUSE_PASSWORD=exp -e CLICKHOUSE_DB=exp \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 --ulimit nofile=262144:262144 clickhouse/clickhouse-server:${{ matrix.clickhouse }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, xsl, curl, zlib, pdo, pdo_sqlite, sqlite3, pcntl, posix, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          case "${{ matrix.php }}" in
            8.1) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^10.5" ;;
            8.2|8.3) COMPOSER="${CI_COMPOSER_FILE}" composer require --dev --no-update --no-interaction "phpunit/phpunit:^11.5" ;;
          esac
          for attempt in 1 2 3; do
            COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req=ext-mongodb && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Wait for the servers
        run: |
          for i in $(seq 1 60); do curl -sf -u exp:exp 'http://127.0.0.1:8123/?query=SELECT%201' >/dev/null && break; sleep 2; done
          curl -sf -u exp:exp 'http://127.0.0.1:8123/?query=SELECT%20version()' || { docker logs --tail 40 clickhouse; exit 1; }
          for i in $(seq 1 60); do docker exec monetdb sh -c 'printf "user=monetdb\npassword=monetdb\n" > /tmp/.m; DOTMONETDBFILE=/tmp/.m mclient -d exp -s "SELECT 1"' >/dev/null 2>&1 && break; sleep 2; done
          docker exec monetdb sh -c 'DOTMONETDBFILE=/tmp/.m mclient -d exp -s "SELECT value FROM sys.env() WHERE name = '"'"'monet_version'"'"'"' || { docker logs --tail 40 monetdb; exit 1; }

      - name: Run the MonetDB and ClickHouse tests
        env:
          EXP_TEST_MONETDB_HOST: 127.0.0.1
          EXP_TEST_MONETDB_PASSWORD: monetdb
          EXP_TEST_MONETDB_DATABASE: exp
          EXP_TEST_CLICKHOUSE_HOST: 127.0.0.1
          EXP_TEST_CLICKHOUSE_USER: exp
          EXP_TEST_CLICKHOUSE_PASSWORD: exp
          EXP_TEST_CLICKHOUSE_DATABASE: exp
        run: |
          php vendor/bin/phpunit --colors=always --testsuite columnar
          php vendor/bin/phpunit --colors=always --fail-on-skipped --testsuite columnar-live

      # The whole site on MonetDB: a user with a schema of its own, then the kernel schema and data, the package, the
      # siteaccesses, the front page and the admin login through PHP's built-in server
      - name: Install a site on MonetDB
        if: matrix.install
        run: |
          docker exec monetdb sh -c 'DOTMONETDBFILE=/tmp/.m mclient -d exp -s "CREATE USER \"exponential\" WITH PASSWORD '"'"'Ci-MonetDB-Site-2026'"'"' NAME '"'"'Exponential'"'"' SCHEMA \"sys\"; CREATE SCHEMA \"exponential\" AUTHORIZATION \"exponential\"; ALTER USER \"exponential\" SET SCHEMA \"exponential\""'
          mkdir -p settings/override
          printf '<?php /* #?ini charset="utf-8"?\n[ManualSettings]\nBuildOnInstall=disabled\n*/ ?>\n' > settings/override/exphelp.ini.append.php
          EXP_INSTALL_DB_PASSWORD=Ci-MonetDB-Site-2026 php bin/php/install.php --db=monetdb --db-host=127.0.0.1 --db-user=exponential --db-name=exp \
            --apply --password=Ci-MonetDB-2026 --no-crontab
          php -S 127.0.0.1:8080 -t . index.php >var/log/php-server.log 2>&1 &
          sleep 2
          code=$(curl -s -o front.html -w '%{http_code}' http://127.0.0.1:8080/)
          echo "front page: $code"; head -c 600 front.html
          test "$code" = 200
          code=$(curl -s -o admin.html -w '%{http_code}' http://127.0.0.1:8080/admin/user/login)
          echo "admin login: $code"
          test "$code" = 200

      - name: Logs
        if: failure()
        run: |
          tail -n 200 var/log/error.log var/log/setup.log var/log/php-server.log 2>/dev/null || true
          docker logs --tail 60 monetdb || true
          docker logs --tail 60 clickhouse || true

      - name: Clean CI Composer overlay
        if: always()
        run: |
          rm -f "${CI_COMPOSER_FILE}" "${CI_COMPOSER_FILE%.json}.lock"
          docker rm -f monetdb clickhouse || true

  # MS Access on Windows: Microsoft's Access Database Engine 2016 (x64) ODBC driver, an empty .accdb made with ADOX,
  # the driver's live tests, the import through ODBC, and the probe of a minimal site on Access (its report is an
  # artifact). The engine is a download from Microsoft, not part of the runner image, so the job may not fail the run.
  msaccess-windows:
    name: MS Access (ACE x64, ${{ matrix.os }}, PHP 8.4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, windows-2025 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, pcre, json, iconv, reflection, session, spl, simplexml, gd, intl, sockets, pdo, pdo_odbc, odbc, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install the Access Database Engine (x64)
        shell: pwsh
        run: |
          if (-not (Get-OdbcDriver -Name 'Microsoft Access Driver (*.mdb, *.accdb)' -Platform '64-bit' -ErrorAction SilentlyContinue)) {
            $exe = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
            Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $exe
            $p = Start-Process -FilePath $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
            Write-Output "installer exit code: $($p.ExitCode)"
          }
          Get-OdbcDriver -Platform '64-bit' | Where-Object Name -like '*Access*' | Format-List Name, Attribute

      - name: Make empty Access files
        shell: pwsh
        run: |
          foreach ($name in 'exp-test', 'exp-kernel') {
            $file = Join-Path $env:RUNNER_TEMP "$name.accdb"
            $catalog = New-Object -ComObject ADOX.Catalog
            $catalog.Create("Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$file") | Out-Null
            $catalog.ActiveConnection.Close()
            Get-Item $file | Format-List FullName, Length
          }
          "EXP_TEST_MSACCESS_FILE=$(Join-Path $env:RUNNER_TEMP 'exp-test.accdb')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXP_TEST_MSACCESS_KERNEL_FILE=$(Join-Path $env:RUNNER_TEMP 'exp-kernel.accdb')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MDBTools' test files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mdbtestdata" && cd "$RUNNER_TEMP/mdbtestdata"
          git init -q
          git fetch -q --depth 1 https://github.com/mdbtools/mdbtestdata.git 5ebf2d685ec628df72f4774b78abee96a866b837
          git checkout -q FETCH_HEAD

      - name: Install dependencies
        shell: bash
        run: |
          cp composer.json "${CI_COMPOSER_FILE}"
          COMPOSER="${CI_COMPOSER_FILE}" composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction --ignore-platform-req=php --ignore-platform-req='ext-*'
          php bin/php/ezpgenerateautoloads.php -s -e

      - name: Run the MS Access tests
        shell: bash
        env:
          EXP_TEST_ACCESS_FIXTURES: ${{ runner.temp }}/mdbtestdata/data
        run: |
          php vendor/bin/phpunit --colors=always --testsuite odbc
          php vendor/bin/phpunit --colors=always --display-skipped tests/tests/lib/ezdb/odbc/live/expMSAccessLiveTest.php
          php vendor/bin/phpunit --colors=always --display-skipped tests/tests/kernel/classes/msaccess/live/expAccessImportLiveTest.php
          php vendor/bin/phpunit --colors=always --display-skipped tests/tests/lib/ezdb/odbc/live/expMSAccessKernelSchemaTest.php

      - name: Keep the probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msaccess-kernel-probe-${{ matrix.os }}
          path: var/tmp/msaccess-kernel-probe.json
          if-no-files-found: ignore
