#?ini charset="utf-8"?
# expservices: remote services over ezjscore/call/exp<domain>::<method>[::arg...]
# Guide: doc/bc/6.0/backend_ezjscore_services.md

[Services]
# Master switch: when disabled every service answers 403
Enabled=enabled
# Domains are the [ezjscServer_exp<domain>] blocks of ezjscore.ini whose Class extends expServiceBase.

[Paging]
DefaultLimit=25
MaxLimit=200

[Writes]
# Writes need POST and the form token; set to disabled only for tests
RequireToken=enabled
# Audit event written for every successful write (expAudit): service.<domain>.<method>
Audit=enabled

[Community]
# The community services (forum, topic, reply, comment, poll) work on content classes, by identifier.
# Change them to run the services over the classes of another site.
ForumClass=forum
ForumContainerClass=forums
TopicClass=forum_topic
ReplyClass=forum_reply
CommentClass=comment
PollClass=poll
ReviewClass=review
# The attribute that says a topic stays on top
TopicStickyAttribute=sticky
