# Exponential 6 container image: the virtual host. The rewrite rules are the
# installation's own .htaccess_root, read here once at start-up rather than
# from .htaccess on every request (AllowOverride None). Every path they do not
# name as static goes to index.php, so code and settings are never served.
ServerName localhost
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2
LogFormat "%{X-Forwarded-For}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" exp_combined
CustomLog /proc/self/fd/1 exp_combined

<VirtualHost *:8080>
    DocumentRoot /var/www/exponential

    <Directory /var/www/exponential>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        # The health check's PHP-FPM ping, before the installation's rules
        RewriteRule ^fpm-ping$ - [L]
        Include /var/www/exponential/.htaccess_root
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Location "/fpm-ping">
        Require ip 127.0.0.1 ::1
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </Location>

</VirtualHost>
