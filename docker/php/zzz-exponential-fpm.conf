; Exponential 6 container image: the PHP-FPM pool. Read after the official
; image's zz-docker.conf, so these values win. The master runs as www-data, so
; the user and group lines of www.conf have no effect and are not repeated.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /run/php/php-fpm.sock
listen.mode = 0600
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; Answers "pong" for the health check, only through Apache from 127.0.0.1
ping.path = /fpm-ping
; The environment reaches PHP: EXP_DEMO_MODE and the like
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
