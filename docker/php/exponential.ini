; Exponential 6 container image: PHP settings for Apache with PHP-FPM and for
; Velocity. Override any of them with a file of your own mounted into
; $PHP_INI_DIR/conf.d/ (read in name order, after this one when its name sorts
; later, for example zzz-site.ini).
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; The code in the image does not change, but the caches in var/ (settings,
; compiled templates) and the autoload arrays are PHP files rewritten in place
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

apc.enable_cli = 1
apc.shm_size = 128M
