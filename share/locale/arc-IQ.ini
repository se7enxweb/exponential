#?ini charset="utf-8"?
# Imperial Aramaic (Iraq). Generated from Unicode CLDR 44 data (ICU locale syr_IQ, transliterated into Hebrew square script) for Exponential 6.0.15.
# Unicode CLDR 44 has no data for Imperial Aramaic (ISO 639-3 arc, the Aramaic of the Achaemenid empire, written
# in the square script that became the Hebrew one). eZLocale codes need a country; Iraq, where Aramaic is still
# spoken and written and whose locale syr-IQ is the source, gives the conventions. Values and their source:
# - numbers, currency (IQD, Iraqi dinar), date and time patterns: CLDR syr_IQ, as syr-IQ.ini; the 24-hour clock;
# - month names: the Aramaic names of the Gregorian months used in Iraq and Syria (CLDR syr_IQ), transliterated
#   letter for letter from Syriac into Hebrew square script (kanun, shvat, adar ... the Babylonian names);
# - day names: the Aramaic names (chad bshaba ... aruvta, shabta), written as separate words; the short names are
#   CLDR syr_IQ's, transliterated;
# - the currency name: dinar of Iraq in Aramaic (דינרא עיראקיא), by hand;
# - country names: CLDR syr_IQ, transliterated; names CLDR has only in English stay English.
# The language name ארמית is the name of the language in the Hebrew Bible (Ezra 4:7, Daniel 2:4).
# Needs a review by a specialist. The administration catalogue share/translations/arc-IQ is syr-IQ's, transliterated.
# CLDR: Copyright (c) Unicode, Inc., Unicode License v3, https://www.unicode.org/license.txt
# Reference: doc/eng-us/languages.md
# Text direction: right-to-left ([LanguageSettings] TextDirection, see "Right-to-left languages" in doc/eng-us/languages.md).
[RegionalSettings]
Country=Iraq
LanguageName=ארמית
InternationalLanguageName=Imperial Aramaic

[LanguageSettings]
TextDirection=rtl

[Charset]
Preferred=utf-8

[HTTP]
ContentLanguage=arc-IQ

[Currency]
# ISO 4217 IQD
Symbol=IQD
Name=דינרא עיראקיא
ShortName=IQD
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=0
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%c %p%q
NegativeFormat=%c %p%q

[Numbers]
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
# CLDR syr_IQ uses a 12-hour clock; eZLocale only prints am/pm, so the 24-hour clock is used.
TimeFormat=%H:%i:%s
ShortTimeFormat=%H:%i
DateFormat=%l, %j ב%F %Y
ShortDateFormat=%j-%m-%Y
DateTimeFormat=%l, %j ב%F %Y %H:%i:%s
ShortDateTimeFormat=%j-%m-%Y %H:%i
MondayFirst=no

