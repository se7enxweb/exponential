# CLDR has Yiddish only as yi_UA (Ukraine; before CLDR 43 yi_001, "world"). eZLocale codes need a two-letter
# country (eZLocale::localeRegexp() allows letters only, so 001 cannot be used), and the largest Yiddish-speaking
# community lives in the United States: Yiddish names from CLDR yi, conventions and currency of the United States.
