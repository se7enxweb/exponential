#?ini charset="utf-8"?
# Latin. Generated from Unicode CLDR 44 data (ICU locale it_VA for the conventions, names by hand) for Exponential 6.0.15.
# Unicode CLDR 44 (ICU 74.2) has no Latin data. Numbers, currency, date patterns and the first
# day of the week follow CLDR it_VA (Italian, Vatican City), the conventions of the Holy See. Written by hand:
# the language name, the month names (nominative, Ianuarius ...), the day names (ecclesiastical, as the Holy See
# uses them: Dominica, Feria secunda ... Sabbatum) and the long date, which shows the abbreviated month (Nov.) so
# that no case ending is needed after the day. Country names are CLDR's English ones.
# CLDR: Copyright (c) Unicode, Inc., Unicode License v3, https://www.unicode.org/license.txt
# Reference: doc/languages.md
[RegionalSettings]
Country=Vatican City
LanguageName=Latina
InternationalLanguageName=Latin

[Charset]
Preferred=utf-8

[HTTP]
ContentLanguage=la-VA

[Currency]
# ISO 4217 EUR
Symbol=€
Name=Euro
ShortName=EUR
DecimalSymbol=,
ThousandsSeparator=.
FractDigits=2
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%p%q %c
NegativeFormat=%p%q %c

[Numbers]
DecimalSymbol=,
ThousandsSeparator=.
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
TimeFormat=%H:%i:%s
ShortTimeFormat=%H:%i
DateFormat=%l, %j %M %Y
ShortDateFormat=%d/%m/%Y
DateTimeFormat=%l, %j %M %Y %H:%i:%s
ShortDateTimeFormat=%d/%m/%Y %H:%i
MondayFirst=yes

[ShortMonthNames]
jan=Ian.
feb=Feb.
mar=Mart.
apr=Apr.
may=Mai.
jun=Iun.
jul=Iul.
aug=Aug.
sep=Sept.
oct=Oct.
nov=Nov.
dec=Dec.

[LongMonthNames]
jan=Ianuarius
feb=Februarius
mar=Martius
apr=Aprilis
may=Maius
jun=Iunius
jul=Iulius
aug=Augustus
sep=September
oct=October
nov=November
dec=December

[ShortDayNames]
mon=Fer. II
tue=Fer. III
wed=Fer. IV
thu=Fer. V
fri=Fer. VI
sat=Sab.
sun=Dom.

[LongDayNames]
mon=Feria secunda
tue=Feria tertia
wed=Feria quarta
thu=Feria quinta
fri=Feria sexta
sat=Sabbatum
sun=Dominica

