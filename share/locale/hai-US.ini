#?ini charset="utf-8"?
# Haida. Written by hand for Exponential 6.0.15. CLDR has no data for this language:
# the formats are those of eng-US, and the month and day names stay in English until a checked source exists.
# Reference: doc/eng-us/languages.md
[RegionalSettings]
Country=United States
LanguageName=Xaad Kíl
InternationalLanguageName=Haida

[Charset]
Preferred=utf-8

[HTTP]
ContentLanguage=hai-US

[Currency]
Symbol=$
Name=US Dollar
ShortName=USD
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%c%p%q
NegativeFormat=%c%p%q

[Numbers]
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
TimeFormat=%h:%i:%s %a
ShortTimeFormat=%h:%i %a
DateFormat=%l %F %d %Y
ShortDateFormat=%m/%d/%Y
DateTimeFormat=%l %F %d %Y %h:%i:%s %a
ShortDateTimeFormat=%m/%d/%Y %h:%i %a
MondayFirst=no

[ShortMonthNames]
jan=Jan
feb=Feb
mar=Mar
apr=Apr
may=May
jun=Jun
jul=Jul
aug=Aug
sep=Sep
oct=Oct
nov=Nov
dec=Dec

[LongMonthNames]
jan=January
feb=February
mar=March
apr=April
may=May
jun=June
jul=July
aug=August
sep=September
oct=October
nov=November
dec=December

[ShortDayNames]
mon=Mon
tue=Tue
wed=Wed
thu=Thu
fri=Fri
sat=Sat
sun=Sun

[LongDayNames]
mon=Monday
tue=Tuesday
wed=Wednesday
thu=Thursday
fri=Friday
sat=Saturday
sun=Sunday
