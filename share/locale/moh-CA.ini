#?ini charset="utf-8"?
# Mohawk. Written by hand for Exponential 6.0.15. CLDR has no data for this language:
# the currency, number and date formats follow CLDR en_CA (as in the Cree file), and the month and day
# names stay in English until a checked source exists.
# Reference: doc/eng-us/languages.md
[RegionalSettings]
Country=Canada
LanguageName=Kanien'kéha
InternationalLanguageName=Mohawk

[Charset]
Preferred=utf-8

[HTTP]
ContentLanguage=moh-CA

[Currency]
# ISO 4217 CAD
Symbol=$
Name=Canadian dollar
ShortName=CAD
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%c%p%q
NegativeFormat=%c%p%q

[Numbers]
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
# CLDR uses a 12-hour clock with "a.m."; eZLocale only prints am/pm, so the 24-hour clock is used.
TimeFormat=%H:%i:%s
ShortTimeFormat=%H:%i
DateFormat=%l, %F %j, %Y
ShortDateFormat=%Y-%m-%d
DateTimeFormat=%l, %F %j, %Y %H:%i:%s
ShortDateTimeFormat=%Y-%m-%d %H:%i
MondayFirst=no

[ShortMonthNames]
jan=Jan
feb=Feb
mar=Mar
apr=Apr
may=May
jun=Jun
jul=Jul
aug=Aug
sep=Sep
oct=Oct
nov=Nov
dec=Dec

[LongMonthNames]
jan=January
feb=February
mar=March
apr=April
may=May
jun=June
jul=July
aug=August
sep=September
oct=October
nov=November
dec=December

[ShortDayNames]
mon=Mon
tue=Tue
wed=Wed
thu=Thu
fri=Fri
sat=Sat
sun=Sun

[LongDayNames]
mon=Monday
tue=Tuesday
wed=Wednesday
thu=Thursday
fri=Friday
sat=Saturday
sun=Sunday
