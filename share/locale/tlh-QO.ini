#?ini charset="utf-8"?
# Klingon (tlhIngan Hol). Written by hand for Exponential 6.0.15; not from Unicode CLDR, which has no Klingon data.
# Code: tlh is the ISO 639-2 and 639-3 code of Klingon; QO is a private-use region code (ISO 3166-1 user-assigned
# range QM-QZ), because Klingon belongs to no country. The country name says so plainly; it is not CLDR's
# "Outlying Oceania", which CLDR assigns to QO for its own use.
# Script: the Latin transcription of Marc Okrand's The Klingon Dictionary (1985, 1992), with its significant
# capitals (tlhIngan, not Tlhingan). The pIqaD script is not used: it lies in the Unicode Private Use Area
# (ConScript Unicode Registry) and needs a special font.
# Day names: the names Marc Okrand gave for the days of the Terran week (DaSjaj ... lojmItjaj), as collected by the
# Klingon Language Institute. Month names: jar ("month", The Klingon Dictionary) followed by the Klingon number,
# jar wa' ("month one") to jar wa'maH cha' ("month twelve"), the way Klingon speakers name the Terran months.
# Formats: English conventions (as eng-US), with day, month and year in the order of the long date
# "loghjaj, 14 jar wa'maH wa' 2023" so that the number of the month cannot run into the day; the 24-hour clock,
# because eZLocale can only print the English am/pm. Currency: none (ISO 4217 XXX, the generic sign), since no
# real currency belongs to the language. No country names: the country datatype falls back to English.
# Reference: doc/languages.md
[RegionalSettings]
Country=None (private-use region QO)
LanguageName=tlhIngan Hol
InternationalLanguageName=Klingon

[Charset]
Preferred=utf-8

[HTTP]
# The plain language tag: tlh-QO is valid BCP 47 too, but browsers and search engines know QO only as
# Outlying Oceania, which would claim a place the language has nothing to do with.
ContentLanguage=tlh

[Currency]
# ISO 4217 XXX: no currency
Symbol=¤
Name=No currency
ShortName=XXX
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%c%p%q
NegativeFormat=%c%p%q

[Numbers]
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
TimeFormat=%H:%i:%s
ShortTimeFormat=%H:%i
DateFormat=%l, %d %F %Y
ShortDateFormat=%m/%d/%Y
DateTimeFormat=%l, %d %F %Y %H:%i:%s
ShortDateTimeFormat=%m/%d/%Y %H:%i
MondayFirst=no

# Klingon has no abbreviated month or day names: the short names are the long ones.
[ShortMonthNames]
jan=jar wa'
feb=jar cha'
mar=jar wej
apr=jar loS
may=jar vagh
jun=jar jav
jul=jar Soch
aug=jar chorgh
sep=jar Hut
oct=jar wa'maH
nov=jar wa'maH wa'
dec=jar wa'maH cha'

[LongMonthNames]
jan=jar wa'
feb=jar cha'
mar=jar wej
apr=jar loS
may=jar vagh
jun=jar jav
jul=jar Soch
aug=jar chorgh
sep=jar Hut
oct=jar wa'maH
nov=jar wa'maH wa'
dec=jar wa'maH cha'

[ShortDayNames]
mon=DaSjaj
tue=povjaj
wed=ghItlhjaj
thu=loghjaj
fri=buqjaj
sat=ghInjaj
sun=lojmItjaj

[LongDayNames]
mon=DaSjaj
tue=povjaj
wed=ghItlhjaj
thu=loghjaj
fri=buqjaj
sat=ghInjaj
sun=lojmItjaj
