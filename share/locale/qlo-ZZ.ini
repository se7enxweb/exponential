#?ini charset="utf-8"?
# Lorem Ipsum: a test language, written by hand for Exponential 6.0.15. Not a real language.
# It exists to try out content translations (a second or third language, fallbacks, the editor's language
# choice) without touching a real one. It is shipped but installed nowhere: no installation, package or seed
# adds it. Add it on Setup > Languages when you need it and remove it again afterwards.
# The code uses the ISO 639-2 range qaa-qtz, reserved for local use, so no real language can ever have it;
# ZZ is the ISO 3166 / CLDR code for an unknown region. Currency XXX is ISO 4217's "no currency".
# English formats; lorem-style month and day names, so a date in this language is recognizable at a glance.
# Fill an object with lorem ipsum text in it: php bin/php/exploremipsumfill.php (exp:loremipsum).
# Reference: doc/languages.md, guide: doc/guides/test-language-lorem-ipsum.md
[RegionalSettings]
Country=Unknown Region
LanguageName=Lorem Ipsum
InternationalLanguageName=Lorem Ipsum

[LanguageSettings]
# true: a language for testing only. The UI switch leaves it out of its ranked groups and its A-Z list, and
# exp:loremipsum only fills languages marked so.
TestLanguage=true

[Charset]
Preferred=utf-8

[HTTP]
ContentLanguage=qlo-ZZ

[Currency]
# ISO 4217 XXX: no currency
Symbol=¤
Name=No currency
ShortName=XXX
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-
PositiveFormat=%c%p%q
NegativeFormat=%p%c%q

[Numbers]
DecimalSymbol=.
ThousandsSeparator=,
FractDigits=2
PositiveSymbol=
NegativeSymbol=-

[DateTime]
TimeFormat=%H:%i:%s
ShortTimeFormat=%H:%i
DateFormat=%l %j %F %Y
ShortDateFormat=%Y-%m-%d
DateTimeFormat=%l %j %F %Y %H:%i:%s
ShortDateTimeFormat=%Y-%m-%d %H:%i
