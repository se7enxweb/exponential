#?ini charset="utf-8"?
# Exponential configuration file for the Bootstrap Icons set in the admin interface
#
# Bootstrap Icons 1.13.1 (https://icons.getbootstrap.com/), MIT license, see
# LICENSE in this directory. The SVG files in svg/ are unchanged copies.
#
# Made for the admin4 design: switch an admin siteaccess to it in its
# icon.ini.append.php (doc/features/6.0/admin4-design.md):
#
#   [IconSettings]
#   Theme=bootstrap-icons
#   AdditionalThemeList[]
#   AdditionalThemeList[]=crystal-admin
#
# class_icon, mimetype_icon, classgroup_icon and icon then look a key this
# file does not map up in crystal-admin before they use the Default below.
# The content tree's icon_info reads only the first theme it finds and gives
# Default at once, so a class belongs in ClassMap here, not only in
# crystal-admin. The admin4 stylesheets also draw these files, so keep a file
# here when you take it off a map.
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site.

[IconSettings]
# One SVG serves every size: the part before the semicolon is the width and
# height of the <img>, the part after it the subdirectory.
Sizes[]
Sizes[normal]=32x32;svg
Sizes[small]=16x16;svg
Sizes[ghost]=16x16;svg
Sizes[original]=16x16;svg

[MimeIcons]
# Default icon if there is no MIME type match
Default=file-earmark-binary.svg
MimeMap[]
MimeMap[text]=file-earmark-text.svg
MimeMap[image]=file-earmark-image.svg
MimeMap[video]=file-earmark-play.svg
MimeMap[audio]=file-earmark-music.svg
MimeMap[application/x-gzip]=file-earmark-zip.svg
MimeMap[application/x-bzip2]=file-earmark-zip.svg
MimeMap[application/x-tar]=file-earmark-zip.svg
MimeMap[application/zip]=file-earmark-zip.svg
MimeMap[application/x-rpm]=file-earmark-zip.svg
MimeMap[application/vnd.ms-powerpoint]=file-earmark-ppt.svg
MimeMap[application/msword]=file-earmark-word.svg
MimeMap[application/vnd.ms-excel]=file-earmark-excel.svg
MimeMap[application/pdf]=file-earmark-pdf.svg
MimeMap[application/postscript]=file-earmark-pdf.svg
MimeMap[text/html]=file-earmark-code.svg
MimeMap[video/quicktime]=file-earmark-play.svg
MimeMap[video/vnd.rn-realvideo]=file-earmark-play.svg
# Formats crystal-admin has no icon of its own for
MimeMap[application/vnd.openxmlformats-officedocument.presentationml.presentation]=file-earmark-ppt.svg
MimeMap[application/vnd.openxmlformats-officedocument.wordprocessingml.document]=file-earmark-word.svg
MimeMap[application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]=file-earmark-excel.svg
