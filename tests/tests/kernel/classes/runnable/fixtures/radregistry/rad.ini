#?ini charset="utf-8"?
# Fixture of RadSurveyDeclaredRegistriesTest: registries declared the way an extension declares them.

[RegistrySettings]
Registries[]
Registries[]=radfixture_actions
Registries[]=radfixture_listed
Registries[]=radfixture_code
Registries[]=radfixture_undeclared
Registries[]=radfixture_notitle

[Registry_radfixture_actions]
Title=Fixture actions
Ini=radfixture.ini
Section=Action_*
Entries[Class]=expIniAction
Entries[Mode]=one-of:fast,slow

[Registry_radfixture_listed]
Title=Fixture listed actions
Ini=radfixture.ini
Section=ActionSettings
Entries[Actions]=section:Action_
Entries[Listeners]=listener
InTotal=disabled

[Registry_radfixture_code]
Title=Fixture code list
List=expRADSurvey::RAD_FIXTURE_NO_SUCH_CONSTANT

[Registry_radfixture_notitle]
Ini=radfixture.ini
Section=ActionSettings
Entries[Actions]=name
