<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <style type="text/css"><![CDATA[
    .ring { fill: none; stroke: #0f766e; stroke-width: 6 }
    .dot { fill: #f59e0b }
  ]]></style>
  <defs>
    <radialGradient id="r" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#99f6e4"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="1" dy="2" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="star" viewBox="0 0 10 10"><polygon points="5,0 6.5,3.5 10,3.8 7.3,6.2 8.1,10 5,8 1.9,10 2.7,6.2 0,3.8 3.5,3.5"/></symbol>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#r)" filter="url(#s)"/>
  <circle class="ring" cx="50" cy="50" r="38"/>
  <use xlink:href="#star" x="35" y="30" width="30" height="30" class="dot"/>
  <ellipse cx="50" cy="78" rx="18" ry="5" style="fill:#0f766e;opacity:0.6"/>
</svg>
