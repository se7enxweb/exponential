; Configure xdebug for phpunit isolated-process code coverage.
; This file is only used when PHP_INI_SCAN_DIR is pointed at the tests directory.
; Note: do NOT add zend_extension=xdebug here.  When shivammathur/setup-php is
; used with coverage:xdebug the extension is already loaded from the system
; php.ini.  Repeating zend_extension causes Xdebug 3.5+ to emit a fatal
; "Cannot load Xdebug - it was already loaded" in every isolated-process child,
; which fails all RunTestsInSeparateProcesses test suites on PHP 8.4+.
xdebug.mode=coverage
