#?ini charset="utf-8"?
# Exponential configuration file for notification.
#
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/notification.ini.append or
#       settings/override/notification.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).

[NotificationSettings]
# enabled shows "Publish without notification" next to the publish button of
# content/edit and of the version preview: the version is published, but no
# notification event is made, so the subscribers of its location get no mail
# (the filter content/notification/create gets false). disabled hides the button
# and publishes every version with notification.
# The button is shown to, and counts for, users whose role has the policy
# function content/publish_without_notification (a content/* policy includes
# it). For anybody else, and with the setting disabled, a posted button
# publishes with notification. Only the ezpublish event of the version is left
# out: approval (collaboration) notifications are sent as before. Set it per
# siteaccess (the admin siteaccess only, for example) to offer it there only.
# doc/features/6.0/publish-without-notification.md
PublishWithoutNotification=disabled

# enabled makes notification events (the mails and digest items of the
# subscribers of a location) only for publications of the classes in
# IncludeClasses[]; a publication of any other class counts as published
# without notification (the filter content/notification/create gets false).
# With an empty list nothing makes an event. disabled (default): every class.
# Approval (collaboration) notifications are not concerned.
# doc/features/6.0/publish-without-notification.md
NotificationFilterByClassIdentifier=disabled
IncludeClasses[]
#IncludeClasses[]=article
#IncludeClasses[]=file

[RuleSettings]
RepositoryDirectories[]=kernel/notification/rules
ExtensionDirectories[]
Alias[advanced]=ezadvanced
Alias[general]=ezgeneral
Alias[keyword]=ezkeyword
# Maximum number of notification digest elements removed in one query.
# This is needed to prevent exceeding DBMS limits 
# (maximum query length, maximum number of elements in IN() clause).
LimitDeleteElements=50
# How many hours a notification that the mail transport did not take is tried again, at every run, before it is given up
# and counted as dropped on the notification status page.
RetryHours=72

[NotificationEventTypeSettings]
RepositoryDirectories[]=kernel/classes/notification/event/
ExtensionDirectories[]

AvailableNotificationEventTypes[]=ezpublish
AvailableNotificationEventTypes[]=eznewcontent
AvailableNotificationEventTypes[]=ezcurrenttime
AvailableNotificationEventTypes[]=ezcollaboration

[NotificationEventHandlerSettings]
RepositoryDirectories[]=kernel/classes/notification/handler/
ExtensionDirectories[]

AvailableNotificationEventTypes[]=ezgeneraldigest
AvailableNotificationEventTypes[]=ezcollaborationnotification
AvailableNotificationEventTypes[]=ezsubtree
#AvailableNotificationEventTypes[]=ezsimpledigest

[TransportSettings]
DefaultTransport=mail
# An array of pathes to the transport plugins
# TransportPluginPath[]=path/to/plugin1
# TransportPluginPath[]=path/to/plugin2
TransportPluginPath[]

[MailSettings]
# Which email address to use when sending notification mail
# If empty site.ini/MailSettings/AdminEmail is used.
EmailSender=
