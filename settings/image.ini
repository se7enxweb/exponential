#?ini charset="utf-8"?
# Exponential configuration file for image handling
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/image.ini.append or
#       settings/override/image.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).

[GDSettings]
# If set to true more advanced functionality will be available
# which is present in GD2. This requires GD2 to be compiled in
# the PHP module.
# This only decides whether the texttoimage layers are drawn as
# true colour or palette images. It does not affect the GD
# image converter ([GD] below), which keeps the colour type of
# the image it converts.
HasGD2=false

[FileSettings]
# Which subdirectory of var/cache to use for temporary image files.
TemporaryDir=imagetmp
# Wich subdirectory of var/storage to use for publish images
PublishedImages=images
# Wich subdirectory of var/storage to use for non-published (drafts, archived) images
VersionedImages=images-versioned
# Permission for new image directories, setting it to 0777 means that anyone
# can read and write the files and can be considered a security risk.
# It's preferred to use 0770 and make sure the web server has correct
# user/group access.
DirPermissions=0777
# Permission for new images and their variations. Empty: the same as every
# other stored file, site.ini [FileSettings] StorageFilePermissions. A value
# here applies to images only; 0666 means that anyone can read and write
# the files and can be considered a security risk.
ImagePermissions=

[OutputSettings]
# A list of MIME types that are allowed as output type
# This determines which formats you want your web page to display
AllowedOutputFormat[]
AllowedOutputFormat[]=image/jpeg
AllowedOutputFormat[]=image/png
AllowedOutputFormat[]=image/webp
AllowedOutputFormat[]=image/gif


#
# -------- Image alias settings --------
#


[AliasSettings]
# Defines a list of aliases that are available to
# the template engine and other clients.
# The alias must be defined as a separate INI block.
AliasList[]
AliasList[]=reference
AliasList[]=small
AliasList[]=tiny
AliasList[]=medium
AliasList[]=large
AliasList[]=rss
# AliasList[]=rssitem
# AliasList[]=gray
# AliasList[]=zoom

# How image aliases are made.
#   on-demand  (the default) a template that shows an alias gets its URL, file name, MIME type, width
#              and height computed, without converting anything while the page renders. The alias is
#              made when the browser asks for it: by the view content/image, or by index_image.php for a
#              storage path the web server does not find (see .htaccess_root). Command line scripts
#              (cronjobs, mailers, exports) keep making aliases at once, as in render mode.
#   render     the original behavior: the template call converts the image while the page renders.
# The setting can be switched both ways at any time; no data is migrated. Aliases made in one mode are
# used by the other.
AliasGeneration=on-demand
# The URL a template gets for an alias that is not made yet (on-demand mode):
#   token      /content/image/<token>/<file name>; the signed token carries everything the view needs,
#              so a request needs no database until the alias is made
#   ids-token  /content/image/<attribute>/<version>/<language>/<alias>/<token>/<file name>
#   ids        /content/image/<attribute>/<version>/<language>/<alias>/<file name> (unsigned: serves an
#              alias that exists, never makes one)
#   node       /content/image/<node>/<attribute identifier>/<alias> (unsigned, as ids)
#   storage    the plain storage path, as render mode gives it; a miss reaches index_image.php, which
#              makes the alias when the path names a configured alias of a stored image
OnDemandURL=token
# How content/image answers with an alias that exists:
#   auto      a redirect (302) to the storage URL when the web server serves the storage (a single server
#             or shared file system), the file itself otherwise (a database cluster, drafts)
#   redirect  always the redirect
#   stream    always the file itself
Delivery=auto
# Seconds a request may spend making (or fetching) an alias, waiting for another process and for a
# conversion slot (MaxParallel) included. When it takes longer the request answers the placeholder,
# queues the alias for the job queue (when expqueue is there), and the browser asks again later. No new
# conversion starts after MaxWait; one that has started is finished (stopping it would lose the work).
MaxWait=2
# Seconds a signed URL of a draft or preview image (images-versioned) stays valid; published images
# get URLs that do not expire.
DraftTokenLifetime=3600
# Seconds the previous signing key (image_alias_signing_previous in Setup > Secrets) is still accepted
# after the key was changed, so pages cached with the old URLs keep working.
SigningKeyGrace=604800
# The converter that writes the format variants (WebP, AVIF, see Formats[] below):
#   auto         the imagick extension, then the ImageMagick command of [ImageMagick] (while IsEnabled=true),
#                then GD: the first of them that can write the format (Imagick::queryFormats(),
#                "convert -list format", gd_info())
#   imagick | imagemagick | gd   tried first, then the others in the auto order
# A format no converter can write is skipped: the browser gets the alias in its own format.
# The aliases of AliasList[] themselves are made by [ImageConverterSettings] ImageConverters[] in both
# modes, so an alias made on demand is byte for byte the one render mode makes.
PreferredConverter=auto
# content/image answers with a WebP or AVIF variant of an alias when the browser's Accept header names
# the type (image/webp, image/avif; image/* does not count) and the alias block lists the format, with
# Vary: Accept on every answer for that alias. In on-demand mode such an alias is linked through
# content/image also once it is made (OnDemandURL token or ids-token), so every visit is negotiated.
# disabled: aliases are always answered in their own format.
Negotiate=enabled
# A neutral image of the right size (an SVG that follows the dark mode of the browser, no text, no
# logo) while an image is missing, instead of a broken image. Applies to any missing image.
Placeholder=enabled
# The placeholders carry the marker (Server-Timing: exp-image-placeholder) that the small script
# design/standard/javascript/exp_image_swap.js looks for; it asks again and swaps in the real image.
SwapScript=enabled
# After publishing, every configured alias of the new images is made in the background, so the first
# visitor finds them ready: the union of AliasList[] of this siteaccess and its related siteaccesses
# (site.ini [SiteAccessSettings] RelatedSiteAccessList[]), each made as the siteaccess that lists it
# defines it, plus the WebP/AVIF variants of Formats[]. It is a job of the job queue (expqueue, job type
# image.alias.generate in settings/expqueue.ini); without the queue nothing is converted while
# publishing (the aliases are made on demand, imagealias.log says "no-queue"). On-demand mode only.
PreGenerate=enabled
# Limits pre-generation to these aliases, one per line (PreGenerateAliasList[]=small). Each is still made
# as the siteaccess that lists it in AliasList[] defines it. A name that no siteaccess of the union
# defines is skipped, with a warning and one imagealias.log line per publication (event=queue
# result=unknown-alias). Every other alias is made on demand, when a page first asks for it.
# Empty (the default): every alias of the union.
PreGenerateAliasList[]
# Whether pre-generation also makes the WebP/AVIF variants (Formats[] of the alias blocks) of the
# aliases it makes. disabled: only the aliases themselves; the variants are made on demand.
PreGenerateFormats=enabled
# Conversions (aliases and variants) at once per server, counted over every process: PHP-FPM, Velocity
# and the command line (queue workers, scripts). A slot is a lock file in
# <cache dir>/imagealias-slots/<server name>/. A request that finds every slot taken waits within
# MaxWait, then answers the placeholder and queues the alias at the visitors' priority (job type
# image.alias.generate), so a page full of new images never runs more than this many conversions. A
# conversion that has started is always finished. On-demand mode only.
MaxParallel=2
# How a request answers when every conversion slot is taken (a page with many new images):
#   enabled   it answers the placeholder at once, without waiting, and the alias goes to the backlog of
#             the server (<cache dir>/imagealias-backlog/<server name>/). Right after its answer, a request
#             that finds a free slot makes the backlog, oldest first, for at most BacklogTime seconds;
#             the swap script then shows the real images. A request that finds a slot free makes its alias
#             at once, as before. Needs a server that can answer first: PHP-FPM, LiteSpeed, FrankenPHP or
#             Velocity (the Apache module and the command line wait within MaxWait as with disabled).
#             What no request makes is made by the cronjob imagealiasbacklog.php (part frequent).
#   disabled  it waits for a slot within MaxWait, then answers the placeholder and queues a job
# On-demand mode only. Either way the aliases are the same files as render mode makes.
Backlog=enabled
# Seconds a request goes on making the backlog after its answer (1 to 600), then frees its slot.
BacklogTime=30
# Who makes the backlog after a request's answer:
#   process   a drainer process of its own (bin/php/expimagealiasdrain.php, started detached by the
#             request, at most MaxParallel per server, each for at most BacklogTime seconds), so the
#             web server's process is free for the next request at once. Velocity hands a worker its
#             next request as soon as it has answered: a worker that made the backlog itself kept that
#             request waiting. Needs proc_open() and the PHP command line; without them, as request.
#   request   the request's own process makes it after its answer.
BacklogDrainer=process
# A page that shows many images not made yet (a list of hundreds of new images): the first
# PagePlaceholderAfter of them are linked through content/image as always; the rest are linked to a
# static placeholder of their size (<cache dir>/public/imagealias-placeholder/<width>x<height>.svg,
# answered by the web server without PHP, once per size) and go to the backlog of the server while
# the page is made, in page order. The address of the real image is in the fragment of the
# placeholder's URL (#exp-src=...), where the swap script exp_image_swap.js finds it and shows each
# image once it is made. Without the swap script those images show the placeholder until the page
# is loaded again. The page is kept in the view cache for at most PagePlaceholderTime seconds.
# Needs the backlog (Backlog=enabled and a server that answers first); on-demand mode only.
# disabled: every image not made yet is linked through content/image.
PagePlaceholders=enabled
# Images not made yet a page links through content/image before the rest get the placeholder (0 to 10000).
PagePlaceholderAfter=24
# Seconds a page that links such placeholders may be kept in the view cache (10 to 3600).
PagePlaceholderTime=60
# The nice value (0..19) a bulk run (job type image.alias.bulk: generate, regenerate or purge over a
# scope) lowers its worker process to, so it gives way to the web server; an ImageMagick command it
# starts inherits it. 0 leaves the priority as it is. Bulk runs can be paused and resumed in
# Setup > Image aliases or on the command line; a paused run goes on where it stopped.
BulkNice=10
# Cache-Control max-age (seconds) of a real alias answered by content/image or index_image.php;
# placeholders are always sent with no-store.
CacheMaxAge=31536000
# Bytes var/log/imagealias.log may reach before it is rotated (kept: site.ini [FileSettings] LogFileRotateCount).
# Its own size, not site.ini LogFileMaxSize for all logs: a bulk run writes a line per alias, and at 2 MB the run
# history of Setup > Image aliases covered only minutes. 1 MB to 1 GB; default 20 MB.
LogFileMaxSize=20971520
# An alias block may list extra formats for the browsers that accept them (see Negotiate):
# Formats[]=webp
# Formats[]=avif
# The order is the preference when a browser accepts both equally. A variant is made on demand from the
# alias file and stored next to it as "<alias file>.<format>" (foo_large.jpg.webp); neither the
# attribute's XML nor ezimagefile name it, so they stay exactly as render mode writes them. It is made
# again when the alias is newer, and removed with its alias. Its storage path also works on its own
# (index_image.php makes it), for web servers that negotiate themselves. Quality: the alias block's
# Quality[]=image/webp;80, else [MIMETypeSettings] Quality[]=image/webp;80, else 80 (WebP) and 60 (AVIF).
# GIF and SVG aliases get no variants.

[AliasStaging]
# Staging: a site that is not the production site fetches the images it is missing (originals and
# aliases) from another installation, so a development or staging site needs no copy of var/storage.
# A missing alias is fetched from the source first; when the source does not have it either, its
# original is fetched and the alias is made here. A missing original asked for by its storage path is
# fetched. All within [AliasSettings] MaxWait; after that the placeholder is answered and the browser asks
# again. Only published images (not drafts) are staged. A resync (Setup > Image aliases, or the command
# line) fetches the files of many images at once: missing ones, or also those that differ.
#
# The environments (one per installation of the same site):
#   alpha  early test installation of new code, far from release
#   dev    a developer's installation
#   beta   a preview for testers and editors
#   stage  the pre-production copy: the last check before a release goes live
#   pro    production, the live site: the source of the others; it never fetches anything
#   post   post-production: a copy of production after a release, for checks and hotfixes
#   arc    an archive: a frozen copy of an earlier production
# Most sites only need a dev or stage installation that syncs from pro; syncing from pro (production) is
# the common start.
#
# This installation's environment; pro (the default) never fetches. An unknown value counts as pro.
Environment=pro
# The environment to fetch missing images from (for example pro); its [AliasSource_<environment>] block
# names where it is. Empty: no staging.
SyncFrom=
# Path map for a source whose storage paths differ from this site's: <local prefix>;<source prefix>, the
# source prefix a path below BaseURL or a whole URL. The longest matching local prefix wins; without a
# match a file is fetched from BaseURL plus its own storage path.
# PathMap[]=var/site/storage;var/production/storage
# PathMap[]=var/site/storage;https://media.example.org/var/production/storage
PathMap[]
# Seconds one download may take (never more than what is left of MaxWait on a page request).
Timeout=5
# The largest file fetched, in bytes; a larger one is not stored.
MaxFileSize=67108864
# After this many failures in a row (no answer, a timeout, a refused or invalid answer such as an HTML
# error page, a file the source has neither as alias nor as original) the source is paused (circuit
# breaker)...
FailuresBeforePause=5
# ...for this many seconds: missing images get the placeholder at once, nobody waits for the source.
# The pause, its reason and the last error are shown in Setup > Image aliases; one file that comes
# through again ends the count.
PauseSeconds=300
# When a source is paused, an e-mail goes to AlertRecipients[] (at most once an hour per source).
AlertEmail=enabled
# The addresses of that e-mail; none: site.ini [MailSettings] AdminEmail.
AlertRecipients[]

# One block per environment that can be a source (SyncFrom=pro reads [AliasSource_pro]); add
# [AliasSource_stage] and so on in the same way.
[AliasSource_pro]
# The base URL of that installation, for example https://www.example.org (http or https, no user name or
# password in it, no query).
BaseURL=
# The name of a secret (Setup > Secrets, or env:<VARIABLE>) holding "user:password" (basic
# authentication) or "Bearer <token>"; never the value itself, which is never written to a setting, the
# log or a message. Empty: no authentication.
Credential=

# Example of an image alias, the group is called the same as the alias name
# [myalias]
#
# Tells the system to use the original alias as reference image. The reference
# image is the base of conversion and filtering. original is the default and
# can be omitted
# Reference=reference
#
# The MIME type of the output image. Can be specified if you want a specific
# format for the alias, if not skip it and let the image system decide.
# A useful application for this is screenshots, normally you don't want
# to use image/jpeg for screenshot but rather image/png or image/gif.
# MIMEType=image/png
#
# Override quality by MIME type for this alias only
# This follows the pattern from the global [MIMETypeSettings] settings 
# Quality[]
# Quality[]=image/jpeg;80
#
# A list of filters to run, each filter must be supported by the active image converters
# Filters[]=geometry/scale=300;300

# reference, small, medium and large for backwards compatability
# You can for instance remove the reference if don't want the extra disk usage

# By defining the 'original' alias and setting some filters
# or changing the MIME type you can even force a conversion of
# the originally uploaded image.
# This is useful to save space or make sure the image is in a specific format
# [original]
# Filters[]
# Filters[]=colorspace/gray

# [original]
# Filters[]
# Filters[]=filter/swirl=210
# # MIMEType=image/png

[reference]
Filters[]
Filters[]=geometry/scaledownonly=600;600

[small]
Reference=reference
Filters[]=geometry/scaledownonly=100;100

[tiny]
Reference=reference
Filters[]=geometry/scaledownonly=30;30

[medium]
Reference=reference
Filters[]=geometry/scaledownonly=200;200

[large]
Reference=reference
Filters[]=geometry/scaledownonly=300;300

[rss]
Reference=reference
Filters[]=geometry/scale=88;31
# According to the RSS 1.0 / RSS 2.0 specification:
# maximum value for width is 144, default value is 88,
# maximum value for height is 400, default value is 31.


# Optional image alias used in rss feed items if you specify image
# attribute as source for description tag, 'rss' is used instead if disabled
# 
# [rssitem]
# Reference=reference
# Filters[]=geometry/scaledownonly=128;128

# An example alias which converts the image to grayscale
#
# [gray]
# Reference=large
# Filters[]
# Filters[]=colorspace/gray

# An example alias which crops the image to specific size
# and adds a border.
#
# [zoom]
# Reference=reference
# Filters[]
# Filters[]=geometry/crop=200;200;155;155
# Filters[]=border/color=0;0;0
# Filters[]=border=4;4


#
# -------- Image MIME type settings --------
#


[MIMETypeSettings]
# A list of settings which override certain MIME types
# The overrides can define allowed and disallowed filters
# as well as extra filters.l
OverrideList[]=AnimatedGIF
OverrideList[]=LayeredPhotoshop

# A list of mimetypes and their image quality value
# The value varies from mime type to mime type.
Quality[]
# Set JPEG quality from 0 (worst quality, smallest file) to 100 (best quality, biggest file)
Quality[]=image/jpeg;75

# The global conversion rules
# Most will be converted to jpeg except gif and xpms
ConversionRules[]
ConversionRules[]=image/webp;image/png
ConversionRules[]=image/gif;image/png
ConversionRules[]=image/x-xpixmap;image/png
ConversionRules[]=*;image/jpeg
# Fallback if jpeg is disabled as output.
# ConversionRules[]=image/jpeg;image/png


# Override for animated GIFs, this is needed to properly
# handle image/gif files with multiple image frames.
# It will turn off any geometry filters to leave the images untouched.
[AnimatedGIF]
# The MIME type which this override works on
MIMEType=image/gif
# A list of matches that needs to be satisified for this override to be used
Match[is_animated]=1
# Alternative MIME type for the image, currently unused.
OverrideMIMEType=animation/gif
# A list of filters which are not allowed to be run on this image,
# wildcards can also be used.
DisallowedFilters[]=*
# A list of filters which are allowed to be run on this image,
# wildcards can also be used. If this is supplied only filters that
# are in this list will be allowed
# Note that resizing of animated gifs is not supported using GD2, at least not until PHP 5.3.
# See: http://www.libgd.org/FAQ_PHP
# AllowedFilters[]

# A list of extra filters to add for this image.
ExtraFilters[]

[LayeredPhotoshop]
MIMEType=application/x-photoshop
ExtraFilters[]
ExtraFilters[]=flatten
ExtraFilters[]=resize=200x

#
# -------- Image converter settings --------
#

[ShellSettings]
ConvertPath=

[ImageConverterSettings]
# List of converters to use, each entry is the name of the converter
# which is defined in a ini block.
# You can use ImageMagick and GD handlers by default.
# The order of the convertes are important since the first
# applicable converter will be used. The last handler is
# usually a fallback converter which can take care of most formats.
#
# GD comes first: it is the image extension built into PHP, so it
# converts in process, without starting an external program for
# every image, and needs nothing installed beside PHP. It reads and
# writes JPEG, PNG, GIF and WBMP and supports every geometry filter
# the default aliases use.
# ImageMagick stays in the list as the fallback. It is used for the
# formats GD cannot read (for example PSD, TIFF, PDF or WebP) and for
# the filters only it supports (for example flatten, resize,
# filter/swirl or filter/noise), and it takes over completely when the
# GD extension is missing or [GD] IsEnabled=false.
# To prefer ImageMagick again, override the list in
# settings/override/image.ini.append.php:
#   ImageConverters[]
#   ImageConverters[]=ImageMagick
#   ImageConverters[]=GD
# The list can also contain converters which cannot work
# on the installed server, the converter should check this
# and tell the image system to not use it.
#
# For any other converter make sure you have a INI section
# with the same name as your converter's
#
# For example : 
# ImageConverters[]=MyCustomConverter
# [MyCustomConverter]
# with the same INI variables as GD or ImageMagick INI sections

ImageConverters[]
ImageConverters[]=GD
ImageConverters[]=ImageMagick

# Seconds a process waits for the lock of one alias file while another process makes
# that alias (one lock per alias file: the aliases of one image are made in parallel).
# When the other process is done in time, its file is used as it is; when the wait
# runs out, no alias is made by this request (a page in render mode shows no image
# for it this time, content/image answers the placeholder). On a single server the
# lock is a file lock (var/<site>/cache/imagealias-locks), on a database cluster
# (eZDFS) the .generating entry of the alias file. 0 waits not at all.
LockTimeout=60

[GD]
Name=GD
IsEnabled=true
# Which PHP handler to use for the conversion,
# ezimagegd means to use the ImageGD extension in PHP
Handler=eZImageGDFactory

# The following filters are supported by GD
# geometry/scale
# geometry/scalewidth
# geometry/scaleheight
# geometry/scaledownonly
# geometry/scalewidthdownonly
# geometry/scaleheightdownonly
# geometry/scaleexact
# geometry/scalepercent
# geometry/crop
# colorspace/gray
# luminance/gray
# luminance/sepia
# color/monochrome
# border
# border/color
# border/width

[ImageMagick]
Name=ImageMagick
# If set to true then this handler will be used,
# The setup wizard will turn this off it ImageMagick is not found on the system
IsEnabled=true
# Which PHP handler to use for the conversion,
# ezimageshell means to use the generic shell handler which
# creates a command line and executes it with system().
Handler=eZImageShellFactory
# The path to the executable, can be empty for global path.
ExecutablePath=
# Name of the executable
Executable=convert
# Name of the executable for windows,
# uncomment ExecutableMac for Mac specific converter and
# ExecutableUnix for Unix/Linux specific converter
#ExecutableWin32=convertim
# ExecutableMac=convert
# ExecutableUnix=convert
# Parameters that must be run before the filenames and filters.
PreParameters=
# Parameters that must be run after the filenames and filters.
PostParameters=
# Whether the destination name should be prefixed with a TAG name (see MIMETagMap below)
# The variable contains the separator between the TAG and the filename.
# This is needed for ImageMagick to provide proper conversions of some formats.
UseTypeTag=:

# MIME types that the converter can get as input
InputMIMEList[]
InputMIMEList[]=*

# MIME types that the converter can generate
OutputMIMEList[]
OutputMIMEList[]=*

# A list of mime types and their quality parameters
QualityParameters[]
QualityParameters[]=image/jpeg;-quality %1

# This setting will provide the possibility to postpend options to the source file  filename.
# This behavior is needed to address a specific layer in PSD files.
# This array needs a semicolon seperated value which will build like this:
# <mimetype>;<option>
FrameRangeParameters[]

# Set frame range to handle PSD files with ImageMagick
FrameRangeParameters[]=application/x-photoshop;[0]

# A list of filter ImageMagick supports, add more if needed
# The same filter names are used in aliases and MIME type overrides with optional parameters.
Filters[]=geometry/scale=-geometry %1x%2
Filters[]=geometry/scalewidth=-geometry %1
Filters[]=geometry/scaleheight=-geometry x%1
Filters[]=geometry/scaledownonly=-geometry %1x%2>
Filters[]=geometry/scalewidthdownonly=-geometry %1>
Filters[]=geometry/scaleheightdownonly=-geometry x%1>
Filters[]=geometry/scaleexact=-geometry %1x%2!
Filters[]=geometry/scalepercent=-geometry %1x%2%
# +repage: the cut image starts at 0,0, so a filter after it (another crop, a scale) works on what was cut
Filters[]=geometry/crop=-crop %1x%2+%3+%4 +repage
Filters[]=filter/noise=-noise %1
Filters[]=filter/swirl=-swirl %1
Filters[]=colorspace/gray=-colorspace GRAY
Filters[]=colorspace/transparent=-colorspace Transparent
Filters[]=colorspace=-colorspace %1
Filters[]=border=-border %1x%2
Filters[]=border/color=-bordercolor rgb(%1,%2,%3)
Filters[]=border/width=-borderwidth %1
Filters[]=flatten=-flatten
Filters[]=resize=-resize %1

# Maps a MIME type to a tag name which is prepended to the destination name for ImageMagick
MIMETagMap[]=image/x-xpixmap;XPM
MIMETagMap[]=image/png;PNG
MIMETagMap[]=image/webp;WEBP
MIMETagMap[]=image/jpeg;JPEG
MIMETagMap[]=image/bmp;BMP
MIMETagMap[]=image/gif;GIF
MIMETagMap[]=image/x-portable-bitmap;PBM
MIMETagMap[]=image/tiff;TIFF
MIMETagMap[]=image/pcx;PCX
MIMETagMap[]=image/x-pict;PICT
MIMETagMap[]=image/svg+xml;SVG
MIMETagMap[]=image/tga;TGA
MIMETagMap[]=image/vnd.wap.wbmp;WBMP
MIMETagMap[]=image/x-xbitmap;XBM
MIMETagMap[]=image/x-xcf-gimp;XCF
MIMETagMap[]=application/x-photoshop;PSD
MIMETagMap[]=application/pdf;PDF
MIMETagMap[]=application/postscript;PS
MIMETagMap[]=text/plain;TEXT


#
# -------- Image analysis settings --------
#


[AnalyzerSettings]
# Where to look for analyzers
RepositoryList[]=lib/ezimage/classes
# A list of extensions which have analyzers, it will look in the imageanalyzer subdir.
ExtensionList[]
# A list of active analyzers
ImageAnalyzers[]=GIF
ImageAnalyzers[]=EXIF
# A list of aliases for analyzer, can be used to redirect certain
# analyzers to your own.
ImageAnalyzerAlias[]

# A list of formats that need extra analysis
AnalyzerMIMEList[]
# GIF images must be analyzed to check for
# animated GIFs, animated GIFs are hard to convert
# to other formats.
AnalyzerMIMEList[]=image/gif

# GIF analyzer, figures out details about GIF images
# Is primarily used to determine GIF animation.
[GIFAnalyzer]
Handler=ezgif
MIMEList[]=image/gif

# Analyzer for EXIF data, currently supports JPEG and TIFF
[EXIFAnalyzer]
Handler=ezexif
MIMEList[]=image/jpeg
MIMEList[]=image/tiff

# Which uploaded files are accepted as images: the image datatype (edit form,
# upload module, rich text editor upload, AJAX uploader, WebDAV, imports) and
# the package thumbnails. The type is read from the file's content with PHP's
# fileinfo extension, not from its name, and must be on AllowedMIMETypes[].
# A refused file is not stored. Without fileinfo the type comes from
# getimagesize() (or the file name) and one warning is logged per process.
[ImageUploadSettings]
# enabled (default) or disabled. disabled only checks that the file is an
# image by getimagesize() or its name, as before the allow-list.
ValidateMIMEType=enabled
# The accepted types. SVG (image/svg+xml, .svg and .svgz) is accepted
# because it is sanitized on upload (SanitizeSVG below): only the SVG
# elements and attributes known to be safe are stored, without script, event
# attributes, foreignObject or external references. Every alias of an SVG is
# the sanitized file itself; it is never scaled. Serve the files with the
# headers in doc/eng-us/bc/6.0/svg-images.md. Remove the line to refuse SVG.
AllowedMIMETypes[]
AllowedMIMETypes[]=image/jpeg
AllowedMIMETypes[]=image/png
AllowedMIMETypes[]=image/gif
AllowedMIMETypes[]=image/webp
AllowedMIMETypes[]=image/avif
AllowedMIMETypes[]=image/tiff
AllowedMIMETypes[]=image/bmp
AllowedMIMETypes[]=image/svg+xml
# enabled (default) or disabled. enabled: an SVG image is stored as the
# output of the SVG sanitizer (expSvgSanitizer); a file it cannot read, or in
# which nothing safe remains, is refused. disabled: SVG is refused, whatever
# AllowedMIMETypes[] says, so an SVG is never stored unsanitized.
SanitizeSVG=enabled
