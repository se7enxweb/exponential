#?ini charset="utf-8"?
# The help system of the administration: exphelp/dashboard, exphelp/viewer, exphelp/search, exphelp/asset and
# exphelp/report (doc/features/6.0/help-system.md). It shows the git-tracked text and Markdown files under doc/,
# rendered safely, searchable and filtered by audience. Policy exphelp/read; Anonymous does not have it.
#
# Extensions add their own settings in extension/<ext>/settings/exphelp.ini.append.php: context help entries
# ([ContextHelp]), featured pages, and (opt-in, below) their own doc directory.

[HelpSettings]
# enabled|true: the module answers; false: every exphelp view is a 404 and the Help buttons are not shown
Enabled=true
# The directory below the cache directory (var/<site>/cache/<CacheDir>) for the index and the search index
CacheDir=exphelp
# The "Edit on GitHub" link of a page: this URL followed by the page's repository path (doc/...); empty: no link
EditBaseURL=https://github.com/se7enxweb/exponential/blob/main/

[IndexSettings]
# The directories (relative to the installation root) whose git-tracked files the help shows. Nothing outside them
# is ever read or served.
Roots[]
Roots[]=doc
# Opt-in: extensions whose doc directory is shown too, as <extension name> (reads extension/<name>/doc, the files
# tracked by the extension's own repository). Empty: none. Their pages have the id ext/<name>/<path below doc>.
ExtensionDocDirs[]
# Where the list of git-tracked files comes from, first one that answers: the .git index (read in PHP, no program
# is started), `git ls-files`, and share/filelist.md5 for an installation without .git
AllowlistSources[]
AllowlistSources[]=gitindex
AllowlistSources[]=gitcommand
AllowlistSources[]=manifest
# The suffixes of pages
DocumentSuffixes[]
DocumentSuffixes[]=md
DocumentSuffixes[]=markdown
DocumentSuffixes[]=txt
DocumentSuffixes[]=rst
# enabled: files without a suffix (the old changelogs) are pages too, as plain text
PlainTextWithoutSuffix=enabled
# The suffixes of images the asset view serves
AssetSuffixes[]
AssetSuffixes[]=png
AssetSuffixes[]=jpg
AssetSuffixes[]=jpeg
AssetSuffixes[]=gif
AssetSuffixes[]=webp
# Never served, even when tracked (shell patterns on the path relative to the installation root; a pattern without
# "/" also matches the file name): generated documentation, HTML, SVG (it can carry scripts) and PHP
ExcludePatterns[]
ExcludePatterns[]=doc/doxygen/*
ExcludePatterns[]=*.html
ExcludePatterns[]=*.htm
ExcludePatterns[]=*.svg
ExcludePatterns[]=*.php
# Bytes; larger files are left out
MaxFileSize=2097152
# enabled: every request compares the size and time of each listed file with the cached index, so an edited page
# shows at once. disabled: only the git index, the manifest and the settings are compared (faster on big doc trees;
# run "./console exp:help index" after changing a page without a commit)
StatFiles=enabled
# enabled: when git can be run, the index reads the history of the roots once per build, for each page's
# "last changed" date and the dashboard's recent changes. disabled: the file times are used, no recent changes
GitHistory=enabled

