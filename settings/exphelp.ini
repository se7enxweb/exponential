TypeNames[reference]=Reference

[SearchSettings]
# Results per page (the JSON view takes limit=, at most 50)
ResultLimit=20
# Score weights of a match in the title, a heading and the text
TitleBoost=8
HeadingBoost=3
BodyBoost=1
# ... in the page's path (features/6.0/maintenance-mode.md: "maintenance", "mode") and its front matter keywords
PathBoost=2
KeywordBoost=4
# Factor for a page whose title holds every word of the query
TitleMatchBoost=1.4
# Factor per page type (expHelpDocumentIndex types); changelogs and history rank below guides with the same words
TypeBoost[]
TypeBoost[changelog]=0.45
TypeBoost[history]=0.6
# Words that are not indexed (an empty list keeps the built-in English and German list)
StopWords[]

[DashboardSettings]
# How many recent changes below the roots the dashboard lists
RecentLimit=8
# How many pages each audience card lists
AudiencePageLimit=4

[FeaturedSettings]
# Page ids (paths below doc/) shown first on the dashboard
PageList[]

[ContextHelp]
# Which page answers a module or view: Map[<module>/<view>]=<page id>[#<anchor>], or Map[<module>]=... for every
# view of a module. Without an entry the module's, then the dashboard. Extensions add theirs the same way.
Map[]

[IssueTrackers]
# Where errors are reported (exphelp/report). Each tracker has [Tracker_<key>] Name, Description, URL (the GitHub
# issue list, https://github.com/<owner>/<repository>/issues; anything else is ignored) and NewIssueURL.
TrackerList[]
TrackerList[]=software
TrackerList[]=velocity
TrackerList[]=community
# An active extension whose website (extension.xml, ezinfo.php, composer.json or its git origin) is a GitHub
# repository of one of these owners is offered as a tracker of its own on the report page
ExtensionOwners[]
ExtensionOwners[]=se7enxweb
# Extensions shipped inside the kernel's repository: their errors go to the software tracker
BundledExtensions[]
BundledExtensions[]=expservices
BundledExtensions[]=ezformtoken
BundledExtensions[]=ezjscore
BundledExtensions[]=ezoe
# The most active extensions named in the environment summary (the rest is counted)
ExtensionListLimit=60
# Where to ask before reporting, <label>|<https URL>
CommunityLinks[]
CommunityLinks[]=Exponential community forums|https://share.exponential.earth/forums
CommunityLinks[]=Telegram community chat|https://t.me/exponentialcms
CommunityLinks[]=Exponential documentation|https://exponential.doc.exponential.earth/Exponential

[Tracker_software]
Name=Exponential (the software)
Description=Errors in the kernel, the administration, the bundled extensions and the documentation
URL=https://github.com/se7enxweb/exponential/issues
NewIssueURL=https://github.com/se7enxweb/exponential/issues/new

[Tracker_velocity]
Name=Exponential Velocity (the application server)
Description=Errors of the Velocity server itself: starting, workers, its response cache, HTTPS, the exp:velocity command
URL=https://github.com/se7enxweb/exponential-velocity/issues
NewIssueURL=https://github.com/se7enxweb/exponential-velocity/issues/new

[Tracker_community]
Name=Exponential project and community
Description=The project, the website, the ecosystem and anything that is not an error in a piece of software
URL=https://github.com/se7enxweb/exponential-community/issues
NewIssueURL=https://github.com/se7enxweb/exponential-community/issues/new

[SecuritySettings]
# Security issues are never reported in a public tracker (SECURITY.md)
Email=security@se7enx.com
PolicyURL=https://github.com/se7enxweb/exponential/blob/main/SECURITY.md
# GitHub's private vulnerability reporting form (only the maintainers see the report)
AdvisoryURL=https://github.com/se7enxweb/exponential/security/advisories/new
