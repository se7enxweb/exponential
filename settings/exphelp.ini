[IssueTrackers]
# Where errors are reported (exphelp/report). Each tracker has [Tracker_<key>] Name, Description, URL (the GitHub
# issue list, https://github.com/<owner>/<repository>/issues; anything else is ignored) and NewIssueURL.
TrackerList[]
TrackerList[]=software
TrackerList[]=velocity
TrackerList[]=community
# An active extension whose website (extension.xml, ezinfo.php, composer.json or its git origin) is a GitHub
# repository of one of these owners is offered as a tracker of its own on the report page
ExtensionOwners[]
ExtensionOwners[]=se7enxweb
# Extensions shipped inside the kernel's repository: their errors go to the software tracker
BundledExtensions[]
BundledExtensions[]=expservices
BundledExtensions[]=ezformtoken
BundledExtensions[]=ezjscore
BundledExtensions[]=ezoe
# The most active extensions named in the environment summary (the rest is counted)
ExtensionListLimit=60
# Where to ask before reporting, <label>|<https URL>
CommunityLinks[]
CommunityLinks[]=Exponential community forums|https://share.exponential.earth/forums
CommunityLinks[]=Telegram community chat|https://t.me/exponentialcms
CommunityLinks[]=Exponential documentation|https://exponential.doc.exponential.earth/Exponential

[Tracker_software]
Name=Exponential (the software)
Description=Errors in the kernel, the administration, the bundled extensions and the documentation
URL=https://github.com/se7enxweb/exponential/issues
NewIssueURL=https://github.com/se7enxweb/exponential/issues/new

[Tracker_velocity]
Name=Exponential Velocity (the application server)
Description=Errors of the Velocity server itself: starting, workers, its response cache, HTTPS, the exp:velocity command
URL=https://github.com/se7enxweb/exponential-velocity/issues
NewIssueURL=https://github.com/se7enxweb/exponential-velocity/issues/new

[Tracker_community]
Name=Exponential project and community
Description=The project, the website, the ecosystem and anything that is not an error in a piece of software
URL=https://github.com/se7enxweb/exponential-community/issues
NewIssueURL=https://github.com/se7enxweb/exponential-community/issues/new

[SecuritySettings]
# Security issues are never reported in a public tracker (SECURITY.md)
Email=security@se7enx.com
PolicyURL=https://github.com/se7enxweb/exponential/blob/main/SECURITY.md
# GitHub's private vulnerability reporting form (only the maintainers see the report)
AdvisoryURL=https://github.com/se7enxweb/exponential/security/advisories/new

[License]
# The license of the documentation the help shows (doc/en/us/README-LICENSE.md, doc/en/us/help/free-documentation.md).
# Every help page, the dashboard, the print view and the PDF carry its notice; the name stays untranslated.
Enabled=true
Name=GNU Free Documentation License
ShortName=GFDL
Version=1.3
VersionDate=3 November 2008
# "or any later version published by the Free Software Foundation"
OrLater=true
URL=https://www.gnu.org/licenses/fdl-1.3.html
TextURL=https://www.gnu.org/licenses/fdl-1.3.txt
# Help page ids (paths below doc/en/us/): the unmodified license text, the copyright and permission notice,
# and the plain explanation for readers
TextPage=LICENSE-GFDL-1.3.txt
NoticePage=README-LICENSE.md
ExplainerPage=help/free-documentation.md
CopyrightYears=1998 - 2026
CopyrightHolder=7x & Exponential Foundation and the Exponential contributors
# Pages the project does not hold the copyright of and does not relicense: the documentation inherited
# from the original software (eZ Systems AS, 1999 - 2014). They keep the terms of the repository's
# LICENSE and show the notice below instead. <pattern> on the doc/ path, "*" also matches "/".
OtherLicensePathRules[]
OtherLicensePathRules[]=doc/en/us/features/[2-5].*
OtherLicensePathRules[]=doc/en/us/bc/[2-5].*
OtherLicensePathRules[]=doc/en/us/specifications/[2-5].*
OtherLicensePathRules[]=doc/en/us/specifications/trunk/*
OtherLicensePathRules[]=doc/changelogs/[2-5].*
OtherLicensePathRules[]=doc/changelogs/README.md
OtherLicensePathRules[]=doc/en/us/shop/*
OtherLicensePathRules[]=doc/en/us/release-overview
OtherLicensePathRules[]=doc/en/us/standards/header.txt
OtherCopyright=Copyright (C) 1999 - 2014 eZ Systems AS and contributors
OtherLicenseName=GNU General Public License, version 2
OtherLicenseURL=https://www.gnu.org/licenses/old-licenses/gpl-2.0.html

# "Download as PDF" of a help page (exphelp/pdf/<page id>, ./console exp:help pdf <page id>), drawn by the kernel's
# own PDF library (lib/ezpdf); nothing outside the installation is called. Files are cached in <help cache>/pdf.
[PdfSettings]
# false hides the button and makes exphelp/pdf a 404
Enabled=true
# A4 or Letter
PageSize=A4
# TrueType (.ttf) fonts: of each list the first file that exists is used (a relative path is taken from the install
# root). A TrueType font draws every character it has (embedded as a composite font, the text stays selectable).
# With no regular font found the PDF core fonts are used and text is transliterated to Windows-1252.
FontFiles[]
FontFiles[]=/usr/share/fonts/dejavu-sans-fonts/DejaVuSans.ttf
FontFiles[]=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
FontFiles[]=/usr/share/fonts/TTF/DejaVuSans.ttf
FontFiles[]=/usr/share/fonts/dejavu/DejaVuSans.ttf
BoldFontFiles[]
BoldFontFiles[]=/usr/share/fonts/dejavu-sans-fonts/DejaVuSans-Bold.ttf
BoldFontFiles[]=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
BoldFontFiles[]=/usr/share/fonts/TTF/DejaVuSans-Bold.ttf
BoldFontFiles[]=/usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
ItalicFontFiles[]
ItalicFontFiles[]=/usr/share/fonts/dejavu-sans-fonts/DejaVuSans-Oblique.ttf
ItalicFontFiles[]=/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf
ItalicFontFiles[]=/usr/share/fonts/TTF/DejaVuSans-Oblique.ttf
ItalicFontFiles[]=/usr/share/fonts/dejavu/DejaVuSans-Oblique.ttf
BoldItalicFontFiles[]
BoldItalicFontFiles[]=/usr/share/fonts/dejavu-sans-fonts/DejaVuSans-BoldOblique.ttf
BoldItalicFontFiles[]=/usr/share/fonts/truetype/dejavu/DejaVuSans-BoldOblique.ttf
BoldItalicFontFiles[]=/usr/share/fonts/TTF/DejaVuSans-BoldOblique.ttf
BoldItalicFontFiles[]=/usr/share/fonts/dejavu/DejaVuSans-BoldOblique.ttf
# Monospace for code; without one the core font Courier is used (and the regular font for what Courier lacks)
MonoFontFiles[]
MonoFontFiles[]=/usr/share/fonts/dejavu-sans-mono-fonts/DejaVuSansMono.ttf
MonoFontFiles[]=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
MonoFontFiles[]=/usr/share/fonts/TTF/DejaVuSansMono.ttf
MonoFontFiles[]=/usr/share/fonts/dejavu/DejaVuSansMono.ttf
# Characters the regular font lacks (Chinese, Japanese, Korean ...); loaded only when a page needs it
FallbackFontFiles[]
FallbackFontFiles[]=/usr/share/fonts/google-droid-sans-fonts/DroidSansFallbackFull.ttf
FallbackFontFiles[]=/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
FallbackFontFiles[]=/usr/share/fonts/google-noto-cjk/NotoSansCJK-Regular.ttc

[ContentSettings]
# Help maintained as content (doc/en/us/features/6.0/help-content.md): topics, manuals, figures and the glossary as content
# of the site, created by ./console exp:help:content. Nothing here matters until that command ran.
# disabled: exphelp/topic, exphelp/manual and exphelp/context are 404 and the help shows no topics
Enabled=enabled
# Where the folder "Help" (remote_id help-root) is created: media (default), content, users, or a remote_id. Not in
# the site's content tree: help must not show up in its menus, listings and feeds.
ParentNode=media
# The audience options of the help_* classes, in their stored order. ONLY APPEND: ezselection stores the position of
# an option, so a reordered list gives every topic another audience. The command appends missing ones.
Audiences[]
Audiences[]=Visitors
Audiences[]=Members
Audiences[]=Editors
Audiences[]=Administrators
# The audiences whose topics are public (section help_public, readable without login when Released)
PublicAudiences[]
PublicAudiences[]=Visitors
# The platform options (only append)
Platforms[]
Platforms[]=Web
Platforms[]=Admin
Platforms[]=Mobile
# The areas of help_ids (area.topic[.variant]); the validator warns about any other
Areas[]
Areas[]=account
Areas[]=content
Areas[]=media
Areas[]=search
Areas[]=users
Areas[]=setup
Areas[]=privacy
Areas[]=help
# The help's audience (editor, admin, developer, user) of each audience option, in lower case
AudienceMap[]
AudienceMap[visitors]=user
AudienceMap[members]=user
AudienceMap[editors]=editor
AudienceMap[administrators]=admin
# Context help by help_id: the "?" Help control of these pages opens the Released topic (keys as [ContextHelp] Map[])
ContextHelpIds[]
ContextHelpIds[content/edit]=content.publish-article
ContextHelpIds[content/history]=content.versions
# enabled: the roles step of exp:help:content also gives Anonymous exphelp/context, so the JSON of public, Released
# topics can be read without login. Off by default: a security-relevant choice of each site.
AnonymousContextHelp=disabled
# enabled: when an object of the help is set to Released, the e-books (EPUB, PDF) of every Released manual that
# contains it are built again and stored as file objects below E-books (remote_id help-ebooks), a new version when
# the book changed (expHelpContentEbooks::onStateAssign(), called when states are assigned).
# disabled: only ./console exp:help:content ebooks stores them.
EbooksOnRelease=enabled
