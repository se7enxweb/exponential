#?ini charset="utf-8"?
# The help system of the administration: exphelp/dashboard, exphelp/viewer, exphelp/search, exphelp/asset and
# exphelp/report (doc/eng-us/features/6.0/help-system.md). It shows the git-tracked text and Markdown files under doc/,
# rendered safely, searchable and filtered by audience. Policy exphelp/read; Anonymous does not have it.
#
# Extensions add their own settings in extension/<ext>/settings/exphelp.ini.append.php: context help entries
# ([ContextHelp]), featured pages, and (opt-in, below) their own doc directory.

[HelpSettings]
# enabled|true: the module answers; false: every exphelp view is a 404 and the Help buttons are not shown
Enabled=true
# The directory below the cache directory (var/<site>/cache/<CacheDir>) for the index and the search index
CacheDir=exphelp
# The "Edit on GitHub" link of a page: this URL followed by the page's repository path (doc/...); empty: no link
EditBaseURL=https://github.com/se7enxweb/exponential/blob/main/

[IndexSettings]
# The directories (relative to the installation root) whose git-tracked files the help shows. Nothing outside them
# is ever read or served.
Roots[]
Roots[]=doc
# enabled: the documentation of every active extension is shown too, found when the help looks (an extension
# switched on or off is added or left out at once): the files of extension/<name>/doc tracked by the extension's own
# repository (or listed in its share/filelist.md5), and its README, CHANGELOG, LICENSE ... (ExtensionTopFiles[]).
# Their pages have the id ext/<name>/<path below doc> (ext/<name>/README.md for a top file), in the folder and
# category "Extensions" and on exphelp/extensions. disabled: only the extensions of ExtensionDocDirs[].
ActiveExtensionDocs=enabled
# Extensions whose doc directory is shown whether active or not, as <extension name>. Empty: none.
ExtensionDocDirs[]
# The files at the top of an extension's directory that are shown besides its doc/ (shell patterns, without case);
# nothing else outside doc/ is ever read. PHP and other source files are never shown: only DocumentSuffixes[] (and
# text files without a suffix that do not start like a program, #! or <?) are pages.
ExtensionTopFiles[]
ExtensionTopFiles[]=README*
ExtensionTopFiles[]=CHANGELOG*
ExtensionTopFiles[]=LICENSE*
ExtensionTopFiles[]=INSTALL*
ExtensionTopFiles[]=USAGE*
ExtensionTopFiles[]=COPYING*
# Where the list of git-tracked files comes from, first one that answers: the .git index (read in PHP, no program
# is started), `git ls-files`, and share/filelist.md5 for an installation without .git
AllowlistSources[]
AllowlistSources[]=gitindex
AllowlistSources[]=gitcommand
AllowlistSources[]=manifest
# The suffixes of pages
DocumentSuffixes[]
DocumentSuffixes[]=md
DocumentSuffixes[]=markdown
DocumentSuffixes[]=txt
DocumentSuffixes[]=rst
# enabled: files without a suffix (the old changelogs) are pages too, as plain text
PlainTextWithoutSuffix=enabled
# The suffixes of images the asset view serves
AssetSuffixes[]
AssetSuffixes[]=png
AssetSuffixes[]=jpg
AssetSuffixes[]=jpeg
AssetSuffixes[]=gif
AssetSuffixes[]=webp
# Never served, even when tracked (shell patterns on the path relative to the installation root; a pattern without
# "/" also matches the file name): generated documentation, HTML, SVG (it can carry scripts) and PHP, and
# doc/README.md (the list of the language directories for readers of the repository; the help chooses the language)
ExcludePatterns[]
ExcludePatterns[]=doc/eng-us/doxygen/*
ExcludePatterns[]=doc/README.md
ExcludePatterns[]=*.html
ExcludePatterns[]=*.htm
ExcludePatterns[]=*.svg
ExcludePatterns[]=*.php
# Bytes; larger files are left out
MaxFileSize=2097152
# enabled: every request compares the size and time of each listed file with the cached index, so an edited page
# shows at once. disabled: only the git index, the manifest and the settings are compared (faster on big doc trees;
# run "./console exp:help index" after changing a page without a commit)
StatFiles=enabled
# With StatFiles enabled: seconds for which that comparison, once made, is reused by every request and process (it is
# kept in the help cache directory). Thousands of listed files make it the most expensive part of a help request,
# about 25 ms behind PHP-FPM (and under Velocity 0.0.4.56 and later, which stats the list in one go; 0.5 s before).
# An edited page then shows within this many seconds; a page
# added or removed changes the git index and shows at once, and "./console exp:help index" always looks again.
# 0: compare on every request
StatFilesInterval=5
# enabled: when git can be run, the index reads the history of the roots once per build, for each page's
# "last changed" date and the dashboard's recent changes. disabled: the file times are used, no recent changes
GitHistory=enabled

[ProjectFiles]
# The project files (expHelpProjectFiles; doc/eng-us/features/6.0/help-system.md, "Project files"): the Markdown files
# of the repository outside doc/ that document the project itself (README.md, INSTALL.md, SECURITY.md,
# CONTRIBUTING.md, CODE_OF_CONDUCT.md, COPYRIGHT.md, LICENSE.md, the README.md of bin/, design/ and kernel/
# directories). Each has the id project/<path in the repository> (/exphelp/viewer/project/README.md;
# /exphelp/viewer/README.md redirects there) and
# is a page at the top of the page tree, next to the folders, not in a folder of its own. They are English only and
# not translated, like doc/changelogs/: a reader of another language sees them with the note that the page is not
# translated.
# Not to be changed by any setting here or in an override: only files git tracks are shown (the git index, "git
# ls-files" or the release manifest, never the directory: a private note in the root that is not committed is never
# shown, searched or linked), never a file in a place .gitignore ignores, only Markdown, never a hidden file or a file
# in a hidden directory (.github/ included), and never below doc/, extension/ (the extensions' documentation is the
# category Extensions), a tests/ directory anywhere, var/, vendor/, settings/override/, settings/siteaccess/ or
# node_modules/.
# enabled: the help shows them; disabled: none
Enabled=enabled
# Shell patterns on the path in the repository: "*" stays inside a directory, "**" crosses directories
Include[]
Include[]=*.md
Include[]=bin/**/README.md
Include[]=design/*/README.md
Include[]=kernel/**/README.md
# Left out although Include[] matches: test fixtures and the copies of other projects (a JavaScript library's README)
Exclude[]
Exclude[]=**/fixtures/**
Exclude[]=**/_fixtures/**
Exclude[]=**/javascript/**
Exclude[]=**/third-party/**
Exclude[]=**/thirdparty/**
# Their category, page type and audiences ([CategorySettings], [TypeSettings], [AudienceSettings]); a file's own front
# matter wins. AudienceRules[]: "<pattern>;<audiences>", the first match wins, else Audiences[]
Category=project-files
Type=project
Audiences[]
Audiences[]=developer
Audiences[]=admin
AudienceRules[]
AudienceRules[]=README.md;admin,developer,editor,user,partner,hosting
AudienceRules[]=INSTALL.md;admin,developer,hosting
AudienceRules[]=SECURITY.md;admin,developer,hosting
AudienceRules[]=CONTRIBUTING.md;developer,supporter,advocate,partner
AudienceRules[]=CODE_OF_CONDUCT.md;developer,supporter,advocate,partner,trainer,user
AudienceRules[]=COPYRIGHT.md;admin,developer,partner,businesses
AudienceRules[]=LICENSE.md;admin,developer,partner,businesses
# The license of the project files: the notice under each of them names it and links its page (a page id)
LicenseName=GNU General Public License, version 2 (or any later version)
LicensePage=project/LICENSE.md

[DocLanguages]
# The languages of the documentation (expHelpLanguage; doc/eng-us/bc/6.0/translated-documentation.md). Each language
# has a directory below doc/ named by its Exponential locale code in lower case: doc/eng-us/ (eng-US) is the
# original, a translation lives in doc/<locale>/ (doc/ger-de/ for ger-DE) with the same relative paths, or with
# translated file names listed in doc/<locale>/.paths.json ("translated path": "path below doc/eng-us/"). A page id
# is its path below doc/eng-us/ in every language, so a help address shows the same page in each language. Files
# directly below doc/ in no language directory (doc/changelogs/) are not translated.
# The reader's language is the locale of the interface (site.ini [RegionalSettings] Locale, set by the
# administration's language switch), lower cased: ger-DE reads doc/ger-de/. A locale without a directory of its own
# uses an alias of Map[], else the first directory of its language (ger-AT -> ger-de), else Default; a page the
# reader's language does not have yet is shown in Default, with a note.
# The original language, and the language of a locale that has no directory
Default=eng-us
# The language directories the help reads (the default first); a directory that does not exist yet is fine
Directories[]
Directories[]=eng-us
Directories[]=ger-de
# Optional aliases, locale => directory, for a locale that should read another locale's directory
Map[]
Map[eng-GB]=eng-us
Map[ger-AT]=ger-de
Map[ger-CH]=ger-de
# Directory => the language's name in English (translated in kernel/exphelp for the "not translated yet" note)
Names[]
Names[eng-us]=English
Names[ger-de]=German
# The directories of 6.0.14 and before => today's: an old address (exphelp/viewer/en/us/<id>, exphelp/viewer/doc/en/us/<id>,
# exphelp/viewer/de/<translated path>, /(lang)/en-us) still finds its page. No file is read from an old directory.
Legacy[]
Legacy[en/us]=eng-us
Legacy[de]=ger-de

