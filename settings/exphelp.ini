#?ini charset="utf-8"?
# The help system of the administration: exphelp/dashboard, exphelp/viewer, exphelp/search, exphelp/asset and
# exphelp/report (doc/features/6.0/help-system.md). It shows the git-tracked text and Markdown files under doc/,
# rendered safely, searchable and filtered by audience. Policy exphelp/read; Anonymous does not have it.
#
# Extensions add their own settings in extension/<ext>/settings/exphelp.ini.append.php: context help entries
# ([ContextHelp]), featured pages, and (opt-in, below) their own doc directory.

[HelpSettings]
# enabled|true: the module answers; false: every exphelp view is a 404 and the Help buttons are not shown
Enabled=true
# The directory below the cache directory (var/<site>/cache/<CacheDir>) for the index and the search index
CacheDir=exphelp
# The "Edit on GitHub" link of a page: this URL followed by the page's repository path (doc/...); empty: no link
EditBaseURL=https://github.com/se7enxweb/exponential/blob/main/

[IndexSettings]
# The directories (repository-relative) whose git-tracked files the help shows. Nothing outside them is served.
Roots[]
Roots[]=doc
# Opt-in: extensions whose doc directory is shown too, as <extension name> (reads extension/<name>/doc).
# Empty: none. Their pages have the id ext/<name>/<path below doc>.
ExtensionDocDirs[]
# Where the list of git-tracked files comes from, in order: the .git index (read in PHP), `git ls-files`, and
# share/filelist.md5 for an installation without .git
AllowlistSources[]
AllowlistSources[]=gitindex
AllowlistSources[]=gitcommand
AllowlistSources[]=manifest
# The suffixes of pages
DocumentSuffixes[]
DocumentSuffixes[]=md
DocumentSuffixes[]=markdown
DocumentSuffixes[]=txt
DocumentSuffixes[]=rst
# enabled: files without a suffix (the old changelogs) are pages too, as plain text
PlainTextWithoutSuffix=enabled
# The suffixes of images the asset view serves
AssetSuffixes[]
AssetSuffixes[]=png
AssetSuffixes[]=jpg
AssetSuffixes[]=jpeg
AssetSuffixes[]=gif
AssetSuffixes[]=webp
# Never served, even when tracked (globs on the repository path); generated HTML and SVG (scripts) are left out
ExcludePatterns[]
ExcludePatterns[]=doc/doxygen/*
ExcludePatterns[]=*.html
ExcludePatterns[]=*.htm
ExcludePatterns[]=*.svg
# Bytes; larger files are left out
MaxFileSize=2097152

[AudienceSettings]
# editor: writes and publishes content; admin: runs the site; developer: builds on it; user: a site's visitor or member
Audiences[]
Audiences[]=editor
Audiences[]=admin
Audiences[]=developer
Audiences[]=user
# <glob>;<audience,audience>, first match wins; front matter (audience: editor) wins over these
PathRules[]
PathRules[]=doc/help/*;editor,admin,user
PathRules[]=doc/install/*;admin
PathRules[]=doc/INSTALL.md;admin
PathRules[]=doc/features/*;admin,developer
PathRules[]=doc/bc/*;developer
PathRules[]=doc/specifications/*;developer
PathRules[]=doc/standards/*;developer
PathRules[]=doc/changelogs/*;admin,developer
# <type> => <audience,audience>, when no rule matches
TypeDefaults[]

[CategorySettings]
Categories[]
Categories[]=getting-started
Categories[]=content
Categories[]=administration
Categories[]=development
Categories[]=install-upgrade
Categories[]=release-notes
Categories[]=history
Categories[]=reference
CategoryNames[]
CategoryNames[getting-started]=Getting started
CategoryNames[content]=Content and editing
CategoryNames[administration]=Administration
CategoryNames[development]=Development
CategoryNames[install-upgrade]=Installation and upgrades
CategoryNames[release-notes]=Release notes
CategoryNames[history]=History
CategoryNames[reference]=Reference
# Icon names; each must have an .a4-bi-<name> class in stylesheets/components.css
CategoryIcons[]
CategoryIcons[getting-started]=signpost-split
CategoryIcons[content]=pencil-square
CategoryIcons[administration]=gear
CategoryIcons[development]=code-square
CategoryIcons[install-upgrade]=box-seam
CategoryIcons[release-notes]=journal-text
CategoryIcons[history]=clock-history
CategoryIcons[reference]=journal-text
# <glob>;<category>, first match wins
PathRules[]
PathRules[]=doc/help/*;getting-started
PathRules[]=doc/install/*;install-upgrade
PathRules[]=doc/INSTALL.md;install-upgrade
PathRules[]=doc/features/*;administration
PathRules[]=doc/bc/*;development
PathRules[]=doc/specifications/*;development
PathRules[]=doc/standards/*;development
PathRules[]=doc/changelogs/*;release-notes
PathRules[]=doc/history/*;history
TypeDefaults[]

[TypeSettings]
# <glob>;<type>, first match wins
PathRules[]
PathRules[]=doc/help/*;help
PathRules[]=doc/features/*;feature
PathRules[]=doc/bc/*;bc
PathRules[]=doc/changelogs/*;changelog
PathRules[]=doc/guides/*;guide
PathRules[]=doc/install/*;install
PathRules[]=doc/INSTALL.md;install
PathRules[]=doc/specifications/*;specification
PathRules[]=doc/history/*;history
PathRules[]=doc/examples/*;example
PathRules[]=*;reference

[SearchSettings]
# Results per page (the JSON view takes limit=, at most 50)
ResultLimit=20
# Score weights of a match in the title, a heading and the text
TitleBoost=8
HeadingBoost=3
BodyBoost=1
# ... in the page's path (features/6.0/maintenance-mode.md: "maintenance", "mode") and its front matter keywords
PathBoost=2
KeywordBoost=4
# Factor for a page whose title holds every word of the query
TitleMatchBoost=1.4
# Factor per page type (expHelpDocumentIndex types): help pages and guides rank above reference material with the
# same words, changelogs and history below it
TypeBoost[]
TypeBoost[help]=1.5
TypeBoost[guide]=1.3
TypeBoost[specification]=0.8
TypeBoost[changelog]=0.45
TypeBoost[history]=0.6
# Factor per major version for pages below a version directory (features/3.8/, bc/4.1/): older releases rank lower
VersionBoost[]
VersionBoost[3]=0.5
VersionBoost[4]=0.6
VersionBoost[5]=0.75
# Words that are not indexed (an empty list keeps the built-in English and German list)
StopWords[]

[DashboardSettings]
# How many recent changes below the roots the dashboard lists
RecentLimit=8
# How many pages each audience card lists
AudiencePageLimit=4

[FeaturedSettings]
# Page ids (paths below doc/) shown first on the dashboard
PageList[]

[ContextHelp]
# Which page answers a module or view: Map[<module>/<view>]=<page id>[#<anchor>], or Map[<module>]=... for every
# view of a module. Without an entry the module's, then the dashboard. Extensions add theirs the same way.
Map[]

[IssueTrackers]
# Where errors are reported (exphelp/report). Each tracker has [Tracker_<key>] Name, Description, URL (the GitHub
# issue list, https://github.com/<owner>/<repository>/issues; anything else is ignored) and NewIssueURL.
TrackerList[]
TrackerList[]=software
TrackerList[]=velocity
TrackerList[]=community
# An active extension whose website (extension.xml, ezinfo.php, composer.json or its git origin) is a GitHub
# repository of one of these owners is offered as a tracker of its own on the report page
ExtensionOwners[]
ExtensionOwners[]=se7enxweb
# Extensions shipped inside the kernel's repository: their errors go to the software tracker
BundledExtensions[]
BundledExtensions[]=expservices
BundledExtensions[]=ezformtoken
BundledExtensions[]=ezjscore
BundledExtensions[]=ezoe
# The most active extensions named in the environment summary (the rest is counted)
ExtensionListLimit=60
# Where to ask before reporting, <label>|<https URL>
CommunityLinks[]
CommunityLinks[]=Exponential community forums|https://share.exponential.earth/forums
CommunityLinks[]=Telegram community chat|https://t.me/exponentialcms
CommunityLinks[]=Exponential documentation|https://exponential.doc.exponential.earth/Exponential

[Tracker_software]
Name=Exponential (the software)
Description=Errors in the kernel, the administration, the bundled extensions and the documentation
URL=https://github.com/se7enxweb/exponential/issues
NewIssueURL=https://github.com/se7enxweb/exponential/issues/new

[Tracker_velocity]
Name=Exponential Velocity (the application server)
Description=Errors of the Velocity server itself: starting, workers, its response cache, HTTPS, the exp:velocity command
URL=https://github.com/se7enxweb/exponential-velocity/issues
NewIssueURL=https://github.com/se7enxweb/exponential-velocity/issues/new

[Tracker_community]
Name=Exponential project and community
Description=The project, the website, the ecosystem and anything that is not an error in a piece of software
URL=https://github.com/se7enxweb/exponential-community/issues
NewIssueURL=https://github.com/se7enxweb/exponential-community/issues/new

[SecuritySettings]
# Security issues are never reported in a public tracker (SECURITY.md)
Email=security@se7enx.com
PolicyURL=https://github.com/se7enxweb/exponential/blob/main/SECURITY.md
# GitHub's private vulnerability reporting form (only the maintainers see the report)
AdvisoryURL=https://github.com/se7enxweb/exponential/security/advisories/new
