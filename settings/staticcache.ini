#?ini charset="utf-8"?
# Exponential configuration file.
#
# NOTE: It is not recommended to edit this file directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/staticcache.ini.append or
#       settings/override/staticcache.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).
[CacheSettings]
# The host to fetch pages from when generating the cache.
#
# Leave this empty. It is deprecated since 4.4 and empty is the correct
# value: each siteaccess is then fetched from its own
# site.ini.[SiteSettings].SiteURL, which is what a multi site installation
# needs. It shipped as "localhost" for years, which sent every fetch to
# whatever the web server answers for that name - usually the hosting
# panel's placeholder, never this site - and the run failed silently.
HostName=

# The protocol used to fetch pages, http or https.
#
# http is fine on a site that redirects to https, because the fetch follows
# redirects. Set https where plain http is refused outright rather than
# redirected.
SourceProtocol=http

# Where generated pages are written, relative to the var directory of the
# siteaccess unless the path is absolute or already begins with var/.
#
# The default therefore resolves to var/<site>/static, alongside
# var/<site>/cache and var/<site>/storage. Generated pages are cache and
# belong with the rest of it, not in the installation root.
StaticStorageDir=static

# Urls deeper than this many segments are never cached, and never refreshed
# when an editor publishes. The old default of 3 allowed two path segments,
# which excludes most of a real content tree.
MaxCacheDepth=12

# A list of url's to cache. You can use the * wildcard to include a whole
# subtree. A bare /* caches the entire site, subject to MaxCacheDepth.
CachedURLArray[]
CachedURLArray[]=/
CachedURLArray[]=/*

# A list of site accesses to generate static content for.
#
# Left empty, the siteaccesses this installation serves are used: every
# entry of site.ini.[SiteAccessSettings].RelatedSiteAccessList except those
# that require a login, whose pages are per user and must not be shared.
# Name siteaccesses here to override that.
CachedSiteAccesses[]

# A list of locations that will be updated whenever an object is published. You
# can NOT use a wildcard here.
AlwaysUpdateArray[]
AlwaysUpdateArray[]=/

# Defer cache generation to cronjob.
CronjobCacheClear=disabled

# Controls whenever <!-- Generated: YYY-MM-DD HH:MM:SS --> comment
# should be appended into the generated static cache file.
AppendGeneratedTime=true

[StaticPublishSettings]
# Static publishing: a front siteaccess built as a folder of static files
# that any static host serves (GitHub Pages, any web server), with its links
# rewritten and its files copied. Each target is a [Target_<id>] block below;
# ./console exp:static:targets lists them and exp:static:build builds one.
#
# Static publishing as a whole: enabled or disabled. Nothing is built while
# it is disabled.
Enabled=disabled

# The targets, by id: the ids of the [Target_<id>] blocks that are built.
# An id is 1 to 50 lower case letters, digits, _ and -.
TargetList[]

# Where the builds are kept, relative to the var directory of the site
# (var/<site>/static-publish) unless absolute. Each target has its own
# folder below it, never inside the site's own repository.
WorkDir=static-publish

# The most bytes a build may have before the build warns: the size the host
# allows a site (GitHub Pages: 1 GB). The build warns above 90 %.
MaxSiteBytes=1000000000

# The most bytes one file may have before the build warns: the size the host
# allows a file (GitHub: 100 MB).
MaxFileBytes=100000000

# Whether exp:static:publish and exp:static:rollback push to the target's
# Remote: enabled, or disabled to commit and tag in the target's folder only
# (exp:static:push pushes later). A push is never forced.
Push=enabled

# The committer of a publish when the target's repository names none.
CommitName=Exponential static publishing

# Its e-mail address; empty: static-publish@<host name>.
CommitEmail=

# How many jobs (builds, publishes, rollbacks started in the administration) keep their files
# in <WorkDir>/.jobs; older ones are removed. A job that is running is always kept.
JobHistory=50

[Target_example]
# A target, as a template: copy the block as [Target_<id>] in
# settings/override/staticcache.ini.append.php and add <id> to TargetList[].
# This block is not built (TargetList[] does not name it). Settings left out
# of a target take the values shown here.
#
# The name shown in lists and the administration.
Name=Example target

# The front siteaccess to publish. Administration and editing siteaccesses
# (those that require a login or use an administration design) are refused.
SiteAccess=

# Where the build goes: github-pages (GitHub Pages) or git (any git host).
Kind=github-pages

# The git address the build is pushed to (no password or token in it).
Remote=

# The branch the build is pushed to: gh-pages, or main with Folder=docs.
Branch=gh-pages

# The folder of the branch the site is in: empty for the root, or docs.
Folder=

# How GitHub Pages receives the build: branch (pushed to Branch) or actions
# (a GitHub Actions workflow publishes it).
Delivery=branch

# How links are written: relative (../about-us/, works below any path) or
# base-path (/my-site/about-us/, below BasePath).
Links=relative

# The path the site is served below: /<repository>/ for a GitHub project
# site, empty or / for a custom domain or a user site. 404.html links below
# it whatever Links says, and exp:static:serve serves the build below it.
BasePath=

# The public address of the site (https://owner.github.io/my-site/), for the
# sitemap, robots.txt and the canonical and social card links. Empty: they
# are written like any other link and no sitemap is written.
PublicURL=

# A custom domain (www.example.com): written to CNAME; with it the site is
# served at the root of the domain.
CustomDomain=

# The credential the push uses: token:<secret name> (or token:env:<VARIABLE>)
# for an https Remote, sshkey:<secret name> for an SSH Remote (exp:static:keys
# <target> --generate makes the key: sshkey:staticpublish.<target>.deploy_key),
# app:<installation> (a GitHub App, with the GitHub integration), or none (the
# host's own SSH agent or credential helper). Only a name; the value stays in
# Setup > Secrets and reaches git only through its environment.
Credential=none

# Fetch the pages from this address instead of the siteaccess's SiteURL
# (an internal address of the same site, http://127.0.0.1:8080).
CrawlURL=

# Where links to what the build does not hold go (the search, the login, a
# form, another siteaccess): the live site, https://www.example.com. Empty:
# https:// and the host of the siteaccess's SiteURL.
LiveURL=

# The most pages one build crawls (1 to 20000).
MaxPages=10000

# How many links away from the front page the crawl goes (0 to 30). Empty:
# [CacheSettings] MaxCacheDepth.
MaxDepth=

# The files copied: referenced (what the pages and style sheets name) or
# referenced-and-storage (also every image of var/<site>/storage that belongs
# to published content the anonymous user may see).
Assets=referenced-and-storage

# The files written besides the pages: nojekyll (.nojekyll, so GitHub Pages
# publishes the files as they are), 404 (404.html from the site's own 404
# page), robots (robots.txt), sitemap (sitemap.xml, needs PublicURL),
# manifest (.static-publish/manifest.json; always written). CNAME is written
# whenever CustomDomain is set.
Extras[]
Extras[]=nojekyll
Extras[]=404
Extras[]=robots
Extras[]=sitemap
Extras[]=manifest

# What is done to every page: strip (always) removes debug output, form
# tokens, session ids and Content Security Policy nonces.
PostProcess[]
PostProcess[]=strip

# A search page for the static copy: enabled or disabled.
Search=disabled

# What happens to forms: hide, or endpoint (they post to the live site).
Forms=hide

# Pages left out, by their path in the site (/members, /shop/*); * matches
# any part. Links to them go to the live site.
ExcludePaths[]

# Pages left out by the section of their content (section ids).
ExcludeSections[]

# What may start a build: manual, publish, schedule, cli.
Triggers[]
Triggers[]=manual
Triggers[]=cli

# When a scheduled build runs (a cron expression), for Triggers[]=schedule.
Schedule=

# When to send a notice: failure, success.
Notify[]
Notify[]=failure

# An address that is sent a notice of every build (POST, JSON).
Webhook=
