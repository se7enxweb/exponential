#?ini charset="utf-8"?
# Exponential configuration file for modules
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/module.ini.append or
#       settings/override/module.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).

[ModuleSettings]
# An array of directories to search for modules
ModuleRepositories[]=kernel
ModuleRepositories[]=kernel/private/modules

# A list of extensions which have modules
# It's common to create a settings/module.ini.append file
# in your extension and add the extension name to automatically
# get modules from the extension when it's turned on.
ExtensionRepositories[]


# An array of known modules in the system, extensions should
# append to this array.
# This is currently used to avoid URL aliases overriding
# existing module names
ModuleList[]
ModuleList[]=apikey
ModuleList[]=audit
ModuleList[]=class
ModuleList[]=collaboration
ModuleList[]=contentcheck
ModuleList[]=csp
ModuleList[]=contentfinder
ModuleList[]=content
# The data tables and the named database connections (doc/eng-us/features/6.0/data-tables.md)
ModuleList[]=datatable
ModuleList[]=error
ModuleList[]=exphelp
# The GraphQL API with the session of the web interface (doc/eng-us/features/6.0/graphql.md)
ModuleList[]=graphql
ModuleList[]=ezinfo
ModuleList[]=infocollector
ModuleList[]=layout
ModuleList[]=mailpreferences
# Migrations: Setup > Migrations, their state, runs and rollback (doc/eng-us/guides/migrations.md)
ModuleList[]=migration
# Moderation: Dashboard > Recent content, the newest content with its hold and actions on a selection
# (doc/eng-us/features/6.0/moderation.md)
ModuleList[]=moderation
ModuleList[]=notification
ModuleList[]=oauth
ModuleList[]=oauthadmin
ModuleList[]=package
ModuleList[]=pdf
ModuleList[]=role
ModuleList[]=rss
ModuleList[]=search
# The kernel's secret store (doc/eng-us/features/6.0/secret-store.md)
ModuleList[]=secrets
ModuleList[]=section
ModuleList[]=settings
ModuleList[]=setup
ModuleList[]=shop
ModuleList[]=state
# Static publishing: Setup > Static publishing, targets, builds, preview, publish, history (doc/eng-us/help/static-publishing/README.md)
ModuleList[]=staticpublish
ModuleList[]=trigger
ModuleList[]=uiswitch
ModuleList[]=url
ModuleList[]=user
ModuleList[]=visual
ModuleList[]=workflow
ModuleList[]=switchlanguage

# This controls overriding of navigations parts defined
# module.php or by dynamic code.
#
# You can use the module name alone or with a view
[ModuleOverrides]
NavigationPart[]

# e.g make content/trash appear in setup tab
# NavigationPart[content/trash]=ezsetupnavigationpart
