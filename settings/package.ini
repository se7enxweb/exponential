#?ini charset="utf-8"?
# Exponential configuration file.
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/package.ini.append or
#       settings/override/package.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).

[RepositorySettings]
RepositoryDirectory=packages
# URL where Exponential setup wizard will fetch packages from
# If you want to use the old packages which were available in
# versions prior to 3.9 use the following URL instead:
# http://packages.ez.no/exponential/3.9legacypackages
RemotePackagesIndexURL=https://exponential.packages.exponential.earth/exponential/6.0/6.0.15
# If RemotePackagesIndexURL is empty, the RemotePackagesIndexURLBase setting
# will be used, appended with the Exponential version numbers, like
# RemotePackagesIndexURLBase/x.y/x.y.zalpha1
RemotePackagesIndexURLBase=https://exponential.packages.exponential.earth/exponential
# Vendor name of the Exponential package directory
Vendor=7x

[PackageSettings]
RepositoryDirectories[]=kernel/classes
# A list of extensions which have package handlers support
# The extension must place package handlers in the
# subdirectory packagehandlers.
ExtensionDirectories[]

# Aliases for handlers, this allows handlers to have
# nicer names and also shortcuts for doing specific items.
HandlerAlias[]
HandlerAlias[ezcontentclass]=eZContentClassPackageHandler

HandlerAlias[ezcontentobject]=eZContentObjectPackageHandler

HandlerAlias[eziniaddon]=eZINIAddonPackageHandler

HandlerAlias[ezfile]=eZFilePackageHandler
HandlerAlias[ezini]=eZFilePackageHandler
HandlerAlias[ezdesign]=eZFilePackageHandler
HandlerAlias[eztemplate]=eZFilePackageHandler
HandlerAlias[ezthumbnail]=eZFilePackageHandler

HandlerAlias[ezsql]=eZDBPackageHandler

HandlerAlias[ezextension]=eZExtensionPackageHandler
HandlerAlias[ezinstallscript]=eZInstallScriptPackageHandler

TypeList[]
TypeList[contentobject]=Content object
TypeList[contentclass]=Content class
TypeList[sitestyle]=Site style
TypeList[site]=Site

StateList[]
StateList[mature]=Mature
StateList[stable]=Stable
StateList[beta]=Beta
StateList[alpha]=Alpha
StateList[prealpha]=Pre-Alpha

[MaintainerSettings]
RoleList[]
RoleList[]=lead
RoleList[]=developer
RoleList[]=designer
RoleList[]=contributor
RoleList[]=tester

[CreationSettings]
# A list of extensions which have package creation handlers support
# The extension must place package creation handlers in the
# subdirectory packagecreators.
# The order here is the order the Create package page lists the wizards in:
# content first, then its classes, then extensions, then site styles.
HandlerList[]
HandlerList[]=ezcontentobject
HandlerList[]=ezcontentclass
HandlerList[]=ezextension
HandlerList[]=ezstyle

HandlerAlias[]
HandlerAlias[ezcontentclass]=eZContentClassPackageCreator
HandlerAlias[ezstyle]=eZStylePackageCreator
HandlerAlias[ezcontentobject]=eZContentObjectPackageCreator
HandlerAlias[ezextension]=eZExtensionPackageCreator


[InstallerSettings]
# A list of extensions which have package installation handlers support
# The extension must place package creation handlers in the
# subdirectory packageinstallers.
HandlerList[]
HandlerList[]=ezcontentobject
HandlerList[]=ezinstallscript

HandlerAlias[]
HandlerAlias[ezcontentobject]=eZContentObjectPackageInstaller
HandlerAlias[ezinstallscript]=eZInstallScriptPackageInstaller

# Maximum number of non-interactive install items processed per request.
InstallBatchMaxItems=12

# Maximum wall-clock seconds spent processing install items per request.
InstallBatchTimeBudgetSeconds=6


[LicenseSettings]
# The licenses a package can be given in the package creation wizards
# (Setup > Packages > Create new package, every creator's "Package information"
# step). The license is a strict choice from this list: the step shows a
# drop-down and refuses any value that is not listed here.
#
# The value stored in a package's package.xml (<licence>) is the license's
# identifier. Use the SPDX identifier where one exists (https://spdx.org/licenses/),
# otherwise an SPDX style "LicenseRef-<name>" identifier.
#
# The identifier chosen when the step opens. Must be one of LicenseList.
DefaultLicense=GPL-2.0-or-later

# The drop-down's groups (<optgroup>), in the order shown. Each group has a
# [LicenseGroup_<group>] block with Name=, the group's heading. A license whose
# Group= is not listed here is shown under "Other licenses" at the end.
GroupList[]
GroupList[]=software
GroupList[]=documentation
GroupList[]=cc-4.0
GroupList[]=cc-3.0
GroupList[]=cc-2.5
GroupList[]=cc-2.0
GroupList[]=cc-1.0
GroupList[]=public-domain
GroupList[]=proprietary

# The licenses that can be chosen, in the order shown within their group. Each
# one has a [License_<identifier>] block:
#   Name=         the license's official name (shown as it is, not translated)
#   URL=          the official page of the license
#   Group=        the group it is listed under (see GroupList)
#   Description=  optional, a short text shown below the drop-down
#
# To add a license, in settings/override/package.ini.append.php:
#   [LicenseSettings]
#   LicenseList[]=Apache-2.0
#   [License_Apache-2.0]
#   Name=Apache License 2.0
#   URL=https://www.apache.org/licenses/LICENSE-2.0
#   Group=software
#
# To replace the whole list, start with an empty LicenseList[] line in the
# override and list only the licenses you want (and set DefaultLicense to one
# of them).
LicenseList[]
LicenseList[]=GPL-2.0-or-later
LicenseList[]=GPL-2.0-only
LicenseList[]=GPL-3.0-or-later
LicenseList[]=GPL-3.0-only
LicenseList[]=LGPL-2.1-or-later
LicenseList[]=LGPL-2.1-only
LicenseList[]=LGPL-3.0-or-later
LicenseList[]=LGPL-3.0-only
LicenseList[]=AGPL-3.0-or-later
LicenseList[]=AGPL-3.0-only
LicenseList[]=MIT
LicenseList[]=GFDL-1.3-or-later
LicenseList[]=GFDL-1.3-only
LicenseList[]=CC-BY-4.0
LicenseList[]=CC-BY-SA-4.0
LicenseList[]=CC-BY-ND-4.0
LicenseList[]=CC-BY-NC-4.0
LicenseList[]=CC-BY-NC-SA-4.0
LicenseList[]=CC-BY-NC-ND-4.0
LicenseList[]=CC-BY-3.0
LicenseList[]=CC-BY-SA-3.0
LicenseList[]=CC-BY-ND-3.0
LicenseList[]=CC-BY-NC-3.0
LicenseList[]=CC-BY-NC-SA-3.0
LicenseList[]=CC-BY-NC-ND-3.0
LicenseList[]=CC-BY-2.5
LicenseList[]=CC-BY-SA-2.5
LicenseList[]=CC-BY-ND-2.5
LicenseList[]=CC-BY-NC-2.5
LicenseList[]=CC-BY-NC-SA-2.5
LicenseList[]=CC-BY-NC-ND-2.5
LicenseList[]=CC-BY-2.0
LicenseList[]=CC-BY-SA-2.0
LicenseList[]=CC-BY-ND-2.0
LicenseList[]=CC-BY-NC-2.0
LicenseList[]=CC-BY-NC-SA-2.0
LicenseList[]=CC-BY-NC-ND-2.0
LicenseList[]=CC-BY-1.0
LicenseList[]=CC-BY-SA-1.0
LicenseList[]=CC-BY-ND-1.0
LicenseList[]=CC-BY-NC-1.0
LicenseList[]=CC-BY-NC-SA-1.0
LicenseList[]=CC-BY-NC-ND-1.0
LicenseList[]=CC0-1.0
LicenseList[]=LicenseRef-PDM-1.0
LicenseList[]=LicenseRef-Proprietary

# Other names a stored license is known by, mapped to a LicenseList identifier.
# Packages made before the license became a choice store "GPL", which always
# meant the GNU GPL version 2 or (at your option) any later version, the license
# of Exponential itself. An alias is shown as the license it stands for, and a
# posted alias is stored as that license's identifier.
AliasList[]
AliasList[GPL]=GPL-2.0-or-later

