#?ini charset="utf-8"?

# Settings to load additional menu items based on templates
[AdditionalMenuSettings]
# Context menu items template(s)
ContextMenuTemplateArray[]
# Subitems context menu template(s)
SubitemsContextMenuTemplateArray[]
# Template(s) for submenus of the popupmenu
SubMenuTemplateArray[]
# Template(s) for class popup menu on large class icon in node view
ClassMenuTemplateArray[]
# Template(s) for bookmark popup menu on right side bookmark box
BookmarkMenuTemplateArray[]

# Template(s) for advance menu, sub menu of Context/Subitems menu
AdvancedMenuTemplateArray[]

# Example settings used in the OpenOffice.org extension
#ContextMenuTemplateArray[]=node/oocontextmenu.tpl
#SubitemsContextMenuTemplateArray[]=node/oosubitemscontextmenu.tpl

# Default setting for subitems table
[SubItems]
# Column names reflect the attribute names of template variable $node
VisibleColumns[]
VisibleColumns[ezcontentnavigationpart]=checkbox;crank;name;published_date;translations;priority
VisibleColumns[ezmedianavigationpart]=checkbox;crank;thumbnail;name;hidden_status_string;class_name
VisibleColumns[ezusernavigationpart]=checkbox;crank;name;creator;published_date

# Settings used by window controls template
[WindowControlsSettings]
# List of additional tab identifiers
# AdditionalTabs[]=customtab
AdditionalTabs[]=roles
AdditionalTabs[]=policies

# Additional tab configuration example
# [AdditionalTab_customtab]
# Title=Example Tab
# Description=Some example tab description
#
# Navigation part where the tab will be available (ezcontentnavigationpart, ezusernavigationpart, ...)
# NavigationPartName=ezcontentnavigationpart
#
# Custom tab templates should be placed under design/admin/templates/tabs/
# E.g design/admin/templates/tabs/custom_tab.tpl
#
# Tab header template, if empty then Title and Description are used by default header template
# HeaderTemplate=
# Tab content template
# Template=custom_tab.tpl

[AdditionalTab_roles]
Title=
Description=
NavigationPartName=ezusernavigationpart
HeaderTemplate=user/roles_header.tpl
Template=user/roles.tpl

[AdditionalTab_policies]
Title=
Description=
NavigationPartName=ezusernavigationpart
HeaderTemplate=user/policies_header.tpl
Template=user/policies.tpl


[ContentEditSettings]
# Templates to include in the left menu of content/edit
# for instance
# LeftMenuParts[]=content/parts/advanced.tpl
# will include "design:content/parts/advanced.tpl"
# from design/admin/templates/content/edit_menu.tpl
LeftMenuParts[]

[PaginationSettings]
# How long the lists in the administration interface are.
#
# One block rather than a setting in each area's own ini file, because the
# question is "where do I change how long these lists are" and it should have
# one answer. The key is the module and view that draws the list, so a setting
# can be found from the address of the page it governs.
#
# Clear the caches after changing these:
#   php bin/php/ezcache.php --clear-all

# Used by any list below that names no size of its own.
DefaultItemsPerPage=25

ItemsPerPage[]
ItemsPerPage[setup/extensions]=25
ItemsPerPage[setup/cronjobs]=25
ItemsPerPage[section/list]=25
ItemsPerPage[workflow/grouplist]=25
ItemsPerPage[workflow/processlist]=10
ItemsPerPage[oauthadmin/list]=25
ItemsPerPage[package/list]=25
ItemsPerPage[pdf/list]=25
ItemsPerPage[content/translations]=25
ItemsPerPage[infocollector/overview]=25
ItemsPerPage[class/grouplist]=25
ItemsPerPage[class/classlist]=25
ItemsPerPage[shop/orderlist]=15
ItemsPerPage[shop/customerlist]=15
ItemsPerPage[shop/archivelist]=50
ItemsPerPage[shop/discountgroup]=25
ItemsPerPage[shop/status]=25
ItemsPerPage[shop/vattype]=25
ItemsPerPage[shop/vatrules]=25
ItemsPerPage[shop/productcategories]=25
# shop/preferredcurrency is not listed: it is a drop-down for choosing one
# currency, not a list of rows, and paging it would make it unusable.
ItemsPerPage[state/groups]=10

# Lists that offer an items per page selector take the sizes they offer. The
# first is what somebody who has never chosen gets, and the list also bounds
# the query: a size that is not on it cannot be asked for.
ItemsPerPageList_shop_currencylist[]
ItemsPerPageList_shop_currencylist[]=10
ItemsPerPageList_shop_currencylist[]=25
ItemsPerPageList_shop_currencylist[]=50

ItemsPerPageList_shop_productsoverview[]
ItemsPerPageList_shop_productsoverview[]=10
ItemsPerPageList_shop_productsoverview[]=25
