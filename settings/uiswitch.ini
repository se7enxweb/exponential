#?ini charset="utf-8"?
# UI switch: choices a signed-in user makes for the administration interface itself (the display
# language first), kept in the session and applied early in every request. Content languages are
# never changed. Guide: doc/guides/ui-switch-settings.md; provider API: doc/bc/6.0/ui-switch.md
#
# Do not edit this file: override it in settings/override/uiswitch.ini.append.php, in a siteaccess's
# uiswitch.ini.append.php or in an extension's settings.

[UISwitchSettings]
# true | false. Off: no choice is offered or applied anywhere.
Enabled=true
# The siteaccesses where the choices work. Empty: every siteaccess whose design list has an
# administration design (admin, admin2, admin3, admin4, admin4l, adminui; the editor and adminui
# siteaccesses fall back to them). Never a public site.
SiteAccessList[]
# The providers, in toolbar order. Each needs a [UISwitch_<identifier>] group with Class=, and gets
# the policy function uiswitch/<identifier>.
ProviderList[]
ProviderList[]=language
ProviderList[]=design

[UISwitch_language]
# The display language of the interface: site.ini [RegionalSettings] Locale for this user's requests
# (translations, date and number formats). Policy: uiswitch/language.
Class=expUISwitchLanguageProvider
Enabled=true
# The languages a user may choose, shown grouped: first the groups of GroupList[] in their order (each
# GroupValues_<group>[] in the order given, ranked by how many administrators worldwide need them; why the
# defaults are what they are: doc/features/6.0/ui-switch-languages.md), then every offered language A-Z by its
# name. A locale is offered only when share/locale/<locale>.ini exists; the siteaccess's own Locale is always
# offered and choosing it clears the switch. A language without a translation of the interface keeps English
# texts with its own date and number formats, and says so in the list ("no translation yet").
GroupList[]
GroupList[]=english
GroupList[]=major
GroupList[]=regional
# The group headings (translated in the context kernel/uiswitch/language).
GroupLabel[]
GroupLabel[english]=English
GroupLabel[major]=Major world languages
GroupLabel[regional]=Regional variants
GroupValues_english[]
GroupValues_english[]=eng-US
GroupValues_english[]=eng-GB
GroupValues_english[]=eng-AU
GroupValues_english[]=eng-CA
GroupValues_english[]=eng-IN
GroupValues_major[]
GroupValues_major[]=esl-ES
GroupValues_major[]=chi-CN
GroupValues_major[]=fre-FR
GroupValues_major[]=ger-DE
GroupValues_major[]=por-BR
GroupValues_major[]=jpn-JP
GroupValues_major[]=rus-RU
GroupValues_major[]=ara-SA
GroupValues_major[]=hin-IN
GroupValues_major[]=ita-IT
GroupValues_major[]=ind-ID
GroupValues_major[]=tur-TR
GroupValues_major[]=kor-KR
GroupValues_major[]=dut-NL
GroupValues_major[]=pol-PL
GroupValues_major[]=vie-VN
GroupValues_major[]=ukr-UA
GroupValues_major[]=fas-IR
GroupValues_major[]=heb-IL
GroupValues_regional[]
GroupValues_regional[]=esl-MX
GroupValues_regional[]=esl-US
GroupValues_regional[]=fre-CA
GroupValues_regional[]=fre-CH
GroupValues_regional[]=ger-AT
GroupValues_regional[]=ger-CH
GroupValues_regional[]=por-PT
GroupValues_regional[]=chi-TW
GroupValues_regional[]=chi-HK
GroupValues_regional[]=ara-EG
# enabled: every locale of share/locale (without the format variants such as eng-GB@euro) is offered and listed
# A-Z after the groups ("All languages"). disabled: only the groups and AllowedValues[]; those no group names are
# listed A-Z as "More languages".
AllLanguages=enabled
# enabled: languages without a translation of the interface (share/translations/<locale>/translation.ts) are
# offered too, marked "no translation yet". disabled: only English and the translated languages.
ListUntranslated=enabled
# More locales to offer, outside the groups (a format variant such as eng-GB@euro, or a list of its own when
# GroupList[] is empty and AllLanguages=disabled). A test language (TestLanguage=true in its locale file, such as
# Lorem Ipsum, qlo-ZZ) is never in a group or in the A-Z list of AllLanguages; only naming it here offers it.
AllowedValues[]
# enabled: the choice is also kept in the user's preferences and comes back at the next sign-in.
# disabled (default): it ends with the session, at logout.
RememberPreference=disabled

[UISwitch_design]
# The design of the administration interface: site.ini [DesignSettings] SiteDesign and
# AdditionalSiteDesignList[] for this user's requests. Policy: uiswitch/design.
Class=expUISwitchDesignProvider
Enabled=true
# The designs a user may choose, in toolbar order. A design is offered only when it has a
# DesignChain[] entry below and the design exists (design/<design>, or design/<design> of an active
# design extension); the siteaccess's own SiteDesign is always offered and choosing it clears the
# switch. adminui needs the exp_adminui extension active on the siteaccess (its design is then a
# design extension), admin_classic the sevenx_themes_admin_classic extension. Every design offered
# must render the right toolbar (toolbar/full/admin_ui_switch.tpl),
# or a user who chose it cannot choose again.
AllowedValues[]
AllowedValues[]=admin4l
AllowedValues[]=admin4
AllowedValues[]=adminui
AllowedValues[]=admin3
AllowedValues[]=admin
AllowedValues[]=admin_classic
# The fallback designs each choice runs with (AdditionalSiteDesignList[]), separated by ";",
# most specific first. Empty: the design and the standard design only.
DesignChain[]
DesignChain[admin4l]=admin4;admin3;admin2;admin
DesignChain[admin4]=admin3;admin2;admin
DesignChain[adminui]=admin4l;admin4;admin3;admin2;admin
DesignChain[admin3]=admin2;admin
DesignChain[admin]=
DesignChain[admin_classic]=admin
# The names shown in the toolbar (translated in the context kernel/uiswitch).
DesignLabel[]
DesignLabel[admin4l]=Admin 4 (layouts)
DesignLabel[admin4]=Admin 4
DesignLabel[adminui]=AdminUI
DesignLabel[admin3]=Admin 3
DesignLabel[admin]=Classic
DesignLabel[admin_classic]=Classic (server-rendered)
# enabled: the choice is also kept in the user's preferences and comes back at the next sign-in.
# disabled (default): it ends with the session, at logout.
RememberPreference=disabled
