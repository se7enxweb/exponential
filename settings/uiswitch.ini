#?ini charset="utf-8"?
# UI switch: choices a signed-in user makes for the administration interface itself (the display
# language first), kept in the session and applied early in every request. Content languages are
# never changed. Guide: doc/guides/ui-switch-settings.md; provider API: doc/bc/6.0/ui-switch.md
#
# Do not edit this file: override it in settings/override/uiswitch.ini.append.php, in a siteaccess's
# uiswitch.ini.append.php or in an extension's settings.

[UISwitchSettings]
# true | false. Off: no choice is offered or applied anywhere.
Enabled=true
# The siteaccesses where the choices work. Empty: every siteaccess whose design list has an
# administration design (admin, admin2, admin3, admin4, admin4l, adminui; the editor and adminui
# siteaccesses fall back to them). Never a public site.
SiteAccessList[]
# The providers, in toolbar order. Each needs a [UISwitch_<identifier>] group with Class=, and gets
# the policy function uiswitch/<identifier>.
ProviderList[]
ProviderList[]=language

[UISwitch_language]
# The display language of the interface: site.ini [RegionalSettings] Locale for this user's requests
# (translations, date and number formats). Policy: uiswitch/language.
Class=expUISwitchLanguageProvider
Enabled=true
# The locales a user may choose. A locale is offered only when share/locale/<locale>.ini exists and,
# except for English, share/translations/<locale>/translation.ts does; the siteaccess's own Locale
# is always offered and choosing it clears the switch.
AllowedValues[]
AllowedValues[]=eng-GB
AllowedValues[]=eng-US
AllowedValues[]=ger-DE
# enabled: the choice is also kept in the user's preferences and comes back at the next sign-in.
# disabled (default): it ends with the session, at logout.
RememberPreference=disabled
