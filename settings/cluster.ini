#?ini charset="utf-8"?
# Exponential configuration file.
#
# NOTE: It is not recommended to edit this file directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/cluster.ini.append or
#       settings/override/cluster.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).
#
# The hosts that serve this installation, for the console commands that run
# on them over ssh: exp:host:run, exp:cluster:run, exp:cluster:cache,
# exp:cluster:deploy, exp:cluster:status and exp:cluster:hosts
# (doc/eng-us/features/6.0/cluster-host-commands.md).
#
# No secret belongs here. The commands call the system's ssh with
# BatchMode=yes: the keys come from the ssh agent or ~/.ssh/config of the user
# who runs the command, and a host that would ask for a password fails instead.

[ClusterSettings]
# The hosts, in the order the commands visit them. Each one has a block
# [Host_<name>] below. A name is letters, digits, dot, dash and underscore.
#
# HostList[]
# HostList[]=web
# HostList[]=cluster
HostList[]

# The PHP binary on a host whose block names none (Php=).
DefaultPhp=php

# Seconds ssh waits for a host to answer (ssh -o ConnectTimeout).
ConnectTimeout=20

# Seconds one host may take for everything it is asked to do; a host that takes
# longer is stopped and counts as failed.
Timeout=1800

# Run on the hosts one after the other (sequential, the default) or all at once
# (parallel). --parallel and --sequential on the command line win.
Mode=sequential

# Add --allow-root-user to every console command, so that a host where the ssh
# login (or User=) is root runs it. A non-root user ignores the option.
# A host block can set its own AllowRootUser=enabled|disabled.
AllowRootUser=enabled

# More ssh options for every host, each as ssh -o takes it.
# SshOptions[]=StrictHostKeyChecking=accept-new
SshOptions[]

# The log in var/log where every run is written, one line per host
# (in addition to the audit event system.cluster.run).
LogFile=cluster.log

# A host. Copy the block for each name of HostList[].
#
# [Host_web]
# The ssh target: an alias of ~/.ssh/config, a host name or user@host.
# "local" runs on this machine without ssh (sh -c).
# Ssh=root@web.example.com
# The ssh port; empty: ssh's own default or the alias's Port.
# Port=22
# The installation's root directory on that host (required).
# Root=/var/www/vhosts/example.com/doc/example.com
# The PHP binary on that host; empty: [ClusterSettings] DefaultPhp.
# Php=/opt/plesk/php/8.5/bin/php
# Run as this user on the host (sudo -n -u <user> -H); empty: the ssh login.
# Use the site user, so that caches are not written as root.
# User=example
# exp:cluster:deploy runs as this user; empty: the ssh login, because a deploy
# reloads PHP-FPM and restarts Velocity, which a site user may not do.
# DeployUser=
# How the host serves the site: fpm (PHP-FPM behind Apache or nginx) or
# velocity (Exponential Velocity). velocity adds Velocity's response cache to
# exp:cluster:cache and the server's state to exp:cluster:status; fpm makes
# exp:cluster:deploy pass --no-velocity.
# Engine=fpm
# Options exp:cluster:deploy adds for this host to exp:velocity deploy.
# DeployOptions[]=--no-velocity
# AllowRootUser=enabled
