<?php /* #?ini charset="utf-8"?

[ServerSettings]
# The web server binary Velocity drives. Relative paths resolve against the
# installation root.
ScriptPath=vendor/se7enxweb/qbix-webserver/qbixserver.php

# Document root handed to the server. Empty means the installation root,
# which is where index.php lives.
DocumentRoot=

# Bind address. 127.0.0.1 keeps the server reachable only through a tunnel or
# a reverse proxy, which is the right default: this server has no HTTP auth
# of its own and serves the whole document root.
Host=127.0.0.1

Port=8088
HTTPSPort=8080

# Explicit, always. Left to itself the server sizes the pool from the machine
# and can choose a number so large it accepts connections and answers none.
Workers=4

# How long a browser may keep a stylesheet, script or image without asking
# again, in seconds. 0 leaves the server's own default, which permits caching
# and then makes the client revalidate anyway -- so a page with 41 assets costs
# 41 conditional requests on every view.
#
# A year is what the other web server in front of this installation already
# sends for the same files. The trade is that a file replaced in place is not
# noticed until the lifetime expires; clear a browser's cache, or lower this,
# while working on a stylesheet.
StaticMaxAge=31536000

# Speak HTTP/2 to clients that ask for it during the TLS handshake.
#
# A page on this installation references 41 assets. Over HTTP/1.1 a browser
# fetches them about six at a time in waves; over HTTP/2 they share one
# connection. Measured here, asset delivery was 393-418ms against 85-104ms
# through a front end that spoke it, on identical bytes.
#
# The protocol is agreed during the handshake and a client does not fall back
# afterwards, so a fault would be a page that never arrives rather than one
# that arrives slowly. That is why the server answers any stream still open
# with a readable page instead of closing silently, and why this is a switch
# rather than the default.
HTTP2=enabled

# The picture on that page. Empty uses the one the server draws, which is
# inline and needs no second request -- the page appears exactly when the
# connection carrying it is unreliable. Point this at an svg, png or jpg to
# change it, or set the server's own errorPage.image to "none" for no picture.
HTTP2ErrorImage=

PidFile=var/tmp/velocity.pid
LogFile=var/tmp/velocity.log

[HTTPSSettings]
# manual uses the certificate and key below. Leave Enabled=false to serve
# plain HTTP only.
Enabled=false
Certificate=
Key=

[PHPSettings]
# Interpreter settings for the server process, one per line, exactly as they
# would be written after -d.
#
# The opcode cache is here because /etc/php.d/99-no-opcache-cli.ini disables it
# for every command-line PHP on this machine. That file is a system-wide
# decision affecting every site on the box and is deliberately left alone; this
# asks for the cache for this process only.
#
# Measured on a content page, four workers, requests round-robined between
# servers so that drift during the run hits all of them equally:
#
#   none (today)              526.6 ms    1.9 req/s     baseline
#   opcache                   390.8 ms    2.6 req/s    +25.8%
#   + no timestamp checks     390.0 ms    2.6 req/s    +25.9%
#   + interned strings 32M    387.4 ms    2.6 req/s    +26.4%
#   + tracing JIT             416.7 ms    2.4 req/s    +20.9%
#
# So: the cache alone is the win. Timestamp checks cost nothing measurable and
# are worth keeping, because turning them off means an edited file is ignored
# until the service restarts. Tracing JIT is slower than no JIT on this
# workload and is deliberately absent.
IniOptions[]
IniOptions[]=opcache.enable_cli=1
IniOptions[]=opcache.memory_consumption=256
IniOptions[]=opcache.max_accelerated_files=20000
IniOptions[]=opcache.interned_strings_buffer=32

[ApplicationSettings]
# Globals the application keeps between requests.
#
# A registry filled by a file the kernel reaches with include_once cannot be
# refilled once cleared, because include_once will not run that file again.
# Three registries in this kernel are built that way; clearing them leaves a
# worker unable to resolve a datatype, a workflow event or a notification
# event for the rest of its life.
#
# Nothing else belongs here. Request-scoped globals must be cleared, and
# keeping one leaks a request into the next.
KeepGlobals[]
KeepGlobals[]=eZDataTypes
KeepGlobals[]=eZDataTypeObjects
KeepGlobals[]=eZDataTypeAllowedTypes
KeepGlobals[]=eZWorkflowTypes
KeepGlobals[]=eZWorkflowTypeObjects
KeepGlobals[]=eZWorkflowAllowedTypes
KeepGlobals[]=eZNotificationEventTypes
KeepGlobals[]=eZNotificationEventTypeObjects
KeepGlobals[]=eZNotificationEventTypeAllowedTypes

[ControlSettings]
# How long to wait for a graceful stop before reporting it did not finish.
StopTimeout=15

# Extra options appended to the command line verbatim.
ExtraOptions[]

*/ ?>
