#?ini charset="utf-8"?
# Migrations: changes to an installation (content, classes, roles, settings, schema) written once in
# files under version control and applied to every installation of the site in the same order.
#
# A site changes these settings in settings/override/migration.ini.append.php.

[MigrationSettings]
# enabled: migrations are looked for in the directories below. disabled: none are found.
Enabled=enabled

# The site's migration directories, relative to the installation's root or absolute. Each holds
# files named YYYYMMDDHHMMSS_name.<type> (php, yml, sql, <engine>.sql, mongodb.json, ini); subdirectories are not
# searched.
DirectoryList[]
DirectoryList[]=migrations

# The directory inside every active extension (extension/<name>/migrations) and every installed
# package that holds its migrations.
ExtensionDirectory=migrations

[YamlSettings]
# YAML migrations (YYYYMMDDHHMMSS_name.yml) are read with symfony/yaml, which composer.json requires. An
# installation that keeps it outside its Composer vendor/ names the folder here: a Composer directory (with
# vendor/autoload.php) or the package itself (the folder with Yaml.php), relative to the root or absolute. The
# environment variable MIGRATION_YAML_LIBRARY_PATH is read the same way when this is empty.
LibraryPath=

[StepSettings]
# The step types of YAML migrations: StepTypeList[<name>]=<class>, where <name> is what "type:" of a step names and
# the class implements expMigrationStepType. An extension registers its own in its migration.ini.append.php.
StepTypeList[]
StepTypeList[reference]=expMigrationStepReference
StepTypeList[assert]=expMigrationStepAssert
StepTypeList[content]=expMigrationStepContent
StepTypeList[location]=expMigrationStepLocation
StepTypeList[content_version]=expMigrationStepContentVersion
StepTypeList[content_class]=expMigrationStepContentClass
StepTypeList[content_class_group]=expMigrationStepContentClassGroup
StepTypeList[user]=expMigrationStepUser
StepTypeList[user_group]=expMigrationStepUserGroup
StepTypeList[role]=expMigrationStepRole
StepTypeList[section]=expMigrationStepSection
StepTypeList[language]=expMigrationStepLanguage
StepTypeList[object_state_group]=expMigrationStepObjectStateGroup
StepTypeList[tag]=expMigrationStepTag
StepTypeList[url_alias]=expMigrationStepUrlAlias
StepTypeList[trash]=expMigrationStepTrash
StepTypeList[file]=expMigrationStepFile
StepTypeList[image]=expMigrationStepImage
StepTypeList[cache]=expMigrationStepCache
StepTypeList[search]=expMigrationStepSearch
StepTypeList[autoload]=expMigrationStepAutoload
StepTypeList[layout]=expMigrationStepLayout
StepTypeList[layout_block]=expMigrationStepLayoutBlock
StepTypeList[layout_rule]=expMigrationStepLayoutRule
StepTypeList[http]=expMigrationStepHttp
StepTypeList[mail]=expMigrationStepMail
StepTypeList[command]=expMigrationStepCommand
StepTypeList[schema]=expMigrationStepSchemaChange
StepTypeList[data]=expMigrationStepData
StepTypeList[sql]=expMigrationStepSql
StepTypeList[settings]=expMigrationStepSettings
StepTypeList[graphql]=expMigrationStepGraphql
StepTypeList[code_file]=expMigrationStepCodeFile

# The console commands the step type command may run: exp:* commands of ./console, by name (exp:services:compile) or
# with * at the end for a group (exp:static:*). Nothing else runs, and exp:migration:* and exp:upgrade* never do
# (they take the lock the run holds). There is no shell: the command and its arguments are handed over as a list.
CommandAllowList[]
CommandAllowList[]=exp:services:compile
CommandAllowList[]=exp:graphql:persist
CommandAllowList[]=exp:help:content
CommandAllowList[]=exp:static:build

# The most turns a "while" loop of a YAML migration takes when it names no "max"; one more fails the migration.
MaxLoopIterations=1000

[FileStepSettings]
# The folders, relative to the installation, below which the step type code_file writes, replaces or removes code and
# design files (templates, stylesheets, scripts, an extension's files). Nothing outside them is written, nor a .git
# folder, settings/override, var or vendor below them, nor a link that leads out of them. The file as it was is kept
# in var/backup/migration/files/<migration id>/ first, with its SHA-256 before and after; a failed migration and a
# rollback put it back. Empty (AllowedRootList[] alone): no file can be written, the step type is off.
AllowedRootList[]
AllowedRootList[]=design
AllowedRootList[]=extension

[RunSettings]
# The user a migration runs as when nobody is signed in: console and unattended runs. A run in the
# administration runs as the signed-in user. The login, never an id: ids differ between installations.
RunAsUser=admin

# enabled: a run stops at the first migration that fails; the ones after it are not run.
# disabled: the run goes on with the migrations that do not require the failed one.
StopOnFailure=enabled

# A pause between migrations, in seconds (0.5 is half a second, at most 60), to keep a long run from loading the
# server; PHP migrations that work in batches (expMigrationPhp::batches()) pause as long between their batches.
# Empty: none. --throttle=<seconds> of a run wins.
Throttle=

# A long run in parts. MaxMigrations: apply at most this many migrations in one run; MaxTime: start no further migration
# after this many seconds (the one running is finished). The rest stay pending: the next run (or exp:migration:resume)
# goes on with them, and a PHP migration that works in batches goes on from its checkpoint. Empty: no limit.
# --max-migrations=<n> and --max-time=<seconds> of a run win.
MaxMigrations=
MaxTime=

# A lower priority for runs on the command line (and the administration's background runs), 1 to 19 as nice(1).
# Empty: unchanged. --nice=<n> of a run wins.
Nice=

# enabled: after a run that applied (or a rollback that undid) migrations, the caches their steps touched are cleared,
# by their names in ezcache, and only those (every step type declares its caches; the step type cache adds more).
# The report lists them, with the deploy that clears exactly them on the server too
# (./console exp:velocity deploy --caches=<list> --apply). disabled: the caches are left as they are.
ClearCaches=enabled

# What happens to the search index of the objects the steps of a run created or changed, after the run:
# queue: queued for the cronjob indexcontent (the pending actions of delayed indexing); now: indexed at once, before
# the run ends; disabled: left alone. The step type search reindexes on its own, a full reindex too.
Reindex=queue

[CaptionSettings]
# Captions are exp:upgrade's (./console exp:upgrade:captions lists them all): git_manager's full caption, or the
# database dump of exp:upgrade without git_manager, with settings/override and the commits of the code.
#
# enabled: a caption (kind migration-pre) is taken before a run that applies migrations. When none can be taken
# (an engine without a dump, a full disk) the run goes on with a warning: there is then no automatic restore.
Before=enabled

# enabled: a caption (kind migration-post, labelled with the migrations that ran) is taken after a run that
# succeeded: the next run reuses it while nothing has changed since.
After=enabled

# enabled: the newest migration caption is reused instead of a new one while the database, var/ storage,
# settings/override and the commit of the installation are as they were when it was taken. The check is exact on
# PostgreSQL (the change counters of every table), MySQL/MariaDB (CHECKSUM TABLE of every table) and SQLite (the
# rows of every table); MongoDB and Oracle always take a new caption.
ReuseUnchanged=enabled

# The tables the reuse check leaves out: the record of the runs and captions, sessions and the audit index (each
# caption writes an audit event). A name ending in * stands for every table that starts with it.
ReuseIgnoreTableList[]
ReuseIgnoreTableList[]=exp_migration
ReuseIgnoreTableList[]=exp_migration_run
ReuseIgnoreTableList[]=ezsession
ReuseIgnoreTableList[]=expaudit_*

# enabled: a run that fails is put back to its pre caption at once (after a caption of the failed state, kind
# migration-failure). Oracle has no built-in restore: the run stops and prints the steps to restore by hand.
RestoreOnFailure=enabled

# The parts of a caption a failed run is put back to (exp:upgrade:rollback --parts): database, storage, settings.
RestoreParts[]
RestoreParts[]=database
RestoreParts[]=storage
RestoreParts[]=settings

# The code trees of the installation a run checks for changes that are not committed: a run with --apply is refused
# while one has some, unless it is given --include-uncommitted (the changes then go into the caption as a patch and
# a copy of the new files).
CodeTreeList[]
CodeTreeList[]=settings
CodeTreeList[]=extension
CodeTreeList[]=design

# The folder of the captions made without git_manager. Empty: var/backup/upgrade, as exp:upgrade.
BackupDirectory=

[RepositorySettings]
# Where the record of the runs is kept under version control: the status files (status/<environment>.json) and the
# run logs (runs/<run-id>.log).
#   site      Path is a folder of the installation's own git repository
#   separate  Path is a git repository of its own
Mode=site

# The folder, relative to the installation's root or absolute.
Path=migrations

# The remote a run pushes to (any git remote: GitHub, GitLab, a server of your own). Empty: no push.
Remote=origin

# The branch a run commits on. Empty: the branch the repository is on. A repository on another branch is not
# committed to (a warning says so).
Branch=

# enabled: the status file and the run log are committed after every run, the failed ones too.
Commit=enabled

# enabled: the commit is tagged (one run, one revision: commit and tag). A tag is never moved or replaced.
Tag=enabled

# The name of the tag: <environment> (default when the installation names none), <run-id>, <date> (YYYYMMDD).
TagPattern=migrations/<environment>/<run-id>

# enabled: the commit and its tag are pushed to Remote. A push that fails stays local and is tried again by the
# cronjob part migrationpush (php runcronjobs.php migrationpush).
Push=enabled

[AdminSettings]
# Setup > Migrations (module migration) starts a run or a rollback as a console process of its own, which goes on when
# the page is closed; its files are in var/<site>/migration/jobs/.
#
# The php command line binary those processes run with. Empty: cronjob.ini [AdminSettings] PhpCliPath, else the
# usual places (the bin directory of this php, /usr/bin/php, /usr/local/bin/php). Never the php-fpm binary.
PhpCliPath=

# How many runs started there keep their files (the newest ones; a run going on is always kept).
JobHistory=50

# How a run started there goes to the background:
#   process  a console process of its own, started at once (the default)
#   queue    a job of expqueue (the extension), run by its worker, when expqueue is active, its tables are installed,
#            expqueue.ini has the job type below and a worker is running; else a process as above
# The job type, in the site's expqueue.ini.append.php:
#   [JobType_migration.run]
#   Handler=expMigrationQueueHandler
#   Class=bulk
#   Timeout=86400
#   Description=A migration run started in Setup > Migrations
Background=process

# The expqueue job type of Background=queue.
QueueJobType=migration.run

# How much of the end of a run log a page shows, in bytes.
LogBytes=262144

[InstallSettings]
# Migrations shipped with a package (a directory migrations/ at the top of the package, next to its package.xml or
# package.json): installing the package (Setup > Packages, or a package the setup wizard or the kickstarter installs
# item by item) runs them once its items are installed, with ./console exp:migration:migrate
# --path=<the package's migrations> --apply as the user who installs it (the console: [RunSettings] RunAsUser). A
# migration that fails leaves the package not installed, so installing it again runs what is still pending.
# disabled: the package's migrations are not run; ./console exp:migration:migrate --apply runs them with the others.
RunOnPackageInstall=enabled

# The kickstarter (php bin/php/kickstarter.php run --apply) runs every pending migration of the new installation
# (./console exp:migration:migrate --apply) after the sites are created, while maintenance mode is still on.
# disabled: it does not.
RunOnKickstart=enabled

# The options of exp:migration:migrate for these runs: no-caption, no-restore, no-commit, no-push, no-tag,
# include-uncommitted. Installing writes settings, design and extension files the run would otherwise refuse as
# changes that are not committed, and a new installation has nothing to push yet.
RunOptions[]
RunOptions[]=include-uncommitted
RunOptions[]=no-push

# Seconds a run at installation may take before it is stopped (and reported as failed).
Timeout=3600

[RecordingSettings]
# Recordings of changes (./console exp:migration:record:start, Setup > Migrations > Recording): what is changed in
# the administration, the website sidebar or a command while a recording runs is kept as the steps of a YAML
# migration, for ./console exp:migration:generate --from-recording=<id>. A session recording keeps one user's own
# changes; a site-wide recording keeps every change of every user. The recording sees the kernel's operations
# (content published, a node moved, a class stored, a role changed, a setting written ...), not web requests.
#
# disabled: nothing is recorded and no recording can be started.
Recording=enabled

# The audit events a recording keeps, by name (the kernel's audit taxonomy). Empty: every event a migration step can
# repeat (the list of expMigrationRecordingEvent::STEPS, in guides/migrations-generators-and-recording.md).
EventList[]

# The attributes of user objects that are not personal data and may be recorded (identifiers, e.g. a "signature"
# a site uses for a team account). Empty: none. The account (login, e-mail, password) is never recorded, whatever
# this says: a generated migration names it by a secret reference.
UserKeepAttributeList[]

# The most events one recording keeps; the recording keeps running but adds nothing more, and says so. 0: no limit.
MaxEvents=10000

[RemoteSettings]
# Remotes: other installations this one deploys its migrations to (./console exp:migration:deploy --remotes=...),
# all at once and in sync. One [Remote_<id>] section for each id of RemoteList[]; set them in settings/override.
# A remote section never holds a secret: Credential names one of the secret store (Setup > Secrets) or an
# environment variable (env:VARIABLE). Guide: doc/eng-us/guides/migrations-remote-deploy.md
#
# [Remote_production1]
# Environment=production           alpha, dev, stage, beta, production, post, arch ... (the label reports show)
# Transport=rsync                  ssh (scp), sftp, rsync (over ssh), ftp, ftps (files only), local (this host)
# Host=node1.example.com
# Port=22
# User=deploy
# Path=/var/www/site               the installation's root on the remote
# Php=php                          the PHP CLI there
# Credential=sshkey:deploy_production1
# Groups[]=production              --remotes=production selects every remote of the group
# HostKeyFingerprint=SHA256:...    optional: the host key must have it (else it is learnt on first contact)
# Trigger=https://node1.example.com/migration/trigger    ftp and ftps only: the remote's signed HTTP trigger runs
#                                  the migrations there ([TriggerSettings] on the remote); without it FTP only sends
# TriggerSecret=trigger_node1      the secret the trigger's requests are signed with (a secret name or env:VARIABLE)
RemoteList[]

# How many remotes are worked on at the same time. The switch (every remote applies) always runs on all at once.
Parallel=4

# Seconds one remote may take for one phase (preflight, transfer, verify, switch, rollback).
Timeout=900

# How often a connection failure (ssh exit 255, a timeout, a dropped FTP transfer) is tried again in the preflight,
# the transfer and the verification. A run on a remote is never started twice.
Retries=2

# enabled: every deploy that sends or runs something keeps its report in var/<site>/migration/deploy/reports/.
StoreReports=enabled

# A staged deploy (--staged, the administration's "Staged") puts the remotes in stages by their Environment, in
# this order (an environment that is not listed comes last); each stage is switched all or nothing, and a gate
# waits for someone to approve the next one (--continue=<deploy id>, or Approve on the deploy's page).
StageOrder[]
StageOrder[]=alpha
StageOrder[]=dev
StageOrder[]=test
StageOrder[]=stage
StageOrder[]=beta
StageOrder[]=production
StageOrder[]=post
StageOrder[]=arch

# Notices by e-mail about a deploy: failure (refused, failed, taken back, out of sync), gate (a staged deploy waits
# for approval), success (deployed or transferred). Plain text, mail category admin.
Notify[]
Notify[]=failure
Notify[]=gate

# Where the notices go; empty: site.ini [MailSettings] AdminEmail.
NotifyEmail=

# Self-healing: the fixes a deploy may make on a remote (./console exp:migration:heal there), each only when listed,
# each written to the remote's fixes in the report. Before the preflight: stale-lock (a run lock whose process is
# gone, older than StaleLockAge, held on that host by the same user), paths (missing migration folders), modes (the
# permissions of [FileSettings] on the migration folders and var/<site>/migration, only added); after the switch:
# caches (ini and template-override). Never fixed, only reported: PHP or extension versions, a migration's own error.
SelfHeal[]

# Seconds from which a held run lock whose process is gone counts as stale (SelfHeal[]=stale-lock).
StaleLockAge=7200

# The free disk space a remote must have beyond the size of the files a deploy sends to it (bytes, or with K, M, G).
DiskMargin=50M

# The PHP version of a remote against this installation's: major (the same major version, else the deploy stops),
# minor (the same major.minor), warn (a difference is only a warning), off.
PhpCheck=major

# The extensions of a remote against this installation's: migrations (every extension whose migrations are sent is
# active there with the same version, else the deploy stops; other differences are warnings), all (every active
# extension), warn (differences are only warnings), off.
ExtensionCheck=migrations

[TriggerSettings]
# The signed HTTP trigger: a source installation that reaches this one by FTP only runs the migrations here through
# the view migration/trigger (POST, JSON). Each request is signed with HMAC-SHA256 with the secret Secret names, used
# once (its nonce), valid for Lifetime seconds, and only taken from AllowedAddresses[]. Guide:
# doc/eng-us/guides/migrations-remote-deploy.md ("FTP remotes with the HTTP trigger")
Trigger=disabled

# The secret the requests are signed with: a name of the secret store (Setup > Secrets) or env:VARIABLE, at least 16
# characters; the source's TriggerSecret holds the same value. Never the secret itself.
Secret=

# The addresses (or CIDR ranges, 192.0.2.0/24, 2001:db8::/32) the source connects from. Empty: no request is taken.
AllowedAddresses[]

# Seconds a signature is valid after it was issued.
Lifetime=300

# At most this many requests a minute (429 above).
MaxRequestsPerMinute=30

# The PHP CLI that runs the console scripts, and how many seconds one may take.
Php=php
Timeout=900

# enabled: the console scripts run with --allow-root-user (only when the web server's PHP runs as root).
AllowRootUser=disabled
