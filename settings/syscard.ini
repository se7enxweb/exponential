[Php]
# The end of security support of each PHP branch (https://www.php.net/supported-versions.php). A branch past its
# date is an error on the card, one within WarnDays a warning.
SecuritySupportEnds[]
SecuritySupportEnds[7.4]=2022-11-28
SecuritySupportEnds[8.0]=2023-11-26
SecuritySupportEnds[8.1]=2025-12-31
SecuritySupportEnds[8.2]=2026-12-31
SecuritySupportEnds[8.3]=2027-12-31
SecuritySupportEnds[8.4]=2028-12-31
SecuritySupportEnds[8.5]=2029-12-31
WarnDays=180

[Database]
# enabled: connect once and ask the server for its version; disabled: show the type and host from site.ini only
AskVersion=enabled

[Updates]
# enabled: count the packages that do not agree between composer.json, composer.lock and vendor/ (ezupdate's
# inventory, local files only, when the ezupdate extension is active)
AskUpdateInventory=enabled
# Seconds the count is kept in the cache directory (var/<site>/cache/syscard/); 0 keeps nothing
CacheTime=3600

[Inventory]
# The settings exp:info shows, as <file>/<block>/<name>. A setting whose name looks like a secret (password, key,
# token, user, login ...) is never shown, even when it is listed here.
Settings[]
Settings[]=site.ini/SiteSettings/SiteName
Settings[]=site.ini/SiteSettings/DefaultAccess
Settings[]=site.ini/SiteAccessSettings/MatchOrder
Settings[]=site.ini/RegionalSettings/Locale
Settings[]=site.ini/RegionalSettings/SiteLanguageList
Settings[]=site.ini/TimeZoneSettings/TimeZone
Settings[]=site.ini/ContentSettings/ViewCaching
Settings[]=site.ini/ContentSettings/StaticCache
Settings[]=site.ini/TemplateSettings/TemplateCompile
Settings[]=site.ini/TemplateSettings/TemplateCache
Settings[]=site.ini/DebugSettings/DebugOutput
Settings[]=site.ini/MailSettings/Transport
Settings[]=site.ini/SessionSettings/Handler
Settings[]=file.ini/ClusteringSettings/FileHandler
Settings[]=velocity.ini/ServerSettings/Engine
Settings[]=velocity.ini/ServerSettings/Workers
Settings[]=velocity.ini/ServerSettings/ForkPerRequest
Settings[]=exphelp.ini/DocLanguages/Default

[About]
# The text of exp:about: blocks of "@ <section> | <heading> | from <source>", paragraphs and "- Label: value" rows
TextFile=share/syscard/about.txt
