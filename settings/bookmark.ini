NonBookmarkableViews[]=user/logout
NonBookmarkableViews[]=user/activate
NonBookmarkableViews[]=user/forgotpassword
NonBookmarkableViews[]=user/register
NonBookmarkableViews[]=user/success
NonBookmarkableViews[]=user/password
NonBookmarkableViews[]=role/assign
NonBookmarkableViews[]=role/edit
NonBookmarkableViews[]=role/policyedit
NonBookmarkableViews[]=class/edit
NonBookmarkableViews[]=class/copy
