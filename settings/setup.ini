#?ini charset="utf-8"?
# Exponential configuration file for eZ Setup
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/setup.ini.append or
#       settings/override/setup.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).
#
# This file has settings for all tests that are run
# by the setup and also has some settings for the
# setup system itself.
#

[RegistrationSettings]
# Where the setup's registration step mails its report when kickstart.ini
# [registration] Send=true (the default is false). Empty: nothing is sent.
# The old upstream registration address no longer exists and is never used.
Receiver=

[phpversion]
# Supported: PHP 8.0 to 8.5. Usable without support: PHP 7.4 (Exponential 6.0.15 and later).
# MinimumVersion: older PHP is refused. SupportedVersion: below it the check passes with an
# "unsupported" notice (no bug-fix or security commitment; the features that need PHP 8 are missing).
# doc/eng-us/help/why-exponential-supports-php-7-4.md
MinimumVersion=7.4.0
SupportedVersion=8.0.0
UnstableVersions=6;

[ezcversion]
# Check for correct eZ Components version by existence of 
# class and function since there are no way of getting version information atm
TestClass=ezcBaseFile
TestFunction=walkrecursive
MinimumVersion=2008.2

[php_session]
Extensions=session
Require=one

[memory_limit]
MinMemoryLimit=64M

[execution_time]
MinExecutionTime=30

[directory_permissions]
CheckList=design;extension;settings;settings/override;settings/siteaccess;settings/siteaccess/admin;var;var/cache;var/cache/codepages;var/cache/content;var/cache/ini;var/cache/override;var/cache/template;var/cache/template/process;var/cache/template/tree;var/cache/texttoimage;var/cache/translation;var/log;var/storage;var/storage/original;var/storage/reference;var/storage/variations;var/autoload

[settings_permission]
CheckList=settings

[open_basedir]

[file_upload]
Require=all

[database_extensions]
# The PHP extensions of the databases the wizard can install a site on; one is
# enough. mysqli also gives the databases of the MySQL protocol (TiDB, Vitess,
# SingleStore, Xpand, Aurora MySQL), pgsql those of the PostgreSQL protocol
# (CockroachDB, YugabyteDB, Neon, Supabase, Aurora PostgreSQL), sqlsrv or
# pdo_sqlsrv SQL Server, pdo_firebird Firebird, pdo_ibm or ibm_db2 Db2 and
# Informix, and ffi DuckDB (with ffi.enable=true: preload, PHP's default,
# allows FFI on the command line only, and libduckdb, see [DuckDBSettings]),
# pdo_odbc or odbc a site over ODBC (SQL Server, PostgreSQL, MariaDB/MySQL, Db2),
# and curl libSQL and Turso (expLibSQLDB over HTTP; its embedded file mode needs
# sqlite3 as well). pdo_odbc or odbc also give SAP HANA when SAP's HANA ODBC
# driver ([HANASettings] Driver of site.ini, HDBODBC) is in unixODBC's
# odbcinst.ini. MonetDB needs no extension (expMonetDBDB speaks its protocol in
# PHP) and is listed last whenever PHP may open a socket.
Extensions=sqlite3;mysqli;pgsql;mongodb;oci8;sqlsrv;pdo_sqlsrv;pdo_firebird;pdo_ibm;ibm_db2;ffi;pdo_odbc;odbc;curl
Require=one

[database_all_extensions]
Extensions=sqlite3;mysqli;pgsql;mongodb
Require=all

[image_conversion]
TestList=imagegd_extension;imagemagick_program
Require=one

[texttoimage_functions]
Functions=imagettftext;imagettfbbox
Require=all

[zlib_extension]
Extensions=zlib
Require=all

[dom_extension]
Extensions=dom
Require=all

[curl_extension]
Extensions=curl
Require=all

[iconv_extension]
Extensions=iconv
Require=all

[xsl_extension]
Extensions=xsl
Require=all

[intl_extension]
Extensions=intl
Require=all

[imagemagick_program]
unix_Executable=convert
unix_SearchPaths=/bin;/sbin;/usr/bin;/usr/sbin;/usr/local/bin;/usr/local/sbin
unix_ExcludePaths=
win32_Executable=convertim.exe;convert.exe
win32_SearchPaths=
win32_ExcludePaths=convert.exe@Windows/system32

[DatabaseSettings]
# The database system the setup wizard lists first and preselects.
# One of sqlite3, mysqli, pgsql, mongodb. SQLite needs no database server;
# when the PHP sqlite3 extension is missing the wizard falls back to the
# first available system and says so.
DefaultType=sqlite3
DefaultServer=localhost
DefaultPort=
DefaultName=exponential
DefaultUser=root
DefaultPassword=
# Default<Setting>_<type> replaces the value above on the database page for
# that system: a PostgreSQL server has no user root and listens on 5432.
DefaultPort_pgsql=5432
DefaultUser_pgsql=postgres
DefaultPort_sqlserver=1433
DefaultUser_sqlserver=sa
DefaultPort_tidb=4000
DefaultPort_cockroachdb=26257
DefaultPort_yugabytedb=5433
DefaultUser_yugabytedb=yugabyte
# DuckDB is one file in var/storage/duckdb: no server, user or password
DefaultName_duckdb=exponential.duckdb
DefaultServer_duckdb=
DefaultUser_duckdb=
# libSQL: a server (sqld) on port 8080 with no user (the password is its auth token),
# or in the embedded file mode a file in var/storage/sqlite3 (DefaultFile_libsql);
# DefaultMode_libsql is the mode the page preselects (remote or file)
DefaultServer_libsql=127.0.0.1
DefaultPort_libsql=8080
DefaultUser_libsql=
DefaultName_libsql=exponential
DefaultMode_libsql=remote
DefaultFile_libsql=exponential-libsql.db
# Turso: always remote, HTTPS on 443, a database token
DefaultServer_turso=
DefaultPort_turso=443
DefaultUser_turso=
DefaultName_turso=exponential
# SAP HANA: the SQL port of the tenant database (3<instance>41: 39041 for HANA
# express, 443 for HANA Cloud); the database is the schema the site's tables go in
DefaultPort_hana=39041
DefaultUser_hana=
# MonetDB: monetdbd on port 50000, its default user monetdb
DefaultPort_monetdb=50000
DefaultUser_monetdb=monetdb
#CleanSQL=kernel_clean.sql
#DemoSQL=demokernel.sql
SQLSchema=kernel_schema.sql
CleanSQLData=cleandata.sql
DemoSQLData=demodata.sql

[DemoSettings]
DataFile=var.tgz

[SiteTemplates]
ThumbnailBase=eZ_setup_template
ThumbnailExtension=png
Name[]=corporate
Name[]=forum
Name[]=magazine
