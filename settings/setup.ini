#?ini charset="utf-8"?
# Exponential configuration file for eZ Setup
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/setup.ini.append or
#       settings/override/setup.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).
#
# This file has settings for all tests that are run
# by the setup and also has some settings for the
# setup system itself.
#

[RegistrationSettings]
# Where the setup's registration step mails its report when kickstart.ini
# [registration] Send=true (the default is false). Empty: nothing is sent.
# The old upstream registration address no longer exists and is never used.
Receiver=

[phpversion]
MinimumVersion=8.0.0
UnstableVersions=6;

[ezcversion]
# Check for correct eZ Components version by existence of 
# class and function since there are no way of getting version information atm
TestClass=ezcBaseFile
TestFunction=walkrecursive
MinimumVersion=2008.2

[php_session]
Extensions=session
Require=one

[memory_limit]
MinMemoryLimit=64M

[execution_time]
MinExecutionTime=30

[directory_permissions]
CheckList=design;extension;settings;settings/override;settings/siteaccess;settings/siteaccess/admin;var;var/cache;var/cache/codepages;var/cache/content;var/cache/ini;var/cache/override;var/cache/template;var/cache/template/process;var/cache/template/tree;var/cache/texttoimage;var/cache/translation;var/log;var/storage;var/storage/original;var/storage/reference;var/storage/variations;var/autoload

[settings_permission]
CheckList=settings

[open_basedir]

[file_upload]
Require=all

[database_extensions]
Extensions=sqlite3;mysqli;pgsql;mongodb;oci8
Require=one

[database_all_extensions]
Extensions=sqlite3;mysqli;pgsql;mongodb
Require=all

[image_conversion]
TestList=imagegd_extension;imagemagick_program
Require=one

[texttoimage_functions]
Functions=imagettftext;imagettfbbox
Require=all

[zlib_extension]
Extensions=zlib
Require=all

[dom_extension]
Extensions=dom
Require=all

[curl_extension]
Extensions=curl
Require=all

[iconv_extension]
Extensions=iconv
Require=all

[xsl_extension]
Extensions=xsl
Require=all

[intl_extension]
Extensions=intl
Require=all

[imagemagick_program]
unix_Executable=convert
unix_SearchPaths=/bin;/sbin;/usr/bin;/usr/sbin;/usr/local/bin;/usr/local/sbin
unix_ExcludePaths=
win32_Executable=convertim.exe;convert.exe
win32_SearchPaths=
win32_ExcludePaths=convert.exe@Windows/system32

[DatabaseSettings]
# The database system the setup wizard lists first and preselects.
# One of sqlite3, mysqli, pgsql, mongodb. SQLite needs no database server;
# when the PHP sqlite3 extension is missing the wizard falls back to the
# first available system and says so.
DefaultType=sqlite3
DefaultServer=localhost
DefaultPort=
DefaultName=exponential
DefaultUser=root
DefaultPassword=
# Default<Setting>_<type> replaces the value above on the database page for
# that system: a PostgreSQL server has no user root and listens on 5432.
DefaultPort_pgsql=5432
DefaultUser_pgsql=postgres
#CleanSQL=kernel_clean.sql
#DemoSQL=demokernel.sql
SQLSchema=kernel_schema.sql
CleanSQLData=cleandata.sql
DemoSQLData=demodata.sql

[DemoSettings]
DataFile=var.tgz

[SiteTemplates]
ThumbnailBase=eZ_setup_template
ThumbnailExtension=png
Name[]=corporate
Name[]=forum
Name[]=magazine
