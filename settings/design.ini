#?ini charset="utf-8"?
# Exponential configuration file for designs
#
# NOTE: It is not recommended to edit this files directly, instead
#       a file in override should be created for setting the
#       values that is required for your site. Either create
#       a file called settings/override/design.ini.append or
#       settings/override/design.ini.append.php for more security
#       in non-virtualhost modes (the .php file may already be present
#       and can be used for this purpose).


[ExtensionSettings]
# A list of extensions which have design data
# It's common to create a settings/design.ini.append file
# in your extension and add the extension name to automatically
# get design from the extension when it's turned on.
DesignExtensions[]


[StylesheetSettings]
SiteCSS=stylesheets/t02/site-colors.css
ClassesCSS=stylesheets/t02/classes-colors.css

# A list of CSS file to always include in the pagelayout
# This can be filled in by extensions to provide styles
# that are not in the standard themes.
# DEPRECATED in favor of [Frontend|Backend]CSSFileList[]
CSSFileList[]

# Same as above for frontend designs
FrontendCSSFileList[]

# Same as above for backend (admin) designs. The tables, uploads, dialogs, date fields, collapsing menus and
# sticky toolbars run on Exponential UI (extension expui adds exp::* to this list). admin3 loads its responsive.css
# itself (page_head_style.tpl); the list used to name it for every admin design.
BackendCSSFileList[]

# The administration's shared component classes (.a4-*) and its module stylesheets, loaded by the admin, admin3
# and admin4 designs after their own stylesheets and before BackendCSSFileList, so the packer bundles and caches
# them with the rest and an extension still has the last word. Every module stylesheet is listed here by name:
# one bundle for every admin page, cached once. The admin's templates carry no CSS of their own (no <style>, no
# style=""); see doc/bc/6.0/admin4-styling.md. An extension adds its file to BackendCSSFileList, not here.
AdminComponentCSSFileList[]
AdminComponentCSSFileList[]=components.css
AdminComponentCSSFileList[]=modules/setup.css
AdminComponentCSSFileList[]=modules/content.css
AdminComponentCSSFileList[]=modules/people.css
AdminComponentCSSFileList[]=modules/structure.css
AdminComponentCSSFileList[]=modules/workflow.css

[JavaScriptSettings]
# List of JavaScript files to include in pagelayout
# DEPRECATED in favor of [Frontend|Backend]JavaScriptList[]
JavaScriptList[]
#JavaScriptList[]=tools/ezjsselection.js

# Same as above for frontend designs
FrontendJavaScriptList[]

# Same as above for backend (admin) designs. The tables, uploads, dialogs, date fields, collapsing menus and
# sticky toolbars run on Exponential UI (extension expui adds exp::* to this list).
BackendJavaScriptList[]
BackendJavaScriptList[]=tools/ezjsselection.js
BackendJavaScriptList[]=lib/ezjslibimagepreloader.js
BackendJavaScriptList[]=popupmenu/ezpopupmenu.js
# leftmenu_widthcontrol.js is the column grip of design/admin, whose page_leftmenu.tpl loads it itself; admin4 has
# its own in ezadmin_menubar.js and does not ship the file. Do not add it here.
BackendJavaScriptList[]=contentstructuremenu_dynamic.js
BackendJavaScriptList[]=ezadmin_menubar.js


[AdminDesignSettings]
# admin4: the footer's "Evaluate Exponential / Become a member of the Exponential Community" line.
# enabled shows it; disabled (the default) leaves it out. A template can also set $show_community_links.
ShowCommunityLinks=disabled

# admin4: the icons a setting may name (menu.ini LinkIcons[] of a menu drawn as tiles, the Setup overview). Each name
# has a mask rule .a4-bi-<name> in components.css (a Bootstrap Icons 1.13.1 SVG in share/icons/bootstrap-icons/svg/);
# a name not listed here draws the plug icon. An extension that ships an icon of its own adds its SVG, a rule
# .a4-bi-<name> in a stylesheet of BackendCSSFileList[] and IconList[]=<name> in its design.ini.append.php
# (doc/features/6.0/admin4-design.md, "Setup overview").
