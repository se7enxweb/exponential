#?ini charset="utf-8"?
# The registry of the Exp Debug bar (the pinned bar at the bottom of a page with debug output).
# Guide: doc/bc/6.0/debug-bar.md
#
# Every setting the bar shows and changes is one [Setting_<id>] block:
#
#   [Setting_<id>]
#   File=site.ini            the INI file
#   Block=DebugSettings      its block
#   Variable=DebugOutput     its variable
#   Type=bool                bool | enum | list | text | iplist | userlist
#   Label=Debug output
#   Group=output             one of [DebugBarSettings] Groups[]
#   Help=One sentence on what it does.
#   Values[]                 enum only: the values it may take
#   On=enabled               bool only: the words written for on and off; default: the words the
#   Off=disabled             setting's own default uses (enabled/disabled or true/false)
#
# Every write goes through the exp:ini engine (expIniEditor): line by line, with a backup, keeping
# the file's owner. An extension adds its own settings in its settings/debugbar.ini.append.php:
#
#   [DebugBarSettings]
#   Settings[]=myext_debug
#   [Setting_myext_debug]
#   File=myext.ini
#   ...

[DebugBarSettings]
# The settings, in the order the bar lists them inside a group
Settings[]
Settings[]=debug_output
Settings[]=debug_mode
Settings[]=debug_redirection
Settings[]=display_debug_warnings
Settings[]=debug_log_only
Settings[]=display_included_files
Settings[]=always_log
Settings[]=script_debug_output
Settings[]=debug_toolbar
Settings[]=debug_by_ip
Settings[]=debug_ip_list
Settings[]=debug_by_user
Settings[]=debug_user_list
Settings[]=template_debug
Settings[]=template_show_xhtml_code
Settings[]=template_show_used_templates
Settings[]=template_path_comments
Settings[]=template_show_method_debug
Settings[]=template_development_mode
Settings[]=template_compile
Settings[]=template_cache
Settings[]=template_compile_accumulators
Settings[]=template_compile_timing_points
Settings[]=template_compile_comments
Settings[]=sql_output
Settings[]=sql_query_analysis
Settings[]=sql_slow_queries
Settings[]=sql_debug_transactions
Settings[]=regional_debug
Settings[]=regional_development_mode
Settings[]=mail_debug_sending
Settings[]=mail_debug_receiver
Settings[]=condition_debug
Settings[]=rest_debug
Settings[]=content_view_caching

# Groups, in the order the bar shows them
Groups[]
Groups[]=output
Groups[]=access
Groups[]=templates
Groups[]=sql
Groups[]=regional
Groups[]=mail
Groups[]=conditions
Groups[]=caching
Groups[]=extensions
GroupNames[output]=Debug output
GroupNames[access]=Who gets debug
GroupNames[templates]=Templates
GroupNames[sql]=Database
GroupNames[regional]=Translations
GroupNames[mail]=Mail
GroupNames[conditions]=Debug conditions
GroupNames[caching]=Caching
GroupNames[extensions]=Extensions

# Blocks whose every variable is a bool setting of the bar: <file>;<block>;<group>
DiscoverBlocks[]
DiscoverBlocks[]=debug.ini;GeneralCondition;conditions

# Extension debug switches: in every active extension's settings/*.ini and *.ini.append.php, a
# variable whose name matches DiscoveryPattern and whose value is enabled/disabled or true/false
# becomes a bool setting of the group extensions, unless the registry already has it.
ExtensionDiscovery=enabled
DiscoveryPattern=/debug/i
# <extension> or <extension>;<file> (e.g. ezjscore;ezjscore.ini) to leave out
DiscoveryExclude[]

# Presets, applied from the bar (each value a separate, undoable write)
Presets[]
Presets[]=template_work
Presets[]=sql_tuning
Presets[]=everything
Presets[]=off

# The colours of the live summary: <warn>;<high>
Thresholds[time_ms]=500;1500
Thresholds[sql_count]=100;300
Thresholds[sql_ms]=200;800
Thresholds[memory_mb]=64;192
Thresholds[templates]=150;400

# The write log, in var/<site>/log/ (one JSON object per line)
LogFile=debugbar.log
# Entries the bar lists
LogListLimit=20

# --------------------------------------------------------------------- debug output

[Setting_debug_output]
File=site.ini
Block=DebugSettings
Variable=DebugOutput
Type=bool
Label=Debug output
Group=output
Help=Shows the debug report (this bar) at the bottom of every page for those who get debug.

[Setting_debug_mode]
File=site.ini
Block=DebugSettings
Variable=Debug
Type=enum
Values[]
Values[]=inline
Values[]=popup
Label=Report placement
Group=output
Help=Inline puts the report under the page, popup opens it in a window of its own.

[Setting_debug_redirection]
File=site.ini
Block=DebugSettings
Variable=DebugRedirection
Type=bool
Label=Debug redirection
Group=output
Help=Stops at every redirect with a link, so the debug output of the page that redirected can be read.

[Setting_display_debug_warnings]
File=site.ini
Block=DebugSettings
Variable=DisplayDebugWarnings
Type=bool
Label=Debug warnings at the top
Group=output
Help=Shows warnings and errors in a box at the top of the page as well.

[Setting_debug_log_only]
File=site.ini
Block=DebugSettings
Variable=DebugLogOnly
Type=bool
Label=Log only
Group=output
Help=Writes debug messages to the log files only, never into the page.

[Setting_display_included_files]
File=site.ini
Block=DebugSettings
Variable=DisplayIncludedFiles
Type=bool
Label=Included files
Group=output
Help=Lists every PHP file the request included, in the report.

[Setting_always_log]
File=site.ini
Block=DebugSettings
Variable=AlwaysLog
Type=list
Values[]
Values[]=error
Values[]=warning
Values[]=notice
Values[]=debug
Values[]=strict
Label=Always log
Group=output
Help=Message levels written to var/log even when debug output is off.

[Setting_script_debug_output]
File=site.ini
Block=DebugSettings
Variable=ScriptDebugOutput
Type=bool
Label=Command line debug
Group=output
Help=Debug output for command line scripts (bin/php).

[Setting_debug_toolbar]
File=site.ini
Block=DebugSettings
Variable=DebugToolbar
Type=bool
Label=Debug toolbar
Group=output
Help=The settings and cache controls of this bar in the report.

# --------------------------------------------------------------------- who gets debug

[Setting_debug_by_ip]
File=site.ini
Block=DebugSettings
Variable=DebugByIP
Type=bool
Label=Debug by IP address
Group=access
Help=Only addresses in the IP list get debug output.

[Setting_debug_ip_list]
File=site.ini
Block=DebugSettings
Variable=DebugIPList
Type=iplist
Label=IP list
Group=access
Help=IPv4 and IPv6 addresses and networks (CIDR), each with an optional label and expiry.

[Setting_debug_by_user]
File=site.ini
Block=DebugSettings
Variable=DebugByUser
Type=bool
Label=Debug by user
Group=access
Help=Only the users in the user list get debug output.

[Setting_debug_user_list]
File=site.ini
Block=DebugSettings
Variable=DebugUserIDList
Type=userlist
Label=User list
Group=access
Help=User object ids that get debug output when debug by user is enabled.

# --------------------------------------------------------------------- templates

[Setting_template_debug]
File=site.ini
Block=TemplateSettings
Variable=Debug
Type=bool
Label=Template debug
Group=templates
Help=Debug messages for every template loaded.

[Setting_template_show_xhtml_code]
File=site.ini
Block=TemplateSettings
Variable=ShowXHTMLCode
Type=bool
Label=Inline template names
Group=templates
Help=With template debug on, shows each template's name in the page.

[Setting_template_show_used_templates]
File=site.ini
Block=TemplateSettings
Variable=ShowUsedTemplates
Type=bool
Label=List of used templates
Group=templates
Help=A table of the templates that rendered the page, in the report.

[Setting_template_path_comments]
File=site.ini
Block=TemplateSettings
Variable=ShowTemplatePathComments
Type=bool
Label=Template path comments
Group=templates
Help=Wraps each template's output in START/STOP HTML comments naming its path. Development only.

[Setting_template_show_method_debug]
File=site.ini
Block=TemplateSettings
Variable=ShowMethodDebug
Type=bool
Label=Operator and function debug
Group=templates
Help=Debug of every operator and function call (template compiler off only).

[Setting_template_development_mode]
File=site.ini
Block=TemplateSettings
Variable=DevelopmentMode
Type=bool
Label=Template development mode
Group=templates
Help=Checks templates against their compiled files on every request.

[Setting_template_compile]
File=site.ini
Block=TemplateSettings
Variable=TemplateCompile
Type=bool
Label=Template compiler
Group=templates
Help=Compiles templates to PHP. Off makes every page parse its templates.

[Setting_template_cache]
File=site.ini
Block=TemplateSettings
Variable=TemplateCache
Type=bool
Label=Cache blocks
Group=templates
Help=The cache-block function of templates.

[Setting_template_compile_accumulators]
File=site.ini
Block=TemplateSettings
Variable=CompileAccumulators
Type=bool
Label=Compiled accumulators
Group=templates
Help=Timing accumulators inside compiled templates (clear the template cache after a change).

[Setting_template_compile_timing_points]
File=site.ini
Block=TemplateSettings
Variable=CompileTimingPoints
Type=bool
Label=Compiled timing points
Group=templates
Help=Timing points inside compiled templates (clear the template cache after a change).

[Setting_template_compile_comments]
File=site.ini
Block=TemplateSettings
Variable=CompileComments
Type=bool
Label=Compiled comments
Group=templates
Help=Comments inside compiled template files.

# --------------------------------------------------------------------- database

[Setting_sql_output]
File=site.ini
Block=DatabaseSettings
Variable=SQLOutput
Type=bool
Label=SQL output
Group=sql
Help=Every SQL statement with its time in the report.

[Setting_sql_query_analysis]
File=site.ini
Block=DatabaseSettings
Variable=QueryAnalysisOutput
Type=bool
Label=Query analysis
Group=sql
Help=EXPLAIN of each statement (MySQL, with SQL output on).

[Setting_sql_slow_queries]
File=site.ini
Block=DatabaseSettings
Variable=SlowQueriesOutput
Type=text
Label=Slow queries only (ms)
Group=sql
Help=Lists only statements slower than this many milliseconds; 0 lists all.

[Setting_sql_debug_transactions]
File=site.ini
Block=DatabaseSettings
Variable=DebugTransactions
Type=bool
Label=Transaction debug
Group=sql
Help=Stack traces of every begin and commit, to find an unbalanced transaction.

# --------------------------------------------------------------------- translations

[Setting_regional_debug]
File=site.ini
Block=RegionalSettings
Variable=Debug
Type=bool
Label=Translation debug
Group=regional
Help=Which locale and translation files were loaded.

[Setting_regional_development_mode]
File=site.ini
Block=RegionalSettings
Variable=DevelopmentMode
Type=bool
Label=Bork translation
Group=regional
Help=Shows untranslated texts in bork, so they stand out.

# --------------------------------------------------------------------- mail

[Setting_mail_debug_sending]
File=site.ini
Block=MailSettings
Variable=DebugSending
Type=bool
Label=Redirect all mail
Group=mail
Help=Sends every mail to the debug receiver instead of its recipients.

[Setting_mail_debug_receiver]
File=site.ini
Block=MailSettings
Variable=DebugReceiverEmail
Type=text
Label=Debug receiver
Group=mail
Help=The address every mail goes to while redirect all mail is on.

# --------------------------------------------------------------------- conditions, REST, caching

[Setting_condition_debug]
File=debug.ini
Block=DebugSettings
Variable=ConditionDebug
Type=bool
Label=Conditional debug
Group=conditions
Help=Master switch of the debug conditions below (debug.ini GeneralCondition).

[Setting_rest_debug]
File=rest.ini
Block=DebugSettings
Variable=Debug
Type=bool
Label=REST debug
Group=output
Help=Debug output of the REST API.

[Setting_content_view_caching]
File=site.ini
Block=ContentSettings
Variable=ViewCaching
Type=bool
Label=View cache
Group=caching
Help=The content view cache. Off renders every node view each time.

# --------------------------------------------------------------------- presets

[Preset_template_work]
Name=Template work
Description=Template debug with names and the list of used templates, compiler kept on.
Values[debug_output]=on
Values[template_debug]=on
Values[template_show_xhtml_code]=on
Values[template_show_used_templates]=on
Values[template_development_mode]=on

[Preset_sql_tuning]
Name=SQL tuning
Description=Every statement with its time, the analysis, and transaction debug.
Values[debug_output]=on
Values[sql_output]=on
Values[sql_query_analysis]=on
Values[sql_debug_transactions]=on

[Preset_everything]
Name=Everything
Description=Every debug output there is (slow: for one look, then switch it off).
Values[debug_output]=on
Values[display_debug_warnings]=on
Values[display_included_files]=on
Values[template_debug]=on
Values[template_show_xhtml_code]=on
Values[template_show_used_templates]=on
Values[sql_output]=on
Values[sql_query_analysis]=on
Values[sql_debug_transactions]=on
Values[regional_debug]=on

[Preset_off]
Name=Off
Description=Every debug output off again.
Values[debug_output]=off
Values[debug_redirection]=off
Values[display_debug_warnings]=off
Values[display_included_files]=off
Values[template_debug]=off
Values[template_show_used_templates]=off
Values[template_path_comments]=off
Values[template_show_method_debug]=off
Values[template_development_mode]=off
Values[sql_output]=off
Values[sql_query_analysis]=off
Values[sql_debug_transactions]=off
Values[regional_debug]=off
