#?ini charset="utf-8"?
# The admin subitems list ("Table options"): which columns are shown by default, the presets
# everybody can choose, the defaults per place, the automatic attribute columns and the CSV
# export. The columns themselves are defined in subitemscolumns.ini ([Column_<key>] blocks).
# Guide: doc/bc/6.0/subitems-table-options.md
#
# Column keys used below: the 15 built-in columns (thumbnail, name, visibility, type, modifier,
# modified, published, translations, section, nodeid, noderemoteid, objectid, objectremoteid,
# objectstate, priority), every [Column_<key>] of subitemscolumns.ini, and the automatic
# attribute columns attr:<class identifier>/<attribute identifier>. Unknown keys are ignored, and
# a column the user may not see (its Policy[]) is left out wherever it is named.

[SubitemsSettings]
# The columns shown by default, in this order, wherever no [Defaults_*] block below matches and
# the user has not saved a choice of their own. These are the list's former defaults for the
# content tree (admininterface.ini [SubItems] VisibleColumns[ezcontentnavigationpart]).
DefaultColumns[]
DefaultColumns[]=name
DefaultColumns[]=published
DefaultColumns[]=translations
DefaultColumns[]=priority

# enabled: Table options also offers one column per attribute of the classes present among the
# parent's children (key attr:<class>/<attribute>, group "Attributes: <class name>"), no INI
# needed. The value is the attribute's title, else its text; sortable when the datatype sorts.
# disabled: only the columns of subitemscolumns.ini.
AttributeColumns=enabled

# Datatypes never offered as attribute columns. ezuser's text holds the login, e-mail and
# password hash, so it is excluded; the user columns of subitemscolumns.ini show what is safe.
AttributeColumnsExcludedDataTypes[]
AttributeColumnsExcludedDataTypes[]=ezuser

# Policies an attribute column of a datatype needs, as module/function, several separated by ;
# (all must be granted). Without an entry an attribute column needs nothing beyond content/read
# on the rows.
# Example: only users who may edit users see e-mail attributes
#AttributeColumnsDataTypePolicy[ezemail]=user/register
AttributeColumnsDataTypePolicy[]

# enabled: Table options has "Export CSV", the view content/subitemsexport/<node id> exists.
CSVExport=enabled
# The most rows one CSV export writes.
CSVLimit=5000

# The page sizes Table options offers (a custom size can still be typed in).
PageSizes[]
PageSizes[]=10
PageSizes[]=25
PageSizes[]=50
PageSizes[]=100


# Presets: a named set of visible columns everybody can choose in Table options. Users save their
# own presets next to these (in their preferences); a user preset cannot take an INI preset's id.
# [Preset_<id>]   id: a-z, 0-9, _ and -
# Name=           the name shown (translated with the context design/admin/node/view/full)
# Columns[]       the visible columns, in order

[Preset_seo]
Name=SEO
Columns[]
Columns[]=name
Columns[]=urlalias
Columns[]=pagetitle
Columns[]=systemurl
Columns[]=visibility

[Preset_editorial]
Name=Editorial
Columns[]
Columns[]=name
Columns[]=type
Columns[]=modifier
Columns[]=modified
Columns[]=published
Columns[]=objectstate

[Preset_technical]
Name=Technical
Columns[]
Columns[]=name
Columns[]=nodeid
Columns[]=parentnodeid
Columns[]=objectid
Columns[]=version
Columns[]=childrencount
Columns[]=noderemoteid
Columns[]=objectremoteid
Columns[]=section
Columns[]=priority

[Preset_translations]
Name=Translations
Columns[]
Columns[]=name
Columns[]=translations
Columns[]=modified
Columns[]=version


# Defaults per place: the columns shown by default under some parents (before the user saves a
# choice of their own). The first block that matches wins, in the order of this file:
# [Defaults_<id>]
# Subtree[]                 node ids: matches when the parent is one of them or lies below one
# ParentClassIdentifiers[]  class identifiers: matches when the parent is of one of them
# Columns[]                 the visible columns, in order

# The media library (content.ini [NodeSettings] MediaRootNode=43); the list's former media defaults
[Defaults_media]
Subtree[]
Subtree[]=43
ParentClassIdentifiers[]
Columns[]
Columns[]=thumbnail
Columns[]=name
Columns[]=visibility
Columns[]=type

# The users tree (content.ini [NodeSettings] UserRootNode=5); the list's former user defaults
[Defaults_users]
Subtree[]
Subtree[]=5
ParentClassIdentifiers[]
ParentClassIdentifiers[]=user_group
Columns[]
Columns[]=name
Columns[]=modifier
Columns[]=published
