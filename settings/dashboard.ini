#?ini charset="utf-8"?

[DashboardSettings]
# DashboardBlocks[]=example
DashboardBlocks[]=pending_list
DashboardBlocks[]=drafts
DashboardBlocks[]=latest_content
DashboardBlocks[]=all_latest_content
DashboardBlocks[]=audit
# DashboardBlocks[]=community_activity
# DashboardBlocks[]=wishlist

# [DashboardBlock_example]
# By default system will load /dashboard/[block_identifier].tpl template
# e.g if INI group is called [Dashboard_example] then system will load /dashboard/example.tpl file
# If Template variable is specified then it will be used instead of default location
# Template=example.tpl

# Priority determines the order in which the blocks will be rendered
# Priority=10

# List of policies, either in "<node_id>" or "<module>/<function>" form
# In case of node id, content/read is checked!
# The block is left out unless the user has every one of them.
# PolicyList[]

# The addresses the block is about or links to, "<module>/<view>[/<parameters>]" or a URL alias.
# The block is left out unless the user can open every one of them, checked the way the kernel
# checks the request (expViewAccess: the view's policy functions with their limitations, a module
# without functions as a whole, the siteaccess rules, the user/login SiteAccess limitation, and the
# node or object of content/view and content/edit). Use it for what PolicyList cannot say: a view
# whose functions are "a or b", a view without functions, an extension's module.
# ViewList[]

# Controls how many items are fetched and displayed in the dashboard block
# Value available as a {$block.number_of_items} variable
# NumberOfItems=10

[DashboardBlock_pending_list]
Priority=10
NumberOfItems=10
PolicyList[]=content/pendinglist
ViewList[]=content/pendinglist

# The latest security events (notice or worse, access and system channels), the alerts of the last
# day and, for audit/manage, the "audit is off" and "chain broken" warnings (doc/bc/6.0/audit.md).
[DashboardBlock_audit]
Priority=20
NumberOfItems=10
PolicyList[]=audit/read
ViewList[]=audit/console

[DashboardBlock_drafts]
Priority=30
NumberOfItems=10
PolicyList[]=content/edit
ViewList[]=content/draft

[DashboardBlock_all_latest_content]
Priority=40
NumberOfItems=10
PolicyList[]=content/read

[DashboardBlock_latest_content]
Priority=50
NumberOfItems=10
PolicyList[]=content/read

[DashboardBlock_community_activity]
Priority=60
NumberOfItems=20
PolicyList[]=content/read

